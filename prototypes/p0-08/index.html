  <style data-inline-source="assets/css/global.css">
/* ========================================
   Global B端 Design Tokens & Shared Components
   ======================================== */

:root {
  /* ---- Color Palette ---- */
  --color-primary: #3370ff;
  --color-primary-hover: #2860e1;
  --color-success: #34c759;
  --color-warning: #ff9500;
  --color-danger: #ff3b30;
  --color-info: #5ac8fa;

  --color-text-primary: #1f2329;
  --color-text-secondary: #646a73;
  --color-text-disabled: #c0c4cc;
  --color-text-placeholder: #8f959e;

  --color-bg-page: #f5f6f8;
  --color-bg-white: #ffffff;
  --color-bg-hover: #f2f3f5;

  --color-border: #e5e6eb;
  --color-border-light: #f0f1f5;
  --color-divider: #ebecf0;

  /* ---- Typography ---- */
  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
  --font-size-xs: 12px;
  --font-size-sm: 13px;
  --font-size-base: 14px;
  --font-size-lg: 16px;
  --font-size-xl: 20px;
  --font-size-xxl: 24px;

  /* ---- Spacing ---- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-lg: 16px;
  --spacing-xl: 24px;
  --spacing-xxl: 32px;

  /* ---- Border Radius ---- */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;

  /* ---- Shadows ---- */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
}

/* ---- Reset ---- */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  color: var(--color-text-primary);
  background: var(--color-bg-page);
  font-family: var(--font-family);
  font-size: var(--font-size-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a {
  color: var(--color-primary);
  text-decoration: none;
}

a:hover {
  color: var(--color-primary-hover);
}

/* ---- Shared Component: Button ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 32px;
  padding: 0 var(--spacing-lg);
  font-size: var(--font-size-base);
  font-weight: 500;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-bg-white);
  color: var(--color-text-primary);
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
  white-space: nowrap;
}

.btn:hover {
  border-color: var(--color-primary);
  color: var(--color-primary);
}

.btn:disabled {
  color: var(--color-text-disabled);
  cursor: not-allowed;
}

.btn-primary {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

.btn-primary:hover {
  background: var(--color-primary-hover);
  border-color: var(--color-primary-hover);
  color: #fff;
}

.btn-danger {
  background: var(--color-danger);
  border-color: var(--color-danger);
  color: #fff;
}

.btn-danger:hover {
  opacity: 0.85;
  color: #fff;
}

/* ---- Shared Component: Table ---- */
.table-wrapper {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--font-size-base);
}

thead th {
  padding: var(--spacing-md) var(--spacing-lg);
  text-align: left;
  font-weight: 600;
  color: var(--color-text-secondary);
  background: var(--color-bg-hover);
  border-bottom: 1px solid var(--color-border);
  white-space: nowrap;
}

tbody td {
  padding: var(--spacing-md) var(--spacing-lg);
  border-bottom: 1px solid var(--color-border-light);
}

tbody tr:hover {
  background: var(--color-bg-hover);
}

/* ---- Shared Component: Form ---- */
.form-group {
  margin-bottom: var(--spacing-lg);
}

.form-label {
  display: block;
  margin-bottom: var(--spacing-xs);
  font-size: var(--font-size-base);
  font-weight: 500;
  color: var(--color-text-primary);
}

.form-input,
.form-select,
.form-textarea {
  width: 100%;
  height: 32px;
  padding: 0 var(--spacing-md);
  font-size: var(--font-size-base);
  font-family: var(--font-family);
  color: var(--color-text-primary);
  background: var(--color-bg-white);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  outline: none;
  transition: border-color 0.2s ease;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus {
  border-color: var(--color-primary);
}

.form-input::placeholder {
  color: var(--color-text-placeholder);
}

.form-textarea {
  height: auto;
  min-height: 80px;
  padding: var(--spacing-sm) var(--spacing-md);
  resize: vertical;
}

/* ---- Shared Component: Card ---- */
.card {
  background: var(--color-bg-white);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--spacing-xl);
  box-shadow: var(--shadow-sm);
}

/* ---- Shared Component: Modal / Dialog ---- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal-content {
  background: var(--color-bg-white);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  min-width: 420px;
  max-width: 90vw;
  max-height: 80vh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--spacing-lg) var(--spacing-xl);
  border-bottom: 1px solid var(--color-border);
}

.modal-body {
  padding: var(--spacing-xl);
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: var(--spacing-sm);
  padding: var(--spacing-lg) var(--spacing-xl);
  border-top: 1px solid var(--color-border);
}

/* ---- Shared Component: Pagination ---- */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-xs);
  padding: var(--spacing-lg) 0;
}

.pagination-item {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 32px;
  height: 32px;
  padding: 0 var(--spacing-sm);
  font-size: var(--font-size-base);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-bg-white);
  color: var(--color-text-primary);
  cursor: pointer;
  transition: all 0.2s ease;
}

.pagination-item:hover {
  border-color: var(--color-primary);
  color: var(--color-primary);
}

.pagination-item.active {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

/* ---- Shared Component: Advanced Search Bar ---- */
.search-bar {
  display: flex;
  align-items: center;
  gap: var(--spacing-md);
  padding: var(--spacing-lg);
  background: var(--color-bg-white);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  margin-bottom: var(--spacing-lg);
}

.search-bar .form-input,
.search-bar .form-select {
  width: auto;
  min-width: 160px;
}

/* ---- Utility ---- */
.text-secondary {
  color: var(--color-text-secondary);
}

.text-muted {
  color: var(--color-text-disabled);
}

.mt-lg {
  margin-top: var(--spacing-lg);
}

.mb-lg {
  margin-bottom: var(--spacing-lg);
}

</style>

/* ---- Activity Center Prototype Layout ---- */
:root {
  --activity-blue: #2f7ef7;
  --activity-blue-soft: #edf5ff;
  --activity-navy: #172536;
  --activity-border: #e7eaf0;
}

.app-layout {
  display: flex;
  min-height: 100vh;
  background: #f5f7fa;
}

.app-sidebar {
  position: sticky;
  top: 0;
  width: 216px;
  height: 100vh;
  flex-shrink: 0;
  padding: 74px 0 20px;
  overflow-y: auto;
  color: #b7c2ce;
  background:
    linear-gradient(rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.035)) 0 0 / 100% 54px no-repeat,
    var(--activity-navy);
}

.app-sidebar::before {
  content: "NISSAN  新零售营销系统";
  position: absolute;
  top: 0;
  left: 0;
  display: flex;
  align-items: center;
  width: 100%;
  height: 54px;
  padding: 0 18px;
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .5px;
  border-bottom: 1px solid rgba(255, 255, 255, .08);
}

.app-sidebar .nav-link {
  min-height: 42px;
  padding: 10px 18px;
  color: #9aa8b7;
  border-left: 3px solid transparent;
}

.app-sidebar .nav-list--sub .nav-link {
  padding-left: 51px;
  font-size: 13px;
}

.app-sidebar .nav-link:hover,
.app-sidebar .nav-link.active {
  color: #fff;
  background: rgba(47, 126, 247, .18);
  border-left-color: var(--activity-blue);
}

.app-sidebar .nav-link--group {
  color: #d4dbe3;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0;
  text-transform: none;
}

.app-sidebar .nav-icon {
  width: 18px;
  color: #9fb0c1;
  text-align: center;
}

.app-main {
  width: calc(100% - 216px);
  min-width: 0;
  padding: 0;
  overflow: visible;
  background: #f5f7fa;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 54px;
  padding: 0 24px;
  color: #4d5968;
  background: #fff;
  border-bottom: 1px solid var(--activity-border);
}

.topbar-left,
.topbar-right {
  display: flex;
  align-items: center;
  gap: 18px;
}

.topbar-left {
  font-size: 13px;
}

.topbar-right {
  font-size: 12px;
}

.icon-btn,
.close-btn {
  padding: 0;
  color: inherit;
  background: transparent;
  border: 0;
  cursor: pointer;
}

.icon-btn {
  font-size: 18px;
}

.search-hint {
  width: 184px;
  padding: 6px 12px;
  color: #a1a8b3;
  border: 1px solid var(--activity-border);

}

.breadcrumb {

  padding: 10px 24px;
  color: #8a94a3;
  font-size: 12px;
  background: #f4f6fa;
}

.breadcrumb span {
  padding: 0 7px;
  color: #bbc1ca;
}

.module-tabs {

  gap: 2px;
  padding: 0 20px;
  overflow-x: auto;
  background: #eaf1ff;
  border-bottom: 1px solid #dce6f8;
}

.module-tabs span {

.module-tabs span.active {

.page-head {

(function () {
  'use strict';

  window.showToast = function (message, tone) {
    var old = document.getElementById('prototypeToast');
    if (old) old.remove();
    var toast = document.createElement('div');
    toast.id = 'prototypeToast';
    toast.className = 'toast ' + (tone || 'success');
    toast.setAttribute('role', 'status');
    toast.textContent = message;
    document.body.appendChild(toast);
    window.setTimeout(function () { toast.classList.add('show'); }, 20);
    window.setTimeout(function () {
      toast.classList.remove('show');
      window.setTimeout(function () { toast.remove(); }, 220);
    }, 2200);
  };
})();

      ? '<div class="point-config-card">' +
          '<div class="point-amount"><strong>' + config.points + '</strong><span>积分</span></div>' +
          '<div class="point-meta"><h3>' + config.name + '</h3><p>' + config.id + ' · ' + config.version + ' · ' + config.mainScenario + ' / ' + config.subScenario + '</p><div><span>有效期：' + config.validity + '</span><span>发放到：' + config.issueTarget + '</span></div></div>' +
          '<div class="point-actions"><span class="status-chip status-published">' + config.status + '</span><button class="link-btn" id="changePointConfig">更换</button><button class="link-btn danger" id="removePointConfig">移除</button></div>' +

      '<div class="section-head point-head"><div class="reward-block-title"><span class="reward-index points">2</span><div><h2>积分奖励配置</h2><p>目标态：引用已启用积分配置；发放时锁定用户默认卡 VIN。</p></div></div></div>' +
      '<div class="point-section-body">' + content + '</div>' +
    '</section>';

  function pointRows() {
    return data.pointConfigs.map(function (item) {
      var disabled = !item.valid;
      return '<tr class="' + (disabled ? 'row-disabled' : '') + '">' +
        '<td><input type="radio" name="pointConfig" value="' + item.id + '" ' + (selectedPointId === item.id ? 'checked' : '') + ' ' + (disabled ? 'disabled' : '') + ' aria-label="选择' + item.name + '"></td>' +

        '<td><strong class="points-number">' + item.points + '</strong></td>' +
        '<td>' + item.mainScenario + '<small>' + item.subScenario + '</small></td>' +
        '<td>' + item.validity + '</td>' +

        '<div class="modal-body point-table-wrap"><table class="selector-table"><thead><tr><th>选择</th><th>配置名称 / 编码</th><th>积分</th><th>业务场景</th><th>有效期</th><th>状态</th></tr></thead><tbody>' + pointRows() + '</tbody></table></div>' +
        '<div class="modal-footer"><button class="btn" data-close-point>取消</button><button class="btn btn-primary" id="confirmPointConfig">确认选择</button></div></div>' +
      '</div>');

      btn.addEventListener('click', closePointSelector);
    });

      var chosen = document.querySelector('input[name="pointConfig"]:checked');
      if (!chosen) {
        window.showToast('请选择一项已启用积分配置', 'error');
        return;
      }
      selectedPointId = chosen.value;
      closePointSelector();
      updatePointSection();
      window.showToast('积分配置已添加');
    });
  }

  function closePointSelector() {
    var modal = document.getElementById('pointSelector');
    if (modal) modal.remove();
  }

  function updatePointSection() {
    var block = document.getElementById('pointRewardBlock');
    if (block) block.innerHTML = pointSectionTemplate();
    bindPointActions();
  }

  function bindPointActions() {
    var open = document.getElementById('openPointSelector');
    if (open) open.addEventListener('click', openPointSelector);
    var change = document.getElementById('changePointConfig');
    if (change) change.addEventListener('click', openPointSelector);
    var remove = document.getElementById('removePointConfig');

      selectedPointId = null;

      window.showToast('已移除积分奖励', 'neutral');

  function updateRewardVisibility() {
    var couponBlock = document.getElementById('couponRewardBlock');
    var pointBlock = document.getElementById('pointRewardBlock');
    if (couponBlock) couponBlock.hidden = rewardMode === 'points';
    if (pointBlock) pointBlock.hidden = rewardMode === 'coupon';
    document.querySelectorAll('[data-reward-mode]').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-reward-mode') === rewardMode);
    });
    updatePointSection();
  }

  function filteredCoupons() {
    return data.coupons.filter(function (item) {
      var typeMatch = currentType === '全部' || item.type === currentType;
      var term = keyword.trim().toLowerCase();
      var keywordMatch = !term || (item.name + item.id + item.scene).toLowerCase().indexOf(term) > -1;
      return typeMatch && keywordMatch;
    });
  }

  function selectorRows() {
    var items = filteredCoupons();
    if (!items.length) {
      return '<tr><td colspan="7"><div class="empty-state compact">没有符合条件的卡券</div></td></tr>';
    }
    return items.map(function (item) {
      var checked = draftIds.has(item.id);
      var disabled = !item.valid;
      var rule = item.type === '兑换券'
        ? '<strong>' + item.summary + '</strong><small>' + item.mode + ' · ' + item.fulfillment + ' · 绑定' + item.bindTarget + '</small>'
        : '<strong>' + item.summary + '</strong><small>' + item.fulfillment + ' · 绑定' + item.bindTarget + '</small>';

        '<td><input class="coupon-checkbox" type="checkbox" data-select-id="' + item.id + '" ' + (checked ? 'checked' : '') + ' ' + (disabled ? 'disabled' : '') + ' aria-label="选择' + item.name + '"></td>' +

      '</tr>';
    }).join('');

  function selectorTemplate() {

      '全部': data.coupons.length,
      '立减券': data.coupons.filter(function (x) { return x.type === '立减券'; }).length,
      '折扣券': data.coupons.filter(function (x) { return x.type === '折扣券'; }).length,

        '<div class="selection-summary"><div><strong>已选 <span id="draftCount">' + draftIds.size + '</span> 张</strong><span id="selectedNames">' + selectedNames() + '</span></div><button class="link-btn" id="clearSelection">清空选择</button></div>' +
        '<div class="modal-footer"><button class="btn" data-close-selector>取消</button><button class="btn btn-primary" id="confirmCoupons">确认关联（' + draftIds.size + '）</button></div>' +
      '</div>' +
    '</div>';
  }

  function selectedNames() {
    var names = Array.from(draftIds).map(couponById).filter(Boolean).map(function (x) { return x.name; });
    return names.length ? names.join('、') : '尚未选择卡券';
  }

  function openSelector() {
    draftIds = new Set(confirmedIds);
    currentType = '全部';
    keyword = '';
    document.body.insertAdjacentHTML('beforeend', selectorTemplate());
    bindSelector();
  }

  function rerenderSelector() {
    var body = document.getElementById('selectorRows');
    if (body) body.innerHTML = selectorRows();
    var count = document.getElementById('draftCount');
    if (count) count.textContent = draftIds.size;
    var names = document.getElementById('selectedNames');
    if (names) names.textContent = selectedNames();
    var confirm = document.getElementById('confirmCoupons');
    if (confirm) confirm.textContent = '确认关联（' + draftIds.size + '）';
    document.querySelectorAll('[data-filter-type]').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-filter-type') === currentType);
    });
    bindSelectorRows();
  }

  function bindSelectorRows() {
    document.querySelectorAll('[data-select-id]').forEach(function (checkbox) {
      checkbox.addEventListener('change', function () {
        var id = this.getAttribute('data-select-id');
        if (this.checked) draftIds.add(id); else draftIds.delete(id);
        rerenderSelector();
      });
    });
    document.querySelectorAll('#couponSelector [data-detail]').forEach(function (btn) {
      btn.addEventListener('click', function () { openDetail(this.getAttribute('data-detail')); });
    });
  }

  function bindSelector() {
    document.querySelectorAll('[data-close-selector]').forEach(function (btn) {
      btn.addEventListener('click', closeSelector);
    });

      btn.addEventListener('click', function () {
        currentType = this.getAttribute('data-filter-type');
        rerenderSelector();
      });
    });
    document.getElementById('searchCoupon').addEventListener('click', function () {
      keyword = document.getElementById('couponKeyword').value;
      rerenderSelector();
    });
    document.getElementById('couponKeyword').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        keyword = this.value;
        rerenderSelector();
      }
    });
    document.getElementById('resetCoupon').addEventListener('click', function () {
      keyword = '';
      currentType = '全部';
      document.getElementById('couponKeyword').value = '';
      rerenderSelector();
    });
    document.getElementById('clearSelection').addEventListener('click', function () {
      draftIds.clear();
      rerenderSelector();

      confirmedIds = new Set(draftIds);
      closeSelector();
      updateConfirmed();
      window.showToast('已关联 ' + confirmedIds.size + ' 张卡券');

          detailItem('兑换模式', item.mode) +
          detailItem('候选商品 / 可兑数量', item.candidateCount + ' 个候选 / 可兑 ' + item.redeemQuantity + ' 件') +
          detailItem('同 SKU 多件', item.allowSameSku ? '允许（受单商品上限约束）' : '不允许') +
          detailItem('履约方式', item.fulfillment) +
          detailItem('绑定对象', item.bindTarget + '（发放时绑定）') +
          detailItem('有效期', item.validity) +
        '</div>' +
        '<div class="product-summary"><h3>候选商品摘要</h3><div>' + item.products.map(function (p) { return '<span>' + p + '</span>'; }).join('') + '</div></div>' +
        '<div class="readonly-note">本页仅展示卡券中心返回的规则摘要。若需修改商品或兑换规则，请前往卡券中心编辑。</div>'
      : '<div class="detail-grid">' + detailItem('优惠规则', item.summary) + detailItem('核销方式', item.fulfillment) + detailItem('绑定对象', item.bindTarget) + detailItem('有效期', item.validity) + '</div>';
    document.body.insertAdjacentHTML('beforeend',
      '<div class="modal-overlay detail-overlay" id="couponDetail" role="dialog" aria-modal="true">' +
        '<div class="modal-content detail-modal"><div class="modal-header"><div><h2>' + item.name + '</h2><p>' + item.id + ' · ' + item.scene + '</p></div><button class="close-btn" data-close-detail>×</button></div>' +
        '<div class="modal-body"><div class="detail-title-row">' + typeChip(item) + statusChip(item) + '<span>来源：' + item.source + '</span></div>' + exchangeContent + '</div>' +
        '<div class="modal-footer"><button class="btn btn-primary" data-close-detail>我知道了</button></div></div>' +
      '</div>');
    document.querySelectorAll('[data-close-detail]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var detail = document.getElementById('couponDetail');
        if (detail) detail.remove();
      });
    });
  }

  function detailItem(label, value) {
    return '<div><span>' + label + '</span><strong>' + value + '</strong></div>';
  }

  function updateConfirmed() {
    var list = document.getElementById('confirmedCouponList');
    if (list) list.innerHTML = confirmedTable();
    var count = document.getElementById('confirmedCount');
    if (count) count.textContent = confirmedIds.size;
    bindConfirmedActions();
  }

  function bindConfirmedActions() {
    document.querySelectorAll('#confirmedCouponList [data-detail]').forEach(function (btn) {
      btn.addEventListener('click', function () { openDetail(this.getAttribute('data-detail')); });
    });
    document.querySelectorAll('[data-remove]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var item = couponById(this.getAttribute('data-remove'));
        confirmedIds.delete(item.id);
        updateConfirmed();
        window.showToast('已移除“' + item.name + '”', 'neutral');
      });
    });
  }

  function initPage() {
    [document.getElementById('openCouponSelector'), document.getElementById('openCouponSelectorBottom')].forEach(function (btn) {
      if (btn) btn.addEventListener('click', openSelector);
    });
    document.querySelectorAll('[data-reward-mode]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        rewardMode = this.getAttribute('data-reward-mode');
        updateRewardVisibility();
      });
    });
    document.querySelectorAll('[data-save]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        window.showToast('草稿已保存，奖励配置已保留');
      });
    });
    var submit = document.querySelector('[data-submit]');
    if (submit) submit.addEventListener('click', function () {
      if ((rewardMode === 'points' || rewardMode === 'combo') && !selectedPointId) {
        window.showToast('请先选择积分配置，再提交审核', 'error');
        return;
      }
      window.showToast('活动配置校验通过，可提交审核');
    });
    var next = document.getElementById('nextStep');
    if (next) next.addEventListener('click', function () {
      var needsCoupon = rewardMode === 'coupon' || rewardMode === 'combo';
      var needsPoints = rewardMode === 'points' || rewardMode === 'combo';
      if (needsCoupon && !confirmedIds.size) return window.showToast('请至少关联一张卡券', 'error');
      if (needsPoints && !selectedPointId) return window.showToast('请选择一项积分配置', 'error');
      window.showToast('校验通过：进入 step3 活动对象');
    });
    bindConfirmedActions();
    bindPointActions();
    updateRewardVisibility();
  }

  var page = { render: pageTemplate, init: initPage };
  window.Pages.index = page;
  window.Pages['activity-create'] = page;
  window.Pages['activity-list'] = page;
  window.Pages['activity-relation'] = page;
  window.Pages.workbench = page;
  window.Pages['coupon-center'] = page;

  function boot() {
    var app = document.getElementById('app');
    if (!app) return;
    app.innerHTML = page.render();
    page.init();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
  <script data-inline-source="js/nav.js">
(function () {
  'use strict';

  var _config = null;
  var _currentPage = 'index';

  /* ---- Load nav config from config/nav.json ---- */
  function loadConfig() {
    return fetch('config/nav.json')
      .then(function (res) { return res.json(); })
      .then(function (cfg) {
        _config = cfg;
        render();
      })
      .catch(function (err) {
        console.warn('Failed to load config/nav.json, using empty menu:', err);
        var navEl = document.getElementById('main-nav');
        if (navEl) {
          navEl.innerHTML = '<p style="padding:16px;color:#ff4d4f;font-size:12px;line-height:1.6;">⚠️ 导航加载失败<br>请通过 HTTP 服务器打开页面：<br><code>python3 -m http.server 8080</code></p>';
        }
      });
  }

  /* ---- Render menu tree into #main-nav ---- */
  function render() {
    var navEl = document.getElementById('main-nav');
    if (!navEl || !_config || !_config.menu) return;
    var html = buildTree(_config.menu, 0);
    navEl.innerHTML = html;
    bindClicks(navEl);
    highlightCurrent();
  }

  function buildTree(items, depth) {
    if (!items || !items.length) return '';
    var cls = depth === 0 ? 'nav-list nav-list--root' : 'nav-list nav-list--sub';
    return '<ul class="' + cls + '">' + items.map(function (item) {
      var hasChildren = item.children && item.children.length;
      var linkCls = 'nav-link' + (hasChildren ? ' nav-link--group' : '');
      var icon = item.icon ? '<span class="nav-icon">' + item.icon + '</span>' : '';
      return '<li class="nav-item' + (hasChildren ? ' nav-item--group' : '') + '">' +
        '<a href="#" class="' + linkCls + '" data-page="' + (item.key || '') + '">' +
        icon + '<span class="nav-label">' + (item.label || '') + '</span></a>' +
        (hasChildren ? buildTree(item.children, depth + 1) : '') +
        '</li>';
    }).join('') + '</ul>';
  }

  function bindClicks(navEl) {
    var links = navEl.querySelectorAll('.nav-link[data-page]');
    Array.prototype.forEach.call(links, function (link) {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        var pageKey = this.getAttribute('data-page');
        if (pageKey) window.navigateTo(pageKey);
      });
    });
  }

  function highlightCurrent() {
    var navEl = document.getElementById('main-nav');
    if (!navEl) return;
    var prev = navEl.querySelector('.nav-link.active');
    if (prev) prev.classList.remove('active');
    var cur = navEl.querySelector('.nav-link[data-page="' + _currentPage + '"]');
    if (cur) cur.classList.add('active');
  }

  /* ---- Navigate to page ---- */
  window.navigateTo = function (pageKey) {
    _currentPage = pageKey;
    var page = window.Pages && window.Pages[pageKey];
    if (!page || typeof page.render !== 'function') return;
    document.getElementById('app').innerHTML = page.render();
    if (typeof page.init === 'function') page.init();
    highlightCurrent();
  };

  window.getCurrentPage = function () {
    return _currentPage;
  };

  window.getNavConfig = function () {
    return _config;
  };

  /* ---- Init ---- */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadConfig);
  } else {
    loadConfig();
  }
})();

  <script data-inline-source="annotations/annotation-runtime.js">
(function () {
  'use strict';

  var visible = true;
  var activePopup = null;
  var currentAnno = null;
  var dragState = null;
  var observer = null;

  var sectionFields = [
    ['functionName', '功能名称'],
    ['functionDesc', '功能说明'],
    ['permissionScope', '权限范围'],
    ['dataSource', '数据来源'],
    ['valueLogic', '取值逻辑'],
    ['fieldDesc', '字段说明'],
    ['interactionDesc', '交互说明'],
    ['judgeRule', '判断规则'],
    ['exceptionRule', '异常规则'],
    ['otherDesc', '其他说明']
  ];

  function getConfig() {
    return window.AnnotationConfig || {};
  }

  function getPageKey() {
    var cfg = getConfig();
    if (typeof cfg.page === 'function') return cfg.page();
    if (cfg.page) return cfg.page;
    var active = document.querySelector('.nav-sub-item.active');
    return active && active.id ? active.id : 'index';
  }

  function getRawAnnotations() {
    var cfg = getConfig();
    var page = getPageKey();
    if (cfg.dataKey && Array.isArray(window[cfg.dataKey])) {
      return window[cfg.dataKey].filter(function (item) { return item.page === page; });
    }
    if (window.AnnotationData && Array.isArray(window.AnnotationData[page])) {
      return window.AnnotationData[page];
    }
    return [];
  }

  function storageKey() {
    var cfg = getConfig();
    var projectId = cfg.projectId || window.location.pathname || 'default-project';
    var dataVersion = cfg.dataVersion || '1';
    return ['prototype_annotations', projectId, dataVersion, getPageKey()].join('_');
  }

  function loadCached() {
    try {
      var raw = window.localStorage.getItem(storageKey());
      return raw ? JSON.parse(raw) : [];
    } catch (err) {
      return [];
    }
  }

  function saveCached(items) {
    try {
      window.localStorage.setItem(storageKey(), JSON.stringify(items));
    } catch (err) {
      showToast('保存到浏览器缓存失败');
    }
  }

  function getAnnotations() {
    var source = getRawAnnotations();
    if (!source.length) return [];
    var cached = loadCached();
    var cachedMap = {};
    cached.forEach(function (item) {
      if (item && item.id != null) cachedMap[item.id] = item;
    });
    return source.map(function (item) {
      return clone(cachedMap[item.id] || item);
    }).sort(function (a, b) {
      return Number(a.id) - Number(b.id);
    });
  }

  function clone(value) {
    return JSON.parse(JSON.stringify(value || {}));
  }

  function ensureToggle() {
    var buttons = document.querySelectorAll('#anno-toggle-btn');
    buttons.forEach(function (btn, index) {
      if (index > 0) btn.remove();
    });
    var btn = document.getElementById('anno-toggle-btn');
    if (!btn) {
      btn = document.createElement('button');
      btn.id = 'anno-toggle-btn';
      btn.type = 'button';
      btn.title = '显示/隐藏标注';
      btn.textContent = '●';
      btn.addEventListener('click', function () {
        visible = !visible;
        btn.classList.toggle('anno-hidden', !visible);
        closePopup();
        render();
      });
      document.body.appendChild(btn);
    }
    placeToggle(btn);
  }

  function placeToggle(btn) {
    var topBar = document.querySelector('.top-bar');
    var sideMenu = document.querySelector('.side-menu, .sidebar, .nav-panel');
    var top = topBar ? topBar.getBoundingClientRect().bottom + 12 : 16;
    var left = sideMenu ? sideMenu.getBoundingClientRect().right + 16 : 16;
    btn.style.top = Math.max(16, top) + 'px';
    btn.style.left = Math.max(16, left) + 'px';
  }

  function ensureOverlay() {
    var overlay = document.getElementById('anno-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'anno-overlay';
      document.body.appendChild(overlay);
    }
    return overlay;
  }

  function render() {
    ensureToggle();
    var overlay = ensureOverlay();
    overlay.innerHTML = '';
    if (!visible) return;
    getAnnotations().forEach(function (anno, index) {
      var target = resolveTarget(anno.target);
      if (!target) return;
      var marker = document.createElement('button');
      marker.type = 'button';
      marker.className = 'anno-marker';
      marker.textContent = anno.id || String(index + 1);
      marker.title = anno.title || '';
      marker.addEventListener('click', function (event) {
        event.stopPropagation();
        openPopup(anno, marker);
      });
      overlay.appendChild(marker);
      positionMarker(marker, target, anno.position);
    });
  }

  function resolveTarget(selector) {
    if (!selector) return null;
    try {
      var nodes = document.querySelectorAll(selector);
      return nodes.length === 1 ? nodes[0] : null;
    } catch (err) {
      return null;
    }
  }

  function positionMarker(marker, target, position) {
    var rect = target.getBoundingClientRect();
    var pos = position || {};
    var placement = pos.placement || 'top-right';
    var x = rect.right;
    var y = rect.top;
    if (placement.indexOf('left') >= 0) x = rect.left;
    if (placement.indexOf('bottom') >= 0) y = rect.bottom;
    if (placement.indexOf('center') >= 0) y = rect.top + rect.height / 2;
    marker.style.left = Math.round(x + Number(pos.offsetX || 0) - 10) + 'px';
    marker.style.top = Math.round(y + Number(pos.offsetY || 0) - 10) + 'px';
  }

  function openPopup(anno, marker) {
    closePopup();
    currentAnno = clone(anno);
    currentAnno.desc = currentAnno.desc || generateDesc(currentAnno.sections);
    activePopup = document.createElement('div');
    activePopup.className = 'anno-popup';
    activePopup.innerHTML = buildViewHTML(currentAnno);
    document.body.appendChild(activePopup);
    positionPopup(activePopup, marker);
    bindViewEvents();
    bindDrag();
  }

  function positionPopup(popup, marker) {
    var rect = marker.getBoundingClientRect();
    var popupWidth = popup.offsetWidth;
    var popupHeight = popup.offsetHeight;
    var left = rect.right + 12;
    var top = rect.top;
    if (left + popupWidth > window.innerWidth - 16) {
      left = rect.left - popupWidth - 12;
    }
    left = Math.max(16, Math.min(left, window.innerWidth - popupWidth - 16));
    top = Math.max(16, Math.min(top, window.innerHeight - popupHeight - 16));
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  }

  function fitPopupToViewport(popup) {
    if (!popup) return;
    var rect = popup.getBoundingClientRect();
    var left = Math.max(16, Math.min(rect.left, window.innerWidth - rect.width - 16));
    var top = Math.max(16, Math.min(rect.top, window.innerHeight - rect.height - 16));
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  }

  function buildViewHTML(anno) {
    return ''
      + '<div class="anno-popup-header">'
      + '  <div class="anno-popup-title">' + escapeHTML(anno.title || '未命名标注') + '</div>'
      + '  <button class="anno-popup-close" type="button" title="关闭">&times;</button>'
      + '</div>'
      + '<div class="anno-popup-body"><div class="anno-popup-desc">' + (anno.desc || generateDesc(anno.sections)) + '</div></div>'
      + '<div class="anno-popup-footer">'
      + '  <button class="anno-btn anno-copy" type="button">复制数据</button>'
      + '  <button class="anno-btn anno-btn-primary anno-edit" type="button">编辑</button>'
      + '</div>';
  }

  function buildEditHTML(anno) {
    var sections = anno.sections || {};
    var fields = sectionFields.map(function (field) {
      return ''
        + '<div class="anno-edit-field">'
        + '  <label class="anno-edit-label">' + field[1] + '</label>'
        + '  <textarea class="anno-edit-textarea" data-section="' + field[0] + '">' + escapeHTML(sections[field[0]] || '') + '</textarea>'
        + '</div>';
    }).join('');
    return ''
      + '<div class="anno-popup-header">'
      + '  <div class="anno-popup-title">编辑标注</div>'
      + '  <button class="anno-popup-close" type="button" title="关闭">&times;</button>'
      + '</div>'
      + '<div class="anno-popup-body">'
      + '  <div class="anno-edit-field">'
      + '    <label class="anno-edit-label">标注标题</label>'
      + '    <input class="anno-edit-input" id="anno-edit-title" value="' + escapeHTML(anno.title || '') + '">'
      + '  </div>'
      + fields
      + '</div>'
      + '<div class="anno-popup-footer">'
      + '  <button class="anno-btn anno-cancel" type="button">取消</button>'
      + '  <button class="anno-btn anno-copy" type="button">复制数据</button>'
      + '  <button class="anno-btn anno-btn-primary anno-save" type="button">保存</button>'
      + '</div>';
  }

  function bindViewEvents() {
    activePopup.querySelector('.anno-popup-close').addEventListener('click', closePopup);
    activePopup.querySelector('.anno-copy').addEventListener('click', copyCurrent);
    activePopup.querySelector('.anno-edit').addEventListener('click', function () {
      activePopup.innerHTML = buildEditHTML(currentAnno);
      bindEditEvents();
      bindDrag();
      fitPopupToViewport(activePopup);
    });
  }

  function bindEditEvents() {
    activePopup.querySelector('.anno-popup-close').addEventListener('click', closePopup);
    activePopup.querySelector('.anno-cancel').addEventListener('click', function () {
      activePopup.innerHTML = buildViewHTML(currentAnno);
      bindViewEvents();
      bindDrag();
      fitPopupToViewport(activePopup);
    });
    activePopup.querySelector('.anno-copy').addEventListener('click', copyCurrent);
    activePopup.querySelector('.anno-save').addEventListener('click', saveEdit);
  }

  function saveEdit() {
    currentAnno.title = activePopup.querySelector('#anno-edit-title').value.trim();
    currentAnno.sections = {};
    activePopup.querySelectorAll('[data-section]').forEach(function (field) {
      currentAnno.sections[field.getAttribute('data-section')] = field.value.trim();
    });
    sectionFields.forEach(function (field) {
      if (!(field[0] in currentAnno.sections)) currentAnno.sections[field[0]] = '';
    });
    currentAnno.desc = generateDesc(currentAnno.sections);
    var items = getAnnotations();
    var found = false;
    items = items.map(function (item) {
      if (item.id === currentAnno.id) {
        found = true;
        return clone(currentAnno);
      }
      return item;
    });
    if (!found) items.push(clone(currentAnno));
    saveCached(items);
    activePopup.innerHTML = buildViewHTML(currentAnno);
    bindViewEvents();
    bindDrag();
    fitPopupToViewport(activePopup);
    showToast('已保存到浏览器缓存');
  }

  function copyCurrent() {
    if (!currentAnno) return;
    copyText(JSON.stringify(currentAnno, null, 2));
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { showToast('数据已复制'); });
      return;
    }
    var input = document.createElement('textarea');
    input.value = text;
    input.style.position = 'fixed';
    input.style.left = '-9999px';
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    input.remove();
    showToast('数据已复制');
  }

  function bindDrag() {
    var header = activePopup.querySelector('.anno-popup-header');
    header.addEventListener('mousedown', function (event) {
      if (event.target.closest('button')) return;
      var rect = activePopup.getBoundingClientRect();
      dragState = { x: event.clientX - rect.left, y: event.clientY - rect.top };
      event.preventDefault();
    });
  }

  function closePopup() {
    if (activePopup) activePopup.remove();
    activePopup = null;
    currentAnno = null;
    dragState = null;
  }

  function generateDesc(sections) {
    var data = sections || {};
    return sectionFields.map(function (field, index) {
      return (index + 1) + '. ' + field[1] + '：' + escapeHTML(data[field[0]] || '待确认');
    }).join('<br>');
  }

  function escapeHTML(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function showToast(text) {
    var old = document.querySelector('.anno-toast');
    if (old) old.remove();
    var toast = document.createElement('div');
    toast.className = 'anno-toast';
    toast.textContent = text;
    document.body.appendChild(toast);
    setTimeout(function () { toast.remove(); }, 1800);
  }

  document.addEventListener('mousemove', function (event) {
    if (!dragState || !activePopup) return;
    var x = Math.max(8, Math.min(event.clientX - dragState.x, window.innerWidth - activePopup.offsetWidth - 8));
    var y = Math.max(8, Math.min(event.clientY - dragState.y, window.innerHeight - activePopup.offsetHeight - 8));
    activePopup.style.left = x + 'px';
    activePopup.style.top = y + 'px';
  });

  document.addEventListener('mouseup', function () {
    dragState = null;
    fitPopupToViewport(activePopup);
  });

  window.addEventListener('resize', function () {
    render();
    fitPopupToViewport(activePopup);
  });
  window.addEventListener('scroll', render, true);

  function observeChanges() {
    var root = document.getElementById('page-content') || document.body;
    var _lastRender = 0;
    var _rafPending = false;

    function scheduleRender() {
      var now = Date.now();
      // Burst protection: skip if we rendered within the last 200 ms.
      if (now - _lastRender < 200) return;
      if (_rafPending) return;
      _rafPending = true;
      window.requestAnimationFrame(function () {
        _rafPending = false;
        _lastRender = Date.now();
        render();
      });
    }

    observer = new MutationObserver(function (mutations) {
      // Skip entirely when annotations are hidden.
      if (!visible) return;

      var shouldRender = false;
      for (var i = 0; i < mutations.length; i++) {
        var target = mutations[i].target;
        if (target && target.closest && target.closest('#anno-overlay, #anno-toggle-btn, .anno-popup, .anno-toast')) {
          continue;
        }
        shouldRender = true;
        break;
      }
      if (!shouldRender) return;

      window.clearTimeout(observer._debounceTimer);
      observer._debounceTimer = window.setTimeout(scheduleRender, 300);
    });
    observer.observe(root, { childList: true, subtree: true });
  }

  function init() {
    try {
      ensureToggle();
      ensureOverlay();
      render();
      observeChanges();
    } catch (err) {
      console.warn('[AnnotationRuntime] init failed:', err);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  window.AnnotationRuntime = {
    refresh: render,
    getPageKey: getPageKey,
    getAnnotations: getAnnotations,
    close: closePopup
  };
})();

</script>
