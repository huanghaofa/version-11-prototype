/* ========================================
   Global B端 Design Tokens & Shared Components
   ======================================== */

:root {
  /* ---- Color Palette ---- */
  --color-primary: #3370ff;
  --color-primary-hover: #2860e1;
  --color-success: #34c759;
  --color-warning: #ff9500;
  --color-danger: #ff3b30;
  --color-info: #5ac8fa;

  --color-text-primary: #1f2329;
  --color-text-secondary: #646a73;
  --color-text-disabled: #c0c4cc;
  --color-text-placeholder: #8f959e;

  --color-bg-page: #f5f6f8;
  --color-bg-white: #ffffff;
  --color-bg-hover: #f2f3f5;

  --color-border: #e5e6eb;
  --color-border-light: #f0f1f5;
  --color-divider: #ebecf0;

  /* ---- Typography ---- */
  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
  --font-size-xs: 12px;
  --font-size-sm: 13px;
  --font-size-base: 14px;
  --font-size-lg: 16px;
  --font-size-xl: 20px;
  --font-size-xxl: 24px;

  /* ---- Spacing ---- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-lg: 16px;
  --spacing-xl: 24px;
  --spacing-xxl: 32px;

  /* ---- Border Radius ---- */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;

  /* ---- Shadows ---- */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
}

/* ---- Reset ---- */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  color: var(--color-text-primary);
  background: var(--color-bg-page);
  font-family: var(--font-family);
  font-size: var(--font-size-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a {
  color: var(--color-primary);
  text-decoration: none;
}

a:hover {
  color: var(--color-primary-hover);
}

/* ---- Shared Component: Button ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 32px;
  padding: 0 var(--spacing-lg);
  font-size: var(--font-size-base);
  font-weight: 500;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-bg-white);
  color: var(--color-text-primary);
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
  white-space: nowrap;
}

.btn:hover {
  border-color: var(--color-primary);
  color: var(--color-primary);
}

.btn:disabled {
  color: var(--color-text-disabled);
  cursor: not-allowed;
}

.btn-primary {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

.btn-primary:hover {
  background: var(--color-primary-hover);
  border-color: var(--color-primary-hover);
  color: #fff;
}

.btn-danger {
  background: var(--color-danger);
  border-color: var(--color-danger);
  color: #fff;
}

.btn-danger:hover {
  opacity: 0.85;
  color: #fff;
}

/* ---- Shared Component: Table ---- */
.table-wrapper {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--font-size-base);
}

thead th {
  padding: var(--spacing-md) var(--spacing-lg);
  text-align: left;
  font-weight: 600;
  color: var(--color-text-secondary);
  background: var(--color-bg-hover);
  border-bottom: 1px solid var(--color-border);
  white-space: nowrap;
}

tbody td {
  padding: var(--spacing-md) var(--spacing-lg);
  border-bottom: 1px solid var(--color-border-light);
}

tbody tr:hover {
  background: var(--color-bg-hover);
}

/* ---- Shared Component: Form ---- */
.form-group {
  margin-bottom: var(--spacing-lg);
}

.form-label {
  display: block;
  margin-bottom: var(--spacing-xs);
  font-size: var(--font-size-base);
  font-weight: 500;
  color: var(--color-text-primary);
}

.form-input,
.form-select,
.form-textarea {
  width: 100%;
  height: 32px;
  padding: 0 var(--spacing-md);
  font-size: var(--font-size-base);
  font-family: var(--font-family);
  color: var(--color-text-primary);
  background: var(--color-bg-white);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  outline: none;
  transition: border-color 0.2s ease;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus {
  border-color: var(--color-primary);
}

.form-input::placeholder {
  color: var(--color-text-placeholder);
}

.form-textarea {
  height: auto;
  min-height: 80px;
  padding: var(--spacing-sm) var(--spacing-md);
  resize: vertical;
}

/* ---- Shared Component: Card ---- */
.card {
  background: var(--color-bg-white);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--spacing-xl);
  box-shadow: var(--shadow-sm);
}

/* ---- Shared Component: Modal / Dialog ---- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal-content {
  background: var(--color-bg-white);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  min-width: 420px;
  max-width: 90vw;
  max-height: 80vh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--spacing-lg) var(--spacing-xl);
  border-bottom: 1px solid var(--color-border);
}

.modal-body {
  padding: var(--spacing-xl);
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: var(--spacing-sm);
  padding: var(--spacing-lg) var(--spacing-xl);
  border-top: 1px solid var(--color-border);
}

/* ---- Shared Component: Pagination ---- */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-xs);
  padding: var(--spacing-lg) 0;
}

.pagination-item {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 32px;
  height: 32px;
  padding: 0 var(--spacing-sm);
  font-size: var(--font-size-base);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-bg-white);
  color: var(--color-text-primary);
  cursor: pointer;
  transition: all 0.2s ease;
}

.pagination-item:hover {
  border-color: var(--color-primary);
  color: var(--color-primary);
}

.pagination-item.active {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

/* ---- Shared Component: Advanced Search Bar ---- */
.search-bar {
  display: flex;
  align-items: center;
  gap: var(--spacing-md);
  padding: var(--spacing-lg);
  background: var(--color-bg-white);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  margin-bottom: var(--spacing-lg);
}

.search-bar .form-input,
.search-bar .form-select {
  width: auto;
  min-width: 160px;
}

/* ---- Utility ---- */
.text-secondary {
  color: var(--color-text-secondary);
}

.text-muted {
  color: var(--color-text-disabled);
}

.mt-lg {
  margin-top: var(--spacing-lg);
}

.mb-lg {
  margin-bottom: var(--spacing-lg);
}

(function () {

  window.escapeHtml = function (value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  window.showToast = function (message, type) {
    var root = document.getElementById('toast-root');
    if (!root) return;
    var item = document.createElement('div');
    item.className = 'toast toast--' + (type || 'info');
    item.textContent = message;
    root.appendChild(item);
    window.setTimeout(function () {
      item.classList.add('is-leaving');
      window.setTimeout(function () { item.remove(); }, 220);
    }, 2100);
  };

  window.getStoreById = function (id) {
    return window.MockData.stores.find(function (store) { return store.id === id; });
  };

  window.cloneScope = function (scope) {
    return { mode: scope.mode, storeIds: scope.storeIds.slice() };
  };
})();

  <script data-inline-source="js/pages/activity-form.js?v=20260810-3">
(function () {
  'use strict';

  var data = window.MockData;
  var state = window.AppState;
  var ui = {
    modalOpen: false,
    modalTab: 'all',
    keyword: '',
    draftSelection: new Set(),
    clearConfirmOpen: false
  };

  function storeNames(ids, limit) {
    var names = ids.map(window.getStoreById).filter(function (store) { return store && store.available; }).map(function (store) { return store.name; });
    if (!names.length) return '未指定门店，适用于全部门店';
    var visible = names.slice(0, limit || 3);
    return visible.join('、') + (names.length > visible.length ? ' 等 ' + names.length + ' 家' : '');
  }

  function pageShell(content) {
    return '<div class="workspace">' +
      '<header class="topbar"><div class="mobile-brand"><strong>NISSAN</strong><span>活动中心</span></div>' +
      '<div class="topbar-user"><span>消息</span><i></i><strong>活动运营员</strong></div></header>' +
      '<div class="breadcrumb">后台管理 <span>/</span> 活动中心 <span>/</span> 保客活动创建</div>' +
      '<div class="module-tabs"><button>保客活动一店一码</button><button>保客活动互斥关系</button><button class="is-active">保客活动创建</button><button>组合活动列表</button></div>' +
      content + '</div>';
  }

  function renderSteps() {
    return '<div class="steps">' +
      '<div class="step is-active"><span class="step-dot">1</span><span>基本信息</span></div>' +
      '<div class="step"><span class="step-dot">2</span><span>关联卡券</span></div>' +
      '<div class="step"><span class="step-dot">3</span><span>活动对象</span></div>' +
      '<div class="step"><span class="step-dot">4</span><span>分享及页面配置</span></div>' +
      '</div>';
  }

  function renderModeSwitch() {
    var createActive = state.formMode === 'create';
    return '<div class="mode-switch" role="group" aria-label="页面状态">' +
      '<button class="' + (createActive ? 'is-active' : '') + '" data-form-mode="create">创建活动</button>' +
      '<button class="' + (!createActive ? 'is-active' : '') + '" data-form-mode="edit">编辑活动</button>' +
      '</div>';
  }

  function renderTypeOptions(value) {
    return data.activityTypes.map(function (type) {
      return '<option value="' + window.escapeHtml(type) + '" ' + (type === value ? 'selected' : '') + '>' + window.escapeHtml(type) + '</option>';
    }).join('');
  }

  function renderScopeField(draft) {
    var specified = draft.storeScope.mode === 'SPECIFIED' && draft.storeScope.storeIds.length > 0;
    return '<div class="store-scope-field" data-testid="store-scope-field">' +
      '<div class="field-label"><span>适用门店</span><em>选填</em></div>' +
      '<div class="field-content">' +
        '<div class="scope-summary ' + (specified ? 'is-specified' : 'is-all') + '">' +
          '<div class="scope-icon">' + (specified ? '店' : '全') + '</div>' +
          '<div class="scope-copy"><div><strong>' + (specified ? '指定 ' + draft.storeScope.storeIds.length + ' 家门店' : '全部门店') + '</strong>' +
          '<span class="scope-pill ' + (specified ? 'scope-pill--specified' : 'scope-pill--all') + '">' + (specified ? '已配置' : '默认') + '</span></div>' +
          '<p>' + window.escapeHtml(storeNames(draft.storeScope.storeIds, 3)) + '</p></div>' +
          '<div class="scope-actions"><button class="btn btn-primary" data-open-store-modal>' + (specified ? '重新配置' : '配置适用门店') + '</button>' +
          (specified ? '<button class="btn btn-text-danger" data-clear-scope>清空</button>' : '') + '</div>' +
        '</div>' +
        '<div class="field-help"><span>i</span><p><strong>不配置即适用于所有门店。</strong> 该范围将用于 SA 动态二维码活动池过滤：仅适用门店的 SA 可查看并分享。</p></div>' +
      '</div>' +
    '</div>';
  }

  function renderForm() {
    var draft = state.getDraft();
    var editing = state.formMode === 'edit';
    return pageShell(
      '<section class="page-title"><div><h1>' + (editing ? '编辑活动' : '创建活动') + '</h1>' +
      '<p>活动的配置，可创建、编辑并查看活动范围与基础信息。</p></div>' +
      '<div class="header-actions"><button class="btn" data-save-draft>保存草稿</button><button class="btn btn-primary" data-save>确定</button></div></section>' +
      '<div class="content-card">' +
        '<div class="content-tabs"><button class="is-active">基础配置</button><button>页面配置</button><button>投放记录</button></div>' +
        '<div class="review-strip"><div><strong>本原型验证：</strong>续保专属门店字段升级为所有活动通用字段</div>' + renderModeSwitch() + '</div>' +
        renderSteps() +
        (editing ? '<div class="risk-banner"><span>!</span><div><strong>已启用活动编辑提醒</strong><p>适用门店变更的生效时点及对已生成二维码的影响待确认，本原型仅演示回显与编辑。</p></div></div>' : '') +
        '<section class="form-section"><div class="section-heading"><div><h2>step1：基本信息</h2><p>所有活动类型共用的活动级配置</p></div><span class="evidence-tag">目标态：全活动通用</span></div>' +
          '<div class="form-grid">' +
            '<label><span><b>*</b> 活动名称</span><input class="form-input" data-field="name" maxlength="50" value="' + window.escapeHtml(draft.name) + '"></label>' +
            '<label><span><b>*</b> 活动类型</span><select class="form-select" data-field="type">' + renderTypeOptions(draft.type) + '</select></label>' +
            '<label><span>活动状态</span><input class="form-input" value="' + window.escapeHtml(draft.status) + '" disabled></label>' +
            '<label><span><b>*</b> 活动时间</span><input class="form-input" value="2026-08-10 00:00 至 2026-09-30 23:59" readonly></label>' +
          '</div>' +
          renderScopeField(draft) +
          '<div class="boundary-note"><strong>规则边界</strong><span>活动适用门店用于活动范围及 SA 查看/分享权限；不自动改写卡券自身的适用或核销门店。</span></div>' +
        '</section>' +
        '<div class="page-actions"><button class="btn" data-cancel>取消</button><button class="btn btn-primary" data-next>下一步：关联卡券</button></div>' +
      '</div>' +
      (ui.modalOpen ? renderStoreModal() : '') +
      (ui.clearConfirmOpen ? renderClearConfirm() : '')
    );
  }

  function filterStores() {
    var keyword = ui.keyword.trim().toLowerCase();
    return data.stores.filter(function (store) {
      if (!store.available) return false;
      if (ui.modalTab === 'selected' && !ui.draftSelection.has(store.id)) return false;
      if (!keyword) return true;
      return store.name.toLowerCase().indexOf(keyword) > -1 || store.code.toLowerCase().indexOf(keyword) > -1 ||
        store.province.toLowerCase().indexOf(keyword) > -1 || store.city.toLowerCase().indexOf(keyword) > -1;
    });
  }

  function uniqueValues(list, key) {
    return list.map(function (item) { return item[key]; }).filter(function (value, index, arr) { return arr.indexOf(value) === index; });
  }

  function groupCheck(ids, groupKey, label, level) {
    var selectable = ids.slice();
    var selectedCount = selectable.filter(function (id) { return ui.draftSelection.has(id); }).length;
    var checked = selectable.length > 0 && selectedCount === selectable.length;
    var partial = selectedCount > 0 && selectedCount < selectable.length;
    return '<div class="tree-row tree-row--group level-' + level + '">' +
      '<span class="tree-arrow">⌄</span><label><input type="checkbox" data-group="' + window.escapeHtml(groupKey) + '" data-ids="' + ids.join(',') + '" ' +
      (checked ? 'checked' : '') + ' ' + (partial ? 'data-partial="true"' : '') + '><span>' + window.escapeHtml(label) + '</span></label>' +
      '<small>' + selectedCount + '/' + selectable.length + '</small></div>';
  }

  function storeRow(store) {
    return '<div class="tree-row tree-row--store level-4">' +
      '<span></span><label><input type="checkbox" data-store-id="' + store.id + '" ' + (ui.draftSelection.has(store.id) ? 'checked' : '') +
      '><span><strong>' + window.escapeHtml(store.name) + '</strong><small>门店编码：' + store.code + '</small></span></label></div>';
  }

  function renderStoreTree() {
    var stores = filterStores();
    if (!stores.length) {
      return '<div class="tree-empty"><span>⌕</span><strong>没有匹配的门店</strong><p>可调整搜索词，或切回「全部门店」。</p></div>';
    }
    var html = '';
    uniqueValues(stores, 'brand').forEach(function (brand) {
      var brandStores = stores.filter(function (store) { return store.brand === brand; });
      html += groupCheck(brandStores.map(function (store) { return store.id; }), 'brand-' + brand, brand, 1);
      uniqueValues(brandStores, 'province').forEach(function (province) {
        var provinceStores = brandStores.filter(function (store) { return store.province === province; });
        html += groupCheck(provinceStores.map(function (store) { return store.id; }), 'province-' + brand + '-' + province, province, 2);
        uniqueValues(provinceStores, 'city').forEach(function (city) {
          var cityStores = provinceStores.filter(function (store) { return store.city === city; });
          html += groupCheck(cityStores.map(function (store) { return store.id; }), 'city-' + brand + '-' + city, city, 3);
          cityStores.forEach(function (store) { html += storeRow(store); });
        });
      });
    });
    return html;
  }

  function renderStoreModal() {
    return '<div class="modal-overlay store-modal-overlay" role="presentation">' +
      '<section class="store-modal" role="dialog" aria-modal="true" aria-labelledby="store-modal-title">' +
        '<header class="store-modal-header"><div><span>活动级通用配置</span><h2 id="store-modal-title">选择适用门店</h2></div><button class="icon-btn" data-close-modal aria-label="关闭">×</button></header>' +
        '<div class="store-modal-body">' +
          '<div class="modal-info"><span>i</span><p>列表仅展示可用门店。选择指定门店后，仅这些门店的 SA 可查看并分享活动；不选择任何门店则适用于所有门店。</p></div>' +
          '<div class="tree-search"><input class="form-input" data-store-search placeholder="输入门店名称或编码" value="' + window.escapeHtml(ui.keyword) + '"><button class="btn btn-primary" data-search-store>搜索</button><button class="btn" data-reset-search>重置</button></div>' +
          '<div class="store-tree-toolbar"><div><button class="' + (ui.modalTab === 'all' ? 'is-active' : '') + '" data-modal-tab="all">全部门店</button>' +
          '<button class="' + (ui.modalTab === 'selected' ? 'is-active' : '') + '" data-modal-tab="selected">已选门店 <span>' + ui.draftSelection.size + '</span></button></div>' +
          '<button class="text-btn" data-clear-draft>清空已选</button></div>' +
          '<div class="store-tree" data-testid="store-tree">' + renderStoreTree() + '</div>' +
        '</div>' +
        '<footer class="store-modal-footer"><div><span>当前已选</span><strong>' + ui.draftSelection.size + '</strong><span>家门店</span>' +
        '<small>' + (ui.draftSelection.size ? '确认后按指定门店生效' : '零家将按全部门店生效') + '</small></div>' +
        '<div><button class="btn" data-close-modal>取消</button><button class="btn btn-primary" data-confirm-stores>确定</button></div></footer>' +
      '</section></div>';
  }

  function renderClearConfirm() {
    return '<div class="modal-overlay confirm-overlay"><section class="confirm-dialog" role="dialog" aria-modal="true">' +
      '<div class="confirm-icon">!</div><h3>清空已配置门店？</h3><p>清空后，活动将恢复为适用于<strong>全部门店</strong>，所有已进入 SA 投放池的门店 SA 均可查看并分享。</p>' +
      '<div><button class="btn" data-cancel-clear>取消</button><button class="btn btn-primary" data-confirm-clear>确认清空</button></div>' +
      '</section></div>';
  }

  function rerender() {
    document.getElementById('app').innerHTML = renderForm();
    bindEvents();
  }

  function openModal() {
    var draft = state.getDraft();
    ui.draftSelection = new Set(draft.storeScope.mode === 'SPECIFIED' ? draft.storeScope.storeIds.filter(function (id) {
      var store = window.getStoreById(id);
      return store && store.available;
    }) : []);
    ui.modalOpen = true;
    ui.modalTab = 'all';
    ui.keyword = '';
    rerender();
  }

  function bindPartialChecks() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-partial="true"]'), function (input) { input.indeterminate = true; });
  }

  function bindEvents() {
    bindPartialChecks();

    Array.prototype.forEach.call(document.querySelectorAll('[data-form-mode]'), function (button) {
      button.addEventListener('click', function () {
        state.formMode = button.getAttribute('data-form-mode');
        ui.modalOpen = false;
        ui.clearConfirmOpen = false;
        rerender();
      });
    });

    var nameInput = document.querySelector('[data-field="name"]');
    if (nameInput) nameInput.addEventListener('input', function () { state.getDraft().name = nameInput.value; });
    var typeSelect = document.querySelector('[data-field="type"]');
    if (typeSelect) typeSelect.addEventListener('change', function () {
      state.getDraft().type = typeSelect.value;
      window.showToast('活动类型已切换，「适用门店」保持通用展示', 'info');
    });

    var openButton = document.querySelector('[data-open-store-modal]');
    if (openButton) openButton.addEventListener('click', openModal);
    var clearScope = document.querySelector('[data-clear-scope]');
    if (clearScope) clearScope.addEventListener('click', function () { ui.clearConfirmOpen = true; rerender(); });

    Array.prototype.forEach.call(document.querySelectorAll('[data-close-modal]'), function (button) {
      button.addEventListener('click', function () { ui.modalOpen = false; rerender(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-modal-tab]'), function (button) {
      button.addEventListener('click', function () { ui.modalTab = button.getAttribute('data-modal-tab'); rerender(); });
    });

    var search = document.querySelector('[data-store-search]');
    var runSearch = function () { ui.keyword = search ? search.value : ''; rerender(); };
    var searchButton = document.querySelector('[data-search-store]');
    if (searchButton) searchButton.addEventListener('click', runSearch);
    if (search) search.addEventListener('keydown', function (event) { if (event.key === 'Enter') runSearch(); });
    var resetSearch = document.querySelector('[data-reset-search]');
    if (resetSearch) resetSearch.addEventListener('click', function () { ui.keyword = ''; rerender(); });
    var clearDraft = document.querySelector('[data-clear-draft]');
    if (clearDraft) clearDraft.addEventListener('click', function () { ui.draftSelection.clear(); rerender(); });

    Array.prototype.forEach.call(document.querySelectorAll('[data-store-id]'), function (input) {
      input.addEventListener('change', function () {
        if (input.checked) ui.draftSelection.add(input.getAttribute('data-store-id'));
        else ui.draftSelection.delete(input.getAttribute('data-store-id'));
        rerender();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-group]'), function (input) {
      input.addEventListener('change', function () {
        var ids = input.getAttribute('data-ids').split(',').filter(Boolean);
        ids.forEach(function (id) {
          if (input.checked) ui.draftSelection.add(id);
          else ui.draftSelection.delete(id);
        });
        rerender();
      });
    });

    var confirmStores = document.querySelector('[data-confirm-stores]');
    if (confirmStores) confirmStores.addEventListener('click', function () {
      var ids = Array.from(ui.draftSelection);
      state.getDraft().storeScope = ids.length ? { mode: 'SPECIFIED', storeIds: ids } : { mode: 'ALL', storeIds: [] };
      ui.modalOpen = false;
      window.showToast(ids.length ? '已配置 ' + ids.length + ' 家适用门店' : '未选择门店，已按全部门店处理', 'success');
      rerender();
    });

    var cancelClear = document.querySelector('[data-cancel-clear]');
    if (cancelClear) cancelClear.addEventListener('click', function () { ui.clearConfirmOpen = false; rerender(); });
    var confirmClear = document.querySelector('[data-confirm-clear]');
    if (confirmClear) confirmClear.addEventListener('click', function () {
      state.getDraft().storeScope = { mode: 'ALL', storeIds: [] };
      ui.clearConfirmOpen = false;
      state.publishDraftToPreview();
      window.showToast('已清空，活动恢复为适用于全部门店', 'success');
      rerender();
    });

    var save = document.querySelector('[data-save]');
    if (save) save.addEventListener('click', function () {
      state.publishDraftToPreview();
      window.showToast('活动适用门店已保存，并同步至 SA 活动池预览', 'success');
    });
    var saveDraft = document.querySelector('[data-save-draft]');
    if (saveDraft) saveDraft.addEventListener('click', function () { window.showToast('草稿已保存（原型演示）', 'success'); });
    var next = document.querySelector('[data-next]');
    if (next) next.addEventListener('click', function () {
      state.publishDraftToPreview();
      window.showToast('适用门店为选填项，校验通过并进入 step2', 'success');
    });
    var cancel = document.querySelector('[data-cancel]');
    if (cancel) cancel.addEventListener('click', function () { window.showToast('已取消本次编辑（原型演示）', 'info'); });
  }

  window.Pages['activity-form'] = { render: renderForm, init: bindEvents, rerender: rerender };
})();

</script>
  <script data-inline-source="js/pages/sa-pool.js?v=20260810-3">
(function () {
  'use strict';

  var data = window.MockData;
  var state = window.AppState;
  var ui = { shareActivityId: '' };

  function currentSA() {
    return data.sas.find(function (sa) { return sa.id === state.selectedSAId; }) || data.sas[0];
  }

  function candidates() {
    return data.activities.filter(function (activity) {
      return activity.saPlacementEnabled && activity.status === '已启用';
    });
  }

  function permission(activity, sa) {
    var scope = activity.storeScope;
    if (scope.mode === 'ALL' || !scope.storeIds.length) {
      return { allowed: true, reason: '活动未指定门店，适用于全部门店' };
    }
    if (scope.storeIds.indexOf(sa.storeId) > -1) {
      return { allowed: true, reason: '当前 SA 所属门店命中活动适用门店' };
    }
    return { allowed: false, reason: '当前 SA 所属门店不在活动适用门店内' };
  }

  function scopeLabel(activity) {
    if (activity.storeScope.mode === 'ALL' || !activity.storeScope.storeIds.length) return '全部门店';
    return '指定 ' + activity.storeScope.storeIds.length + ' 家';
  }

  function scopeDetail(activity) {
    if (activity.storeScope.mode === 'ALL' || !activity.storeScope.storeIds.length) return '未配置指定门店';
    var stores = activity.storeScope.storeIds.map(window.getStoreById).filter(Boolean);
    return stores.map(function (store) { return store.name; }).join('、');
  }

  function pageShell(content) {
    return '<div class="workspace sa-workspace">' +
      '<header class="topbar"><div class="mobile-brand"><strong>NISSAN</strong><span>SA 动态二维码</span></div>' +
      '<div class="topbar-user"><span>消息</span><i></i><strong>活动运营员</strong></div></header>' +
      '<div class="breadcrumb">后台管理 <span>/</span> 活动中心 <span>/</span> SA 动态二维码</div>' +
      '<div class="module-tabs"><button>SA 活动配置</button><button class="is-active">SA 活动池校验</button><button>SA 活动报表</button></div>' + content + '</div>';
  }

  function renderSASelector(sa) {

      '<div class="all-store-illustration"><span>全</span><p>未配置指定门店，适用于所有门店。</p></div>') +
      '<div><button class="btn" data-close-share>关闭</button><button class="btn btn-primary" data-go-config>去配置适用门店</button></div>' +

  function renderPage() {
    var sa = currentSA();
    var candidateList = candidates();
    var overlay = '';
    if (ui.shareActivityId) {

    return pageShell('<section class="page-title"><div><h1>SA 动态二维码 · 活动池校验</h1><p>验证活动适用门店如何控制 SA 的查看与分享权限。</p></div>' +

  function rerender() {
    document.getElementById('app').innerHTML = renderPage();

  function bindEvents() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-sa-id]'), function (button) {
      button.addEventListener('click', function () { state.selectedSAId = button.getAttribute('data-sa-id'); ui.shareActivityId = ''; rerender(); });

    Array.prototype.forEach.call(document.querySelectorAll('[data-share-activity]'), function (button) {
      button.addEventListener('click', function () { ui.shareActivityId = button.getAttribute('data-share-activity'); rerender(); });

    Array.prototype.forEach.call(document.querySelectorAll('[data-view-scope]'), function (button) {

    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-close-share]'), function (button) {
      button.addEventListener('click', function () { ui.shareActivityId = ''; rerender(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-go-config]'), function (button) {
      button.addEventListener('click', function () { ui.shareActivityId = ''; window.navigateTo('activity-form'); });
    });
    var copy = document.querySelector('[data-copy-share]');
    if (copy) copy.addEventListener('click', function () { ui.shareActivityId = ''; window.showToast('分享链接已复制（原型演示）', 'success'); rerender(); });
  }

  window.Pages['sa-pool'] = { render: renderPage, init: bindEvents, rerender: rerender };
})();

(function () {

  var config = null;

      '<div class="sidebar-section">活动中心</div>' +

  function renderNav() {
    var nav = document.getElementById('main-nav');
    if (!nav || !config) return;
    nav.innerHTML = buildTree(config.menu || []);
    Array.prototype.forEach.call(nav.querySelectorAll('[data-page]'), function (link) {
      link.addEventListener('click', function (event) {
        event.preventDefault();
        window.navigateTo(link.getAttribute('data-page'));
      });

  }

  function highlight() {
    Array.prototype.forEach.call(document.querySelectorAll('.nav-link'), function (link) {
      link.classList.toggle('active', link.getAttribute('data-page') === currentPage);
    });
  }

  window.navigateTo = function (pageKey, replaceHash) {
    var page = window.Pages[pageKey];
    if (!page || typeof page.render !== 'function') {
      document.getElementById('app').innerHTML = '<div class="empty-page">无法加载该页面，请从已配置菜单重新进入。</div>';
      return;
    }
    currentPage = pageKey;
    if (!replaceHash && window.location.hash !== '#' + pageKey) window.location.hash = pageKey;
    document.getElementById('app').innerHTML = page.render();
    if (typeof page.init === 'function') page.init();
    highlight();
  };

  window.getCurrentPage = function () { return currentPage; };

  function start(cfg) {
    config = cfg;
    renderNav();
    var hashPage = window.location.hash.replace('#', '');
    var firstPage = (config && config.defaultPage) || (config.menu[0] && config.menu[0].key);
    window.navigateTo(window.Pages[hashPage] ? hashPage : firstPage, true);
  }

  function loadConfig() {
    if (window.location.protocol === 'file:') {
      start(window.InlineNavConfig);
      return;
    }
    fetch('config/nav.json')
      .then(function (response) {
        if (!response.ok) throw new Error('nav ' + response.status);
        return response.json();
      })
      .then(start)
      .catch(function () { start(window.InlineNavConfig); });
  }

  window.addEventListener('hashchange', function () {
    var pageKey = window.location.hash.replace('#', '');
    if (pageKey && pageKey !== currentPage && window.Pages[pageKey]) window.navigateTo(pageKey, true);
  });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', loadConfig);
  else loadConfig();
})();

  <script data-inline-source="annotations/annotation-runtime.js?v=20260810-2">
(function () {
  'use strict';

  var visible = true;
  var activePopup = null;
  var currentAnno = null;
  var dragState = null;
  var observer = null;

  var sectionFields = [
    ['functionName', '功能名称'],
    ['functionDesc', '功能说明'],
    ['permissionScope', '权限范围'],
    ['dataSource', '数据来源'],
    ['valueLogic', '取值逻辑'],
    ['fieldDesc', '字段说明'],
    ['interactionDesc', '交互说明'],
    ['judgeRule', '判断规则'],
    ['exceptionRule', '异常规则'],
    ['otherDesc', '其他说明']
  ];

  function getConfig() {
    return window.AnnotationConfig || {};
  }

  function getPageKey() {
    var cfg = getConfig();
    if (typeof cfg.page === 'function') return cfg.page();
    if (cfg.page) return cfg.page;
    var active = document.querySelector('.nav-sub-item.active');
    return active && active.id ? active.id : 'index';
  }

  function getRawAnnotations() {
    var cfg = getConfig();
    var page = getPageKey();
    if (cfg.dataKey && Array.isArray(window[cfg.dataKey])) {
      return window[cfg.dataKey].filter(function (item) { return item.page === page; });
    }
    if (window.AnnotationData && Array.isArray(window.AnnotationData[page])) {
      return window.AnnotationData[page];
    }
    return [];
  }

  function storageKey() {
    var cfg = getConfig();
    var projectId = cfg.projectId || window.location.pathname || 'default-project';
    var dataVersion = cfg.dataVersion || '1';
    return ['prototype_annotations', projectId, dataVersion, getPageKey()].join('_');
  }

  function loadCached() {
    try {
      var raw = window.localStorage.getItem(storageKey());
      return raw ? JSON.parse(raw) : [];
    } catch (err) {
      return [];
    }
  }

  function saveCached(items) {
    try {
      window.localStorage.setItem(storageKey(), JSON.stringify(items));
    } catch (err) {
      showToast('保存到浏览器缓存失败');
    }
  }

  function getAnnotations() {
    var source = getRawAnnotations();
    if (!source.length) return [];
    var cached = loadCached();
    var cachedMap = {};
    cached.forEach(function (item) {
      if (item && item.id != null) cachedMap[item.id] = item;
    });
    return source.map(function (item) {
      return clone(cachedMap[item.id] || item);
    }).sort(function (a, b) {
      return Number(a.id) - Number(b.id);
    });
  }

  function clone(value) {
    return JSON.parse(JSON.stringify(value || {}));
  }

  function ensureToggle() {
    var buttons = document.querySelectorAll('#anno-toggle-btn');
    buttons.forEach(function (btn, index) {
      if (index > 0) btn.remove();
    });
    var btn = document.getElementById('anno-toggle-btn');
    if (!btn) {
      btn = document.createElement('button');
      btn.id = 'anno-toggle-btn';
      btn.type = 'button';
      btn.title = '显示/隐藏标注';
      btn.textContent = '●';
      btn.addEventListener('click', function () {
        visible = !visible;
        btn.classList.toggle('anno-hidden', !visible);
        closePopup();
        render();
      });
      document.body.appendChild(btn);
    }
    placeToggle(btn);
  }

  function placeToggle(btn) {
    var appSidebar = document.querySelector('.app-sidebar');
    if (appSidebar) {
      if (window.innerWidth <= 760) {
        btn.style.top = '7px';
        btn.style.left = '170px';
      } else {
        btn.style.top = '8px';
        btn.style.left = Math.round(appSidebar.getBoundingClientRect().right + 16) + 'px';
      }
      return;
    }
    var topBar = document.querySelector('.top-bar');
    var sideMenu = document.querySelector('.side-menu, .sidebar, .nav-panel');
    var top = topBar ? topBar.getBoundingClientRect().bottom + 12 : 16;
    var left = sideMenu ? sideMenu.getBoundingClientRect().right + 16 : 16;
    btn.style.top = Math.max(16, top) + 'px';
    btn.style.left = Math.max(16, left) + 'px';
  }

  function ensureOverlay() {
    var overlay = document.getElementById('anno-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'anno-overlay';
      document.body.appendChild(overlay);
    }
    return overlay;
  }

  function render() {
    ensureToggle();
    var overlay = ensureOverlay();
    overlay.innerHTML = '';
    if (!visible) return;
    getAnnotations().forEach(function (anno, index) {
      var target = resolveTarget(anno.target);
      if (!target) return;
      var marker = document.createElement('button');
      marker.type = 'button';
      marker.className = 'anno-marker';
      marker.textContent = anno.id || String(index + 1);
      marker.title = anno.title || '';
      marker.addEventListener('click', function (event) {
        event.stopPropagation();
        openPopup(anno, marker);
      });
      overlay.appendChild(marker);
      positionMarker(marker, target, anno.position);
    });
  }

  function resolveTarget(selector) {
    if (!selector) return null;
    try {
      var nodes = document.querySelectorAll(selector);
      return nodes.length === 1 ? nodes[0] : null;
    } catch (err) {
      return null;
    }
  }

  function positionMarker(marker, target, position) {
    var rect = target.getBoundingClientRect();
    var pos = position || {};
    var placement = pos.placement || 'top-right';
    var x = rect.right;
    var y = rect.top;
    if (placement.indexOf('left') >= 0) x = rect.left;
    if (placement.indexOf('bottom') >= 0) y = rect.bottom;
    if (placement.indexOf('center') >= 0) y = rect.top + rect.height / 2;
    marker.style.left = Math.round(x + Number(pos.offsetX || 0) - 10) + 'px';
    marker.style.top = Math.round(y + Number(pos.offsetY || 0) - 10) + 'px';
  }

  function openPopup(anno, marker) {
    closePopup();
    currentAnno = clone(anno);
    currentAnno.desc = currentAnno.desc || generateDesc(currentAnno.sections);
    activePopup = document.createElement('div');
    activePopup.className = 'anno-popup';
    activePopup.innerHTML = buildViewHTML(currentAnno);
    document.body.appendChild(activePopup);
    positionPopup(activePopup, marker);
    bindViewEvents();
    bindDrag();
  }

  function positionPopup(popup, marker) {
    var rect = marker.getBoundingClientRect();
    var popupWidth = popup.offsetWidth;
    var popupHeight = popup.offsetHeight;
    var left = rect.right + 12;
    var top = rect.top;
    if (left + popupWidth > window.innerWidth - 16) {
      left = rect.left - popupWidth - 12;
    }
    left = Math.max(16, Math.min(left, window.innerWidth - popupWidth - 16));
    top = Math.max(16, Math.min(top, window.innerHeight - popupHeight - 16));
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  }

  function fitPopupToViewport(popup) {
    if (!popup) return;
    var rect = popup.getBoundingClientRect();
    var left = Math.max(16, Math.min(rect.left, window.innerWidth - rect.width - 16));
    var top = Math.max(16, Math.min(rect.top, window.innerHeight - rect.height - 16));
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  }

  function buildViewHTML(anno) {
    return ''
      + '<div class="anno-popup-header">'
      + '  <div class="anno-popup-title">' + escapeHTML(anno.title || '未命名标注') + '</div>'
      + '  <button class="anno-popup-close" type="button" title="关闭">&times;</button>'
      + '</div>'
      + '<div class="anno-popup-body"><div class="anno-popup-desc">' + (anno.desc || generateDesc(anno.sections)) + '</div></div>'
      + '<div class="anno-popup-footer">'
      + '  <button class="anno-btn anno-copy" type="button">复制数据</button>'
      + '  <button class="anno-btn anno-btn-primary anno-edit" type="button">编辑</button>'
      + '</div>';
  }

  function buildEditHTML(anno) {
    var sections = anno.sections || {};
    var fields = sectionFields.map(function (field) {
      return ''
        + '<div class="anno-edit-field">'
        + '  <label class="anno-edit-label">' + field[1] + '</label>'
        + '  <textarea class="anno-edit-textarea" data-section="' + field[0] + '">' + escapeHTML(sections[field[0]] || '') + '</textarea>'
        + '</div>';
    }).join('');
    return ''
      + '<div class="anno-popup-header">'
      + '  <div class="anno-popup-title">编辑标注</div>'
      + '  <button class="anno-popup-close" type="button" title="关闭">&times;</button>'
      + '</div>'
      + '<div class="anno-popup-body">'
      + '  <div class="anno-edit-field">'
      + '    <label class="anno-edit-label">标注标题</label>'
      + '    <input class="anno-edit-input" id="anno-edit-title" value="' + escapeHTML(anno.title || '') + '">'
      + '  </div>'
      + fields
      + '</div>'
      + '<div class="anno-popup-footer">'
      + '  <button class="anno-btn anno-cancel" type="button">取消</button>'
      + '  <button class="anno-btn anno-copy" type="button">复制数据</button>'
      + '  <button class="anno-btn anno-btn-primary anno-save" type="button">保存</button>'
      + '</div>';
  }

  function bindViewEvents() {
    activePopup.querySelector('.anno-popup-close').addEventListener('click', closePopup);
    activePopup.querySelector('.anno-copy').addEventListener('click', copyCurrent);
    activePopup.querySelector('.anno-edit').addEventListener('click', function () {
      activePopup.innerHTML = buildEditHTML(currentAnno);
      bindEditEvents();
      bindDrag();
      fitPopupToViewport(activePopup);
    });
  }

  function bindEditEvents() {
    activePopup.querySelector('.anno-popup-close').addEventListener('click', closePopup);
    activePopup.querySelector('.anno-cancel').addEventListener('click', function () {
      activePopup.innerHTML = buildViewHTML(currentAnno);
      bindViewEvents();
      bindDrag();
      fitPopupToViewport(activePopup);
    });
    activePopup.querySelector('.anno-copy').addEventListener('click', copyCurrent);
    activePopup.querySelector('.anno-save').addEventListener('click', saveEdit);
  }

  function saveEdit() {
    currentAnno.title = activePopup.querySelector('#anno-edit-title').value.trim();
    currentAnno.sections = {};
    activePopup.querySelectorAll('[data-section]').forEach(function (field) {
      currentAnno.sections[field.getAttribute('data-section')] = field.value.trim();
    });
    sectionFields.forEach(function (field) {
      if (!(field[0] in currentAnno.sections)) currentAnno.sections[field[0]] = '';
    });
    currentAnno.desc = generateDesc(currentAnno.sections);
    var items = getAnnotations();
    var found = false;
    items = items.map(function (item) {
      if (item.id === currentAnno.id) {
        found = true;
        return clone(currentAnno);
      }
      return item;
    });
    if (!found) items.push(clone(currentAnno));
    saveCached(items);
    activePopup.innerHTML = buildViewHTML(currentAnno);
    bindViewEvents();
    bindDrag();
    fitPopupToViewport(activePopup);
    showToast('已保存到浏览器缓存');
  }

  function copyCurrent() {
    if (!currentAnno) return;
    copyText(JSON.stringify(currentAnno, null, 2));
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { showToast('数据已复制'); });
      return;
    }
    var input = document.createElement('textarea');
    input.value = text;
    input.style.position = 'fixed';
    input.style.left = '-9999px';
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    input.remove();
    showToast('数据已复制');
  }

  function bindDrag() {
    var header = activePopup.querySelector('.anno-popup-header');
    header.addEventListener('mousedown', function (event) {
      if (event.target.closest('button')) return;
      var rect = activePopup.getBoundingClientRect();
      dragState = { x: event.clientX - rect.left, y: event.clientY - rect.top };
      event.preventDefault();
    });
  }

  function closePopup() {
    if (activePopup) activePopup.remove();
    activePopup = null;
    currentAnno = null;
    dragState = null;
  }

  function generateDesc(sections) {
    var data = sections || {};
    return sectionFields.map(function (field, index) {
      return (index + 1) + '. ' + field[1] + '：' + escapeHTML(data[field[0]] || '待确认');
    }).join('<br>');
  }

  function escapeHTML(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function showToast(text) {
    var old = document.querySelector('.anno-toast');
    if (old) old.remove();
    var toast = document.createElement('div');
    toast.className = 'anno-toast';
    toast.textContent = text;
    document.body.appendChild(toast);
    setTimeout(function () { toast.remove(); }, 1800);
  }

  document.addEventListener('mousemove', function (event) {
    if (!dragState || !activePopup) return;
    var x = Math.max(8, Math.min(event.clientX - dragState.x, window.innerWidth - activePopup.offsetWidth - 8));
    var y = Math.max(8, Math.min(event.clientY - dragState.y, window.innerHeight - activePopup.offsetHeight - 8));
    activePopup.style.left = x + 'px';
    activePopup.style.top = y + 'px';
  });

  document.addEventListener('mouseup', function () {
    dragState = null;
    fitPopupToViewport(activePopup);
  });

  window.addEventListener('resize', function () {
    render();
    fitPopupToViewport(activePopup);
  });
  window.addEventListener('scroll', render, true);

  function observeChanges() {
    var root = document.getElementById('page-content') || document.body;
    var _lastRender = 0;
    var _rafPending = false;

    function scheduleRender() {
      var now = Date.now();
      // Burst protection: skip if we rendered within the last 200 ms.
      if (now - _lastRender < 200) return;
      if (_rafPending) return;
      _rafPending = true;
      window.requestAnimationFrame(function () {
        _rafPending = false;
        _lastRender = Date.now();
        render();
      });
    }

    observer = new MutationObserver(function (mutations) {
      // Skip entirely when annotations are hidden.
      if (!visible) return;

      var shouldRender = false;
      for (var i = 0; i < mutations.length; i++) {
        var target = mutations[i].target;
        if (target && target.closest && target.closest('#anno-overlay, #anno-toggle-btn, .anno-popup, .anno-toast')) {
          continue;
        }
        shouldRender = true;
        break;
      }
      if (!shouldRender) return;

      window.clearTimeout(observer._debounceTimer);
      observer._debounceTimer = window.setTimeout(scheduleRender, 300);
    });
    observer.observe(root, { childList: true, subtree: true });
  }

  function init() {
    try {
      ensureToggle();
      ensureOverlay();
      render();
      observeChanges();
    } catch (err) {
      console.warn('[AnnotationRuntime] init failed:', err);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  window.AnnotationRuntime = {
    refresh: render,
    getPageKey: getPageKey,
    getAnnotations: getAnnotations,
    close: closePopup
  };
})();

</script>
</body>
</html>
