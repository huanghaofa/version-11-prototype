/* ========================================
   Global B端 Design Tokens & Shared Components
   ======================================== */

:root {
  /* ---- Color Palette ---- */
  --color-primary: #3370ff;
  --color-primary-hover: #2860e1;
  --color-success: #34c759;
  --color-warning: #ff9500;
  --color-danger: #ff3b30;
  --color-info: #5ac8fa;

  --color-text-primary: #1f2329;
  --color-text-secondary: #646a73;
  --color-text-disabled: #c0c4cc;
  --color-text-placeholder: #8f959e;

  --color-bg-page: #f5f6f8;
  --color-bg-white: #ffffff;
  --color-bg-hover: #f2f3f5;

  --color-border: #e5e6eb;
  --color-border-light: #f0f1f5;
  --color-divider: #ebecf0;

  /* ---- Typography ---- */
  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
  --font-size-xs: 12px;
  --font-size-sm: 13px;
  --font-size-base: 14px;
  --font-size-lg: 16px;
  --font-size-xl: 20px;
  --font-size-xxl: 24px;

  /* ---- Spacing ---- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-lg: 16px;
  --spacing-xl: 24px;
  --spacing-xxl: 32px;

  /* ---- Border Radius ---- */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;

  /* ---- Shadows ---- */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
}

/* ---- Reset ---- */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  color: var(--color-text-primary);
  background: var(--color-bg-page);
  font-family: var(--font-family);
  font-size: var(--font-size-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a {
  color: var(--color-primary);
  text-decoration: none;
}

a:hover {
  color: var(--color-primary-hover);
}

/* ---- Shared Component: Button ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 32px;
  padding: 0 var(--spacing-lg);
  font-size: var(--font-size-base);
  font-weight: 500;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-bg-white);
  color: var(--color-text-primary);
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
  white-space: nowrap;
}

.btn:hover {
  border-color: var(--color-primary);
  color: var(--color-primary);
}

.btn:disabled {
  color: var(--color-text-disabled);
  cursor: not-allowed;
}

.btn-primary {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

.btn-primary:hover {
  background: var(--color-primary-hover);
  border-color: var(--color-primary-hover);
  color: #fff;
}

.btn-danger {
  background: var(--color-danger);
  border-color: var(--color-danger);
  color: #fff;
}

.btn-danger:hover {
  opacity: 0.85;
  color: #fff;
}

/* ---- Shared Component: Table ---- */
.table-wrapper {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--font-size-base);
}

thead th {
  padding: var(--spacing-md) var(--spacing-lg);
  text-align: left;
  font-weight: 600;
  color: var(--color-text-secondary);
  background: var(--color-bg-hover);
  border-bottom: 1px solid var(--color-border);
  white-space: nowrap;
}

tbody td {
  padding: var(--spacing-md) var(--spacing-lg);
  border-bottom: 1px solid var(--color-border-light);
}

tbody tr:hover {
  background: var(--color-bg-hover);
}

/* ---- Shared Component: Form ---- */
.form-group {
  margin-bottom: var(--spacing-lg);
}

.form-label {
  display: block;
  margin-bottom: var(--spacing-xs);
  font-size: var(--font-size-base);
  font-weight: 500;
  color: var(--color-text-primary);
}

.form-input,
.form-select,
.form-textarea {
  width: 100%;
  height: 32px;
  padding: 0 var(--spacing-md);
  font-size: var(--font-size-base);
  font-family: var(--font-family);
  color: var(--color-text-primary);
  background: var(--color-bg-white);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  outline: none;
  transition: border-color 0.2s ease;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus {
  border-color: var(--color-primary);
}

.form-input::placeholder {
  color: var(--color-text-placeholder);
}

.form-textarea {
  height: auto;
  min-height: 80px;
  padding: var(--spacing-sm) var(--spacing-md);
  resize: vertical;
}

/* ---- Shared Component: Card ---- */
.card {
  background: var(--color-bg-white);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--spacing-xl);
  box-shadow: var(--shadow-sm);
}

/* ---- Shared Component: Modal / Dialog ---- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal-content {
  background: var(--color-bg-white);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  min-width: 420px;
  max-width: 90vw;
  max-height: 80vh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--spacing-lg) var(--spacing-xl);
  border-bottom: 1px solid var(--color-border);
}

.modal-body {
  padding: var(--spacing-xl);
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: var(--spacing-sm);
  padding: var(--spacing-lg) var(--spacing-xl);
  border-top: 1px solid var(--color-border);
}

/* ---- Shared Component: Pagination ---- */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-xs);
  padding: var(--spacing-lg) 0;
}

.pagination-item {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 32px;
  height: 32px;
  padding: 0 var(--spacing-sm);
  font-size: var(--font-size-base);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-bg-white);
  color: var(--color-text-primary);
  cursor: pointer;
  transition: all 0.2s ease;
}

.pagination-item:hover {
  border-color: var(--color-primary);
  color: var(--color-primary);
}

.pagination-item.active {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

/* ---- Shared Component: Advanced Search Bar ---- */
.search-bar {
  display: flex;
  align-items: center;
  gap: var(--spacing-md);
  padding: var(--spacing-lg);
  background: var(--color-bg-white);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  margin-bottom: var(--spacing-lg);
}

.search-bar .form-input,
.search-bar .form-select {
  width: auto;
  min-width: 160px;
}

/* ---- Utility ---- */
.text-secondary {
  color: var(--color-text-secondary);
}

.text-muted {
  color: var(--color-text-disabled);
}

.mt-lg {
  margin-top: var(--spacing-lg);
}

.mb-lg {
  margin-bottom: var(--spacing-lg);
}

</style>

  padding: 0 12px;
  border: 1px solid #d9d9d9;
  border-radius: 6px;
  background: #fff;
  color: #262626;
  cursor: pointer;
  font-size: 13px;
}

.anno-btn:hover {
  border-color: #ff4d4f;
  color: #ff4d4f;
}

.anno-btn-primary {
  border-color: #ff4d4f;
  background: #ff4d4f;
  color: #fff;
}

.anno-btn-primary:hover {
  border-color: #ff7875;
  background: #ff7875;
  color: #fff;
}

.anno-edit-field {
  margin-bottom: 12px;
}

.anno-edit-label {
  display: block;
  margin-bottom: 4px;
  color: #595959;
  font-size: 13px;
  font-weight: 600;
}

.anno-edit-input,
.anno-edit-textarea {
  width: 100%;
  box-sizing: border-box;
  border: 1px solid #d9d9d9;
  border-radius: 6px;
  padding: 8px 10px;
  color: #262626;
  font: inherit;
}

.anno-edit-textarea {
  min-height: 56px;
  resize: vertical;
}

.anno-edit-input:focus,
.anno-edit-textarea:focus {
  outline: none;
  border-color: #ff4d4f;
  box-shadow: 0 0 0 2px rgba(255, 77, 79, 0.12);
}

.anno-toast {
  position: fixed;
  top: 24px;
  left: 50%;
  z-index: 100000;
  transform: translateX(-50%);
  padding: 8px 16px;
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.78);
  color: #fff;
  font-size: 13px;
}

(function () {
  'use strict';

  window.showToast = function (message) {
    var root = document.getElementById('toast-root');
    if (!root) return;
    var toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = message;
    root.appendChild(toast);
    window.setTimeout(function () { toast.remove(); }, 2200);
  };
})();

</script>
  <script data-inline-source="js/app.js?v=e3s-sit-20260722-4">
(function () {
  'use strict';

  window.Pages = window.Pages || {};

  var data = window.MockData;
  var scopeTypes = [
    { key: 'parts', label: '选择备件' },
    { key: 'labor', label: '选择工时' },
    { key: 'boutique', label: '选择精品' },
    { key: 'package', label: '选择套餐' },
    { key: 'benefit', label: '选择权益' }
  ];
  var state = { scopeType: '', benefitCodes: [], draftCodes: [], codeKeyword: '', nameKeyword: '' };

  function escapeText(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function row(label, control, required, help, extraClass) {
    return '<div class="sit-form-row' + (extraClass ? ' ' + extraClass : '') + '">' +
      '<span class="sit-label' + (required ? ' required' : '') + '">' + label + '：</span>' +
      '<div class="sit-control">' + control + (help ? '<small>' + help + '</small>' : '') + '</div></div>';
  }

  function selectedBenefits(codes) {
    return codes.map(function (code) {
      return data.benefits.find(function (item) { return item.code === code; });
    }).filter(Boolean);
  }

  function renderScopeOptions() {
    return scopeTypes.map(function (item) {
      var selected = state.scopeType === item.key;
      var locked = state.scopeType && !selected;
      return '<div class="scope-option' + (selected ? ' is-selected' : '') + (locked ? ' is-locked' : '') + '">' +
        '<input class="scope-checkbox" type="checkbox" aria-label="' + item.label + '范围" data-scope="' + item.key + '"' + (selected ? ' checked' : '') + (locked ? ' disabled' : '') + '>' +
        '<button class="scope-button" type="button" data-action="choose-scope" data-scope="' + item.key + '"' + (locked ? ' disabled' : '') + '>' + item.label + '</button>' +
        '</div>';
    }).join('');
  }

  function renderSelectedSummary() {
    var items = selectedBenefits(state.benefitCodes);
    if (!items.length) return '<div class="selected-empty">暂未选择权益产品</div>';
    return '<div class="selected-heading"><strong>已选择 ' + items.length + ' 项权益</strong><button class="link-button" id="edit-benefits" type="button">重新选择</button></div>' +
      '<div class="selected-tags">' + items.map(function (item) {
        return '<span><b>' + escapeText(item.name) + '</b><code>' + escapeText(item.code) + '</code></span>';
      }).join('') + '</div>';
  }

  function renderScopeArea() {
    var list = document.getElementById('scope-choice-list');
    var summary = document.getElementById('benefit-selection-summary');
    if (list) list.innerHTML = renderScopeOptions();
    if (summary) {
      summary.hidden = state.scopeType !== 'benefit' && !state.benefitCodes.length;
      summary.innerHTML = renderSelectedSummary();
    }
    bindScopeArea();
  }

  function chooseScope(scope) {
    state.scopeType = scope;
    renderScopeArea();
    if (scope === 'benefit') openBenefitModal();
    else window.showToast('已选择“' + scopeTypes.find(function (item) { return item.key === scope; }).label.replace('选择', '') + '”适用范围');
  }

  function bindScopeArea() {
    document.querySelectorAll('.scope-checkbox').forEach(function (input) {
      input.addEventListener('change', function () {
        if (input.checked) chooseScope(input.getAttribute('data-scope'));
        else {
          if (state.scopeType === 'benefit') state.benefitCodes = [];
          state.scopeType = '';
          renderScopeArea();
        }
      });
    });
    document.querySelectorAll('[data-action="choose-scope"]').forEach(function (button) {
      button.addEventListener('click', function () { chooseScope(button.getAttribute('data-scope')); });
    });
    var edit = document.getElementById('edit-benefits');
    if (edit) edit.addEventListener('click', openBenefitModal);
  }

  function filteredBenefits() {
    var code = state.codeKeyword.toLowerCase();
    var name = state.nameKeyword.toLowerCase();
    return data.benefits.filter(function (item) {
      return (!code || item.code.toLowerCase().indexOf(code) > -1) && (!name || item.name.toLowerCase().indexOf(name) > -1);
    });
  }

  function renderBenefitRows() {
    var items = filteredBenefits();
    if (!items.length) return '<tr><td colspan="4" class="empty-cell">没有匹配的权益产品</td></tr>';
    return items.map(function (item) {
      return '<tr>' +
        '<td class="check-cell"><input class="benefit-check" type="checkbox" value="' + escapeText(item.code) + '"' + (state.draftCodes.indexOf(item.code) > -1 ? ' checked' : '') + '></td>' +
        '<td><code class="benefit-code">' + escapeText(item.code) + '</code></td>' +
        '<td><strong>' + escapeText(item.name) + '</strong></td>' +
        '<td><details class="benefit-content"><summary>查看权益内容</summary><p>' + escapeText(item.content) + '</p></details></td>' +
        '</tr>';
    }).join('');
  }

  function renderModalTable() {
    var body = document.getElementById('benefit-table-body');
    if (body) body.innerHTML = renderBenefitRows();
    var result = document.getElementById('benefit-result-count');
    if (result) result.textContent = '共 ' + filteredBenefits().length + ' 条';
    var count = document.getElementById('benefit-selected-count');
    if (count) count.textContent = '已勾选 ' + state.draftCodes.length + ' 项';
    bindBenefitChecks();
  }

  function bindBenefitChecks() {
    document.querySelectorAll('.benefit-check').forEach(function (input) {
      input.addEventListener('change', function () {
        if (input.checked && state.draftCodes.indexOf(input.value) < 0) state.draftCodes.push(input.value);
        if (!input.checked) state.draftCodes = state.draftCodes.filter(function (code) { return code !== input.value; });
        var count = document.getElementById('benefit-selected-count');
        if (count) count.textContent = '已勾选 ' + state.draftCodes.length + ' 项';
      });
    });
  }

  function closeBenefitModal() {
    var root = document.getElementById('modal-root');
    if (root) root.innerHTML = '';
  }

  function openBenefitModal() {
    state.scopeType = 'benefit';
    state.draftCodes = state.benefitCodes.slice();
    state.codeKeyword = '';
    state.nameKeyword = '';
    renderScopeArea();
    document.getElementById('modal-root').innerHTML =
      '<div class="modal-overlay"><section class="modal-content benefit-modal" role="dialog" aria-modal="true" aria-labelledby="benefit-modal-title">' +
      '<header class="modal-header"><div><h2 id="benefit-modal-title">选择权益</h2><p>权益类产品数据来源：E3S</p></div><button class="modal-close" id="close-benefit-modal" type="button" aria-label="关闭">×</button></header>' +
      '<div class="modal-body"><div class="modal-tip">支持按权益编码、权益名称查询，可勾选多项；权益内容点击后展开查看。</div>' +
      '<div class="benefit-filters"><label>权益编码<input class="form-input" id="benefit-code-keyword" placeholder="请输入权益编码"></label><label>权益名称<input class="form-input" id="benefit-name-keyword" placeholder="请输入权益名称"></label><button class="btn" id="reset-benefit-filter" type="button">重 置</button><button class="btn btn-primary" id="query-benefits" type="button">查 询</button></div>' +
      '<div class="table-wrapper benefit-table-wrap"><table class="benefit-table"><thead><tr><th>选择</th><th>权益编码</th><th>权益名称</th><th>权益内容</th></tr></thead><tbody id="benefit-table-body">' + renderBenefitRows() + '</tbody></table></div>' +
      '<div class="table-meta"><span id="benefit-result-count">共 ' + data.benefits.length + ' 条</span><strong id="benefit-selected-count">已勾选 ' + state.draftCodes.length + ' 项</strong></div></div>' +
      '<footer class="modal-footer"><button class="btn" id="cancel-benefit-modal" type="button">取 消</button><button class="btn btn-primary" id="confirm-benefits" type="button">确认选择</button></footer></section></div>';
    bindBenefitChecks();
    document.getElementById('close-benefit-modal').addEventListener('click', closeBenefitModal);
    document.getElementById('cancel-benefit-modal').addEventListener('click', closeBenefitModal);
    document.getElementById('query-benefits').addEventListener('click', function () {
      state.codeKeyword = document.getElementById('benefit-code-keyword').value.trim();
      state.nameKeyword = document.getElementById('benefit-name-keyword').value.trim();
      renderModalTable();
    });
    document.getElementById('reset-benefit-filter').addEventListener('click', function () {
      state.codeKeyword = '';
      state.nameKeyword = '';
      document.getElementById('benefit-code-keyword').value = '';
      document.getElementById('benefit-name-keyword').value = '';
      renderModalTable();
    });
    document.getElementById('confirm-benefits').addEventListener('click', function () {
      state.benefitCodes = state.draftCodes.slice();
      closeBenefitModal();
      renderScopeArea();
      window.showToast('已关联 ' + state.benefitCodes.length + ' 项权益产品');
    });
  }

        window.showToast('原型演示：卡券配置已提交');

  function mount() {

    if (!app) return;

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
  else mount();
})();

  <script data-inline-source="annotations/annotation-runtime.js?v=e3s-sit-20260722-4">
(function () {
  'use strict';

  var visible = false;
  var activePopup = null;
  var currentAnno = null;
  var dragState = null;
  var observer = null;

  var sectionFields = [
    ['functionName', '功能名称'],
    ['functionDesc', '功能说明'],
    ['permissionScope', '权限范围'],
    ['dataSource', '数据来源'],
    ['valueLogic', '取值逻辑'],
    ['fieldDesc', '字段说明'],
    ['interactionDesc', '交互说明'],
    ['judgeRule', '判断规则'],
    ['exceptionRule', '异常规则'],
    ['otherDesc', '其他说明']
  ];

  function getConfig() {
    return window.AnnotationConfig || {};
  }

  function getPageKey() {
    var cfg = getConfig();
    if (typeof cfg.page === 'function') return cfg.page();
    if (cfg.page) return cfg.page;
    var active = document.querySelector('.nav-sub-item.active');
    return active && active.id ? active.id : 'index';
  }

  function getRawAnnotations() {
    var cfg = getConfig();
    var page = getPageKey();
    if (cfg.dataKey && Array.isArray(window[cfg.dataKey])) {
      return window[cfg.dataKey].filter(function (item) { return item.page === page; });
    }
    if (window.AnnotationData && Array.isArray(window.AnnotationData[page])) {
      return window.AnnotationData[page];
    }
    return [];
  }

  function storageKey() {
    var cfg = getConfig();
    var projectId = cfg.projectId || window.location.pathname || 'default-project';
    var dataVersion = cfg.dataVersion || '1';
    return ['prototype_annotations', projectId, dataVersion, getPageKey()].join('_');
  }

  function loadCached() {
    try {
      var raw = window.localStorage.getItem(storageKey());
      return raw ? JSON.parse(raw) : [];
    } catch (err) {
      return [];
    }
  }

  function saveCached(items) {
    try {
      window.localStorage.setItem(storageKey(), JSON.stringify(items));
    } catch (err) {
      showToast('保存到浏览器缓存失败');
    }
  }

  function getAnnotations() {
    var source = getRawAnnotations();
    if (!source.length) return [];
    var cached = loadCached();
    var cachedMap = {};
    cached.forEach(function (item) {
      if (item && item.id != null) cachedMap[item.id] = item;
    });
    return source.map(function (item) {
      return clone(cachedMap[item.id] || item);
    }).sort(function (a, b) {
      return Number(a.id) - Number(b.id);
    });
  }

  function clone(value) {
    return JSON.parse(JSON.stringify(value || {}));
  }

  function ensureToggle() {
    var buttons = document.querySelectorAll('#anno-toggle-btn');
    buttons.forEach(function (btn, index) {
      if (index > 0) btn.remove();
    });
    var btn = document.getElementById('anno-toggle-btn');
    if (!btn) {
      btn = document.createElement('button');
      btn.id = 'anno-toggle-btn';
      btn.type = 'button';
      btn.title = '显示/隐藏标注';
      btn.textContent = '●';
      btn.addEventListener('click', function () {
        visible = !visible;
        btn.classList.toggle('anno-hidden', !visible);
        closePopup();
        render();
      });
      document.body.appendChild(btn);
    }
    placeToggle(btn);
  }

  function placeToggle(btn) {
    btn.style.top = 'auto';
    btn.style.left = 'auto';
    btn.style.right = '16px';
    btn.style.bottom = '16px';
    btn.classList.toggle('anno-hidden', !visible);
  }

  function ensureOverlay() {
    var overlay = document.getElementById('anno-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'anno-overlay';
      document.body.appendChild(overlay);
    }
    return overlay;
  }

  function render() {
    ensureToggle();
    var overlay = ensureOverlay();
    overlay.innerHTML = '';
    if (!visible) return;
    getAnnotations().forEach(function (anno, index) {
      var target = resolveTarget(anno.target);
      if (!target) return;
      var marker = document.createElement('button');
      marker.type = 'button';
      marker.className = 'anno-marker';
      marker.textContent = anno.id || String(index + 1);
      marker.title = anno.title || '';
      marker.addEventListener('click', function (event) {
        event.stopPropagation();
        openPopup(anno, marker);
      });
      overlay.appendChild(marker);
      positionMarker(marker, target, anno.position);
    });
  }

  function resolveTarget(selector) {
    if (!selector) return null;
    try {
      var nodes = document.querySelectorAll(selector);
      return nodes.length === 1 ? nodes[0] : null;
    } catch (err) {
      return null;
    }
  }

  function positionMarker(marker, target, position) {
    var rect = target.getBoundingClientRect();
    var pos = position || {};
    var placement = pos.placement || 'top-right';
    var x = rect.right;
    var y = rect.top;
    if (placement.indexOf('left') >= 0) x = rect.left;
    if (placement.indexOf('bottom') >= 0) y = rect.bottom;
    if (placement.indexOf('center') >= 0) y = rect.top + rect.height / 2;
    marker.style.left = Math.round(x + Number(pos.offsetX || 0) - 10) + 'px';
    marker.style.top = Math.round(y + Number(pos.offsetY || 0) - 10) + 'px';
  }

  function openPopup(anno, marker) {
    closePopup();
    currentAnno = clone(anno);
    currentAnno.desc = currentAnno.desc || generateDesc(currentAnno.sections);
    activePopup = document.createElement('div');
    activePopup.className = 'anno-popup';
    activePopup.innerHTML = buildViewHTML(currentAnno);
    document.body.appendChild(activePopup);
    positionPopup(activePopup, marker);
    bindViewEvents();
    bindDrag();
  }

  function positionPopup(popup, marker) {
    var rect = marker.getBoundingClientRect();
    var popupWidth = popup.offsetWidth;
    var popupHeight = popup.offsetHeight;
    var left = rect.right + 12;
    var top = rect.top;
    if (left + popupWidth > window.innerWidth - 16) {
      left = rect.left - popupWidth - 12;
    }
    left = Math.max(16, Math.min(left, window.innerWidth - popupWidth - 16));
    top = Math.max(16, Math.min(top, window.innerHeight - popupHeight - 16));
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  }

  function fitPopupToViewport(popup) {
    if (!popup) return;
    var rect = popup.getBoundingClientRect();
    var left = Math.max(16, Math.min(rect.left, window.innerWidth - rect.width - 16));
    var top = Math.max(16, Math.min(rect.top, window.innerHeight - rect.height - 16));
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  }

  function buildViewHTML(anno) {
    return ''
      + '<div class="anno-popup-header">'
      + '  <div class="anno-popup-title">' + escapeHTML(anno.title || '未命名标注') + '</div>'
      + '  <button class="anno-popup-close" type="button" title="关闭">&times;</button>'
      + '</div>'
      + '<div class="anno-popup-body"><div class="anno-popup-desc">' + (anno.desc || generateDesc(anno.sections)) + '</div></div>'
      + '<div class="anno-popup-footer">'
      + '  <button class="anno-btn anno-copy" type="button">复制数据</button>'
      + '  <button class="anno-btn anno-btn-primary anno-edit" type="button">编辑</button>'
      + '</div>';
  }

  function buildEditHTML(anno) {
    var sections = anno.sections || {};
    var fields = sectionFields.map(function (field) {
      return ''
        + '<div class="anno-edit-field">'
        + '  <label class="anno-edit-label">' + field[1] + '</label>'
        + '  <textarea class="anno-edit-textarea" data-section="' + field[0] + '">' + escapeHTML(sections[field[0]] || '') + '</textarea>'
        + '</div>';
    }).join('');
    return ''
      + '<div class="anno-popup-header">'
      + '  <div class="anno-popup-title">编辑标注</div>'
      + '  <button class="anno-popup-close" type="button" title="关闭">&times;</button>'
      + '</div>'
      + '<div class="anno-popup-body">'
      + '  <div class="anno-edit-field">'
      + '    <label class="anno-edit-label">标注标题</label>'
      + '    <input class="anno-edit-input" id="anno-edit-title" value="' + escapeHTML(anno.title || '') + '">'
      + '  </div>'
      + fields
      + '</div>'
      + '<div class="anno-popup-footer">'
      + '  <button class="anno-btn anno-cancel" type="button">取消</button>'
      + '  <button class="anno-btn anno-copy" type="button">复制数据</button>'
      + '  <button class="anno-btn anno-btn-primary anno-save" type="button">保存</button>'
      + '</div>';
  }

  function bindViewEvents() {
    activePopup.querySelector('.anno-popup-close').addEventListener('click', closePopup);
    activePopup.querySelector('.anno-copy').addEventListener('click', copyCurrent);
    activePopup.querySelector('.anno-edit').addEventListener('click', function () {
      activePopup.innerHTML = buildEditHTML(currentAnno);
      bindEditEvents();
      bindDrag();
      fitPopupToViewport(activePopup);
    });
  }

  function bindEditEvents() {
    activePopup.querySelector('.anno-popup-close').addEventListener('click', closePopup);
    activePopup.querySelector('.anno-cancel').addEventListener('click', function () {
      activePopup.innerHTML = buildViewHTML(currentAnno);
      bindViewEvents();
      bindDrag();
      fitPopupToViewport(activePopup);
    });
    activePopup.querySelector('.anno-copy').addEventListener('click', copyCurrent);
    activePopup.querySelector('.anno-save').addEventListener('click', saveEdit);
  }

  function saveEdit() {
    currentAnno.title = activePopup.querySelector('#anno-edit-title').value.trim();
    currentAnno.sections = {};
    activePopup.querySelectorAll('[data-section]').forEach(function (field) {
      currentAnno.sections[field.getAttribute('data-section')] = field.value.trim();
    });
    sectionFields.forEach(function (field) {
      if (!(field[0] in currentAnno.sections)) currentAnno.sections[field[0]] = '';
    });
    currentAnno.desc = generateDesc(currentAnno.sections);
    var items = getAnnotations();
    var found = false;
    items = items.map(function (item) {
      if (item.id === currentAnno.id) {
        found = true;
        return clone(currentAnno);
      }
      return item;
    });
    if (!found) items.push(clone(currentAnno));
    saveCached(items);
    activePopup.innerHTML = buildViewHTML(currentAnno);
    bindViewEvents();
    bindDrag();
    fitPopupToViewport(activePopup);
    showToast('已保存到浏览器缓存');
  }

  function copyCurrent() {
    if (!currentAnno) return;
    copyText(JSON.stringify(currentAnno, null, 2));
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { showToast('数据已复制'); });
      return;
    }
    var input = document.createElement('textarea');
    input.value = text;
    input.style.position = 'fixed';
    input.style.left = '-9999px';
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    input.remove();
    showToast('数据已复制');
  }

  function bindDrag() {
    var header = activePopup.querySelector('.anno-popup-header');
    header.addEventListener('mousedown', function (event) {
      if (event.target.closest('button')) return;
      var rect = activePopup.getBoundingClientRect();
      dragState = { x: event.clientX - rect.left, y: event.clientY - rect.top };
      event.preventDefault();
    });
  }

  function closePopup() {
    if (activePopup) activePopup.remove();
    activePopup = null;
    currentAnno = null;
    dragState = null;
  }

  function generateDesc(sections) {
    var data = sections || {};
    return sectionFields.map(function (field, index) {
      return (index + 1) + '. ' + field[1] + '：' + escapeHTML(data[field[0]] || '待确认');
    }).join('<br>');
  }

  function escapeHTML(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function showToast(text) {
    var old = document.querySelector('.anno-toast');
    if (old) old.remove();
    var toast = document.createElement('div');
    toast.className = 'anno-toast';
    toast.textContent = text;
    document.body.appendChild(toast);
    setTimeout(function () { toast.remove(); }, 1800);
  }

  document.addEventListener('mousemove', function (event) {
    if (!dragState || !activePopup) return;
    var x = Math.max(8, Math.min(event.clientX - dragState.x, window.innerWidth - activePopup.offsetWidth - 8));
    var y = Math.max(8, Math.min(event.clientY - dragState.y, window.innerHeight - activePopup.offsetHeight - 8));
    activePopup.style.left = x + 'px';
    activePopup.style.top = y + 'px';
  });

  document.addEventListener('mouseup', function () {
    dragState = null;
    fitPopupToViewport(activePopup);
  });

  window.addEventListener('resize', function () {
    render();
    fitPopupToViewport(activePopup);
  });
  window.addEventListener('scroll', render, true);

  function observeChanges() {
    var root = document.getElementById('page-content') || document.body;
    var _lastRender = 0;
    var _rafPending = false;

    function scheduleRender() {
      var now = Date.now();
      // Burst protection: skip if we rendered within the last 200 ms.
      if (now - _lastRender < 200) return;
      if (_rafPending) return;
      _rafPending = true;
      window.requestAnimationFrame(function () {
        _rafPending = false;
        _lastRender = Date.now();
        render();
      });
    }

    observer = new MutationObserver(function (mutations) {
      // Skip entirely when annotations are hidden.
      if (!visible) return;

      var shouldRender = false;
      for (var i = 0; i < mutations.length; i++) {
        var target = mutations[i].target;
        if (target && target.closest && target.closest('#anno-overlay, #anno-toggle-btn, .anno-popup, .anno-toast')) {
          continue;
        }
        shouldRender = true;
        break;
      }
      if (!shouldRender) return;

      window.clearTimeout(observer._debounceTimer);
      observer._debounceTimer = window.setTimeout(scheduleRender, 300);
    });
    observer.observe(root, { childList: true, subtree: true });
  }

  function init() {
    try {
      ensureToggle();
      ensureOverlay();
      render();
      observeChanges();
    } catch (err) {
      console.warn('[AnnotationRuntime] init failed:', err);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  window.AnnotationRuntime = {
    refresh: render,
    getPageKey: getPageKey,
    getAnnotations: getAnnotations,
    close: closePopup
  };
})();

</script>
