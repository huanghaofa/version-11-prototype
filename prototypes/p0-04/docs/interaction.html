<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卡券中心E3S权益编码关联原型 - 交互说明</title>
</head>
<body>
  <main>
    <a href="../index.html">返回演示页面</a>
    <h1>卡券中心E3S权益编码关联原型交互说明</h1>
    <ol>
      <li>在“选择适用范围”中勾选权益，或直接点击“选择权益”。</li>
      <li>系统选中权益类型，并使其他适用范围类型不可选。</li>
      <li>弹窗支持按权益编码、权益名称查询，从E3S权益产品中勾选多项。</li>
      <li>点击“查看权益内容”展开完整内容。</li>
      <li>点击“确认选择”后，在卡券表单回显权益名称和权益编码。</li>
    </ol>
  </main>
</body>
</html>
