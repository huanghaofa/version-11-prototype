/* ========================================
   Global B端 Design Tokens & Shared Components
   ======================================== */

:root {
  /* ---- Color Palette ---- */
  --color-primary: #3370ff;
  --color-primary-hover: #2860e1;
  --color-success: #34c759;
  --color-warning: #ff9500;
  --color-danger: #ff3b30;
  --color-info: #5ac8fa;

  --color-text-primary: #1f2329;
  --color-text-secondary: #646a73;
  --color-text-disabled: #c0c4cc;
  --color-text-placeholder: #8f959e;

  --color-bg-page: #f5f6f8;
  --color-bg-white: #ffffff;
  --color-bg-hover: #f2f3f5;

  --color-border: #e5e6eb;
  --color-border-light: #f0f1f5;
  --color-divider: #ebecf0;

  /* ---- Typography ---- */
  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
  --font-size-xs: 12px;
  --font-size-sm: 13px;
  --font-size-base: 14px;
  --font-size-lg: 16px;
  --font-size-xl: 20px;
  --font-size-xxl: 24px;

  /* ---- Spacing ---- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-lg: 16px;
  --spacing-xl: 24px;
  --spacing-xxl: 32px;

  /* ---- Border Radius ---- */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;

  /* ---- Shadows ---- */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
}

/* ---- Reset ---- */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  color: var(--color-text-primary);
  background: var(--color-bg-page);
  font-family: var(--font-family);
  font-size: var(--font-size-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a {
  color: var(--color-primary);
  text-decoration: none;
}

a:hover {
  color: var(--color-primary-hover);
}

/* ---- Shared Component: Button ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 32px;
  padding: 0 var(--spacing-lg);
  font-size: var(--font-size-base);
  font-weight: 500;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-bg-white);
  color: var(--color-text-primary);
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
  white-space: nowrap;
}

.btn:hover {
  border-color: var(--color-primary);
  color: var(--color-primary);
}

.btn:disabled {
  color: var(--color-text-disabled);
  cursor: not-allowed;
}

.btn-primary {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

.btn-primary:hover {
  background: var(--color-primary-hover);
  border-color: var(--color-primary-hover);
  color: #fff;
}

.btn-danger {
  background: var(--color-danger);
  border-color: var(--color-danger);
  color: #fff;
}

.btn-danger:hover {
  opacity: 0.85;
  color: #fff;
}

/* ---- Shared Component: Table ---- */
.table-wrapper {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--font-size-base);
}

thead th {
  padding: var(--spacing-md) var(--spacing-lg);
  text-align: left;
  font-weight: 600;
  color: var(--color-text-secondary);
  background: var(--color-bg-hover);
  border-bottom: 1px solid var(--color-border);
  white-space: nowrap;
}

tbody td {
  padding: var(--spacing-md) var(--spacing-lg);
  border-bottom: 1px solid var(--color-border-light);
}

tbody tr:hover {
  background: var(--color-bg-hover);
}

/* ---- Shared Component: Form ---- */
.form-group {
  margin-bottom: var(--spacing-lg);
}

.form-label {
  display: block;
  margin-bottom: var(--spacing-xs);
  font-size: var(--font-size-base);
  font-weight: 500;
  color: var(--color-text-primary);
}

.form-input,
.form-select,
.form-textarea {
  width: 100%;
  height: 32px;
  padding: 0 var(--spacing-md);
  font-size: var(--font-size-base);
  font-family: var(--font-family);
  color: var(--color-text-primary);
  background: var(--color-bg-white);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  outline: none;
  transition: border-color 0.2s ease;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus {
  border-color: var(--color-primary);
}

.form-input::placeholder {
  color: var(--color-text-placeholder);
}

.form-textarea {
  height: auto;
  min-height: 80px;
  padding: var(--spacing-sm) var(--spacing-md);
  resize: vertical;
}

/* ---- Shared Component: Card ---- */
.card {
  background: var(--color-bg-white);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--spacing-xl);
  box-shadow: var(--shadow-sm);
}

/* ---- Shared Component: Modal / Dialog ---- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal-content {
  background: var(--color-bg-white);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  min-width: 420px;
  max-width: 90vw;
  max-height: 80vh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--spacing-lg) var(--spacing-xl);
  border-bottom: 1px solid var(--color-border);
}

.modal-body {
  padding: var(--spacing-xl);
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: var(--spacing-sm);
  padding: var(--spacing-lg) var(--spacing-xl);
  border-top: 1px solid var(--color-border);
}

/* ---- Shared Component: Pagination ---- */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-xs);
  padding: var(--spacing-lg) 0;
}

.pagination-item {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 32px;
  height: 32px;
  padding: 0 var(--spacing-sm);
  font-size: var(--font-size-base);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-bg-white);
  color: var(--color-text-primary);
  cursor: pointer;
  transition: all 0.2s ease;
}

.pagination-item:hover {
  border-color: var(--color-primary);
  color: var(--color-primary);
}

.pagination-item.active {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

/* ---- Shared Component: Advanced Search Bar ---- */
.search-bar {
  display: flex;
  align-items: center;
  gap: var(--spacing-md);
  padding: var(--spacing-lg);
  background: var(--color-bg-white);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  margin-bottom: var(--spacing-lg);
}

.search-bar .form-input,
.search-bar .form-select {
  width: auto;
  min-width: 160px;
}

/* ---- Utility ---- */
.text-secondary {
  color: var(--color-text-secondary);
}

.text-muted {
  color: var(--color-text-disabled);
}

.mt-lg {
  margin-top: var(--spacing-lg);
}

.mb-lg {
  margin-bottom: var(--spacing-lg);
}

  function productModal() {
    var mode = window.PrototypeState.ruleMode;
    var currentPage = 1;
    var currentPageGroups = [];
    var draftSelectedIds = window.PrototypeState.selectedProductIds.slice();
    var draftRules = Object.assign({}, window.PrototypeState.couponProductRules);
    var supplierOptions = window.ExchangeCouponMock.suppliers.map(function (supplier) {
      return '<option value="' + supplier.id + '">' + supplier.name + '</option>';
    }).join('');
    var host = window.openModal('<div class="modal-content product-modal"><div class="modal-header"><b>选择适用商品</b><button class="btn btn-link" data-close-modal>×</button></div><div class="modal-body">' +
      '<div class="modal-toolbar"><input class="input" id="productKeyword" placeholder="请输入商品名称、SKU编码或规格"><select class="select" id="categoryFilter" style="max-width:170px"><option value="">全部商品分类</option><option>车联网商品</option><option>精品实物</option><option>门店服务</option></select><select class="select" id="supplierFilter" style="max-width:210px"><option value="">全部供应商</option>' + supplierOptions + '</select><button class="btn btn-primary" id="queryProducts">查询</button><button class="btn" id="resetProducts">重置</button></div>' +
      '<div class="helper supplier-source">供应商下拉数据来源：新商城供应商主数据</div>' +
      '<div class="evidence-note" style="margin:10px 0 12px">整券履约方式：<b>' + typeLabel(window.PrototypeState.couponFulfillmentType) + '</b>。先查询商品，再点击“选择规格”下钻到 SKU；最终候选池、数量规则和回显均以 SKU/规格为单位。</div>' +
      '<div class="table-wrapper"><table><thead><tr><th><label class="product-select-all"><input type="checkbox" id="selectAllProducts"> <span>全选本页全部规格</span></label></th><th>商品</th><th>供应商</th><th>价格区间</th><th>规格数</th><th>履约方式</th><th>操作</th></tr></thead><tbody id="productRows"></tbody></table></div>' +
      '<div class="product-selection-footer"><div class="product-selection-count" id="productSelectionSummary"></div><div class="pagination product-pagination" id="productPagination"></div></div></div>' +
      '<div class="modal-footer"><button class="btn" data-close-modal>取消</button><button class="btn btn-primary" id="confirmProducts">提交</button></div></div>');

    function productGroups() {
      var groups = {};
      compatibleProducts().forEach(function (sku) {
        var spuId = sku.spuId || ('SPU-' + sku.id);
        if (!groups[spuId]) {
          groups[spuId] = {
            id: spuId,
            name: sku.spuName || sku.name,
            category: sku.category,
            subCategory: sku.subCategory,
            supplierId: sku.supplierId,
            supplier: sku.supplier,
            skus: []
          };
        }
        groups[spuId].skus.push(sku);
      });
      return Object.keys(groups).map(function (id) { return groups[id]; });
    }

    function filteredProducts() {
      var keyword = host.querySelector('#productKeyword').value.trim().toLowerCase();
      var category = host.querySelector('#categoryFilter').value;
      var supplier = host.querySelector('#supplierFilter').value;
      return productGroups().filter(function (group) {
        var skuKeywords = group.skus.map(function (sku) { return sku.id + ' ' + (sku.specName || '') + ' ' + sku.name; }).join(' ');
        return (!keyword || (group.name + ' ' + skuKeywords).toLowerCase().indexOf(keyword) > -1) &&
          (!category || group.category === category) &&
          (!supplier || group.supplierId === supplier);
      });
    }

    function selectedSkuCount(group) {
      return group.skus.filter(function (sku) { return draftSelectedIds.indexOf(sku.id) > -1; }).length;
    }

    function rowHtml(group) {
      var selectedCount = selectedSkuCount(group);
      var prices = group.skus.map(function (sku) { return Number(sku.price); });
      var minPrice = Math.min.apply(Math, prices);
      var maxPrice = Math.max.apply(Math, prices);
      var allSelected = selectedCount === group.skus.length;
      return '<tr data-product-row="' + group.id + '"><td><input type="checkbox" class="product-group-check" data-id="' + group.id + '" ' + (allSelected ? 'checked' : '') + ' aria-label="选择 ' + group.name + ' 的全部规格"></td>' +
        '<td><b>' + group.name + '</b><div class="helper">' + group.id + ' · ' + group.category + ' / ' + group.subCategory + '</div></td><td>' + group.supplier + '</td><td class="product-price-range">¥' + minPrice + (minPrice === maxPrice ? '' : ' ～ ¥' + maxPrice) + '</td><td><b>' + group.skus.length + '</b> 个规格<div class="helper">已选 ' + selectedCount + ' 个</div></td><td><span class="tag gray">' + typeLabel(window.PrototypeState.couponFulfillmentType) + '</span></td><td><button class="btn btn-link product-drill-action" data-choose-skus="' + group.id + '">' + (selectedCount ? '修改规格' : '选择规格') + '</button></td></tr>';
    }

    function setDraftSelected(id, selected) {
      var index = draftSelectedIds.indexOf(id);
      if (selected && index === -1) draftSelectedIds.push(id);
      if (!selected && index > -1) draftSelectedIds.splice(index, 1);
      if (!draftRules[id]) draftRules[id] = 1;
    }

    function updateSelectionState() {
      var currentPageSkus = [];
      currentPageGroups.forEach(function (group) { currentPageSkus = currentPageSkus.concat(group.skus); });
      var selectedOnPage = currentPageSkus.filter(function (sku) { return draftSelectedIds.indexOf(sku.id) > -1; }).length;
      var selectAll = host.querySelector('#selectAllProducts');
      selectAll.checked = currentPageSkus.length > 0 && selectedOnPage === currentPageSkus.length;
      selectAll.indeterminate = selectedOnPage > 0 && selectedOnPage < currentPageSkus.length;
      var selectedSpuIds = {};
      compatibleProducts().forEach(function (sku) { if (draftSelectedIds.indexOf(sku.id) > -1) selectedSpuIds[sku.spuId || sku.id] = true; });
      host.querySelector('#productSelectionSummary').innerHTML = '已选 <strong>' + draftSelectedIds.length + '</strong> 个 SKU/规格<span>· 覆盖 ' + Object.keys(selectedSpuIds).length + ' 个商品，翻页和筛选后仍保留</span>';
    }

    function openSkuModal(group) {
      var tempSelectedIds = group.skus.filter(function (sku) { return draftSelectedIds.indexOf(sku.id) > -1; }).map(function (sku) { return sku.id; });
      var tempRules = Object.assign({}, draftRules);
      var specHost = window.openModal('<div class="modal-content sku-modal"><div class="modal-header"><div><b>选择规格 / SKU</b><div class="helper">' + group.name + ' · ' + group.id + '</div></div><button class="btn btn-link" data-close-modal>×</button></div><div class="modal-body">' +
        '<div class="evidence-note" style="margin-bottom:12px">请勾选需要加入兑换券候选池的具体规格。' + (mode === 'choice' ? '“最多可兑换数量”按每个 SKU 独立保存。' : '“固定兑换数量”按每个 SKU 独立保存。') + '</div>' +
        '<div class="sku-selection-note"><label class="product-select-all"><input type="checkbox" id="selectAllSkus"> 全选本商品规格</label><span id="skuSelectionCount"></span></div>' +
        '<div class="table-wrapper sku-modal-table"><table><thead><tr><th>选择</th><th>规格</th><th>SKU编码</th><th>商城价</th><th>可用库存</th><th>' + (mode === 'choice' ? '单SKU最多可兑' : '固定兑换数量') + '</th></tr></thead><tbody id="skuRows"></tbody></table></div></div>' +
        '<div class="modal-footer"><button class="btn" data-close-modal>取消</button><button class="btn btn-primary" id="confirmSkuSelection">确认规格</button></div></div>');

      function renderSkuRows() {
        specHost.querySelector('#skuRows').innerHTML = group.skus.map(function (sku) {
          var checked = tempSelectedIds.indexOf(sku.id) > -1;
          return '<tr data-sku-row="' + sku.id + '"><td><input type="checkbox" class="sku-check" data-id="' + sku.id + '" ' + (checked ? 'checked' : '') + ' aria-label="选择规格 ' + (sku.specName || '默认规格') + '"></td><td><b>' + (sku.specName || '默认规格') + '</b><div class="helper">' + sku.name + '</div></td><td><code>' + sku.id + '</code></td><td>¥' + sku.price + '</td><td>' + (sku.stockLabel || sku.stock) + '</td><td><div class="inline sku-max-inline"><input class="input sku-max-input" type="number" min="1" data-sku-rule="' + sku.id + '" value="' + Number(tempRules[sku.id] || 1) + '" ' + (checked ? '' : 'disabled') + '><span>件</span></div></td></tr>';
        }).join('');
        var selectAllSkus = specHost.querySelector('#selectAllSkus');
        selectAllSkus.checked = tempSelectedIds.length === group.skus.length;
        selectAllSkus.indeterminate = tempSelectedIds.length > 0 && tempSelectedIds.length < group.skus.length;
        specHost.querySelector('#skuSelectionCount').innerHTML = '已选 <b>' + tempSelectedIds.length + '</b> / ' + group.skus.length + ' 个规格';
        specHost.querySelectorAll('.sku-check').forEach(function (check) {
          check.onchange = function () {
            var index = tempSelectedIds.indexOf(check.dataset.id);
            if (check.checked && index === -1) tempSelectedIds.push(check.dataset.id);
            if (!check.checked && index > -1) tempSelectedIds.splice(index, 1);
            if (!tempRules[check.dataset.id]) tempRules[check.dataset.id] = 1;
            renderSkuRows();
          };
        });
        specHost.querySelectorAll('[data-sku-rule]').forEach(function (input) {
          input.onchange = function () { tempRules[input.dataset.skuRule] = Math.max(1, Number(input.value) || 1); input.value = tempRules[input.dataset.skuRule]; };
        });
      }

      specHost.querySelector('#selectAllSkus').onchange = function () {
        tempSelectedIds = this.checked ? group.skus.map(function (sku) { return sku.id; }) : [];
        tempSelectedIds.forEach(function (id) { if (!tempRules[id]) tempRules[id] = 1; });
        renderSkuRows();
      };
      specHost.querySelector('#confirmSkuSelection').onclick = function () {
        group.skus.forEach(function (sku) {
          setDraftSelected(sku.id, tempSelectedIds.indexOf(sku.id) > -1);
          if (tempSelectedIds.indexOf(sku.id) > -1) draftRules[sku.id] = Math.max(1, Number(tempRules[sku.id] || 1));
        });
        specHost.remove();
        renderTable();
      };
      renderSkuRows();
    }

    function bindRows() {
      host.querySelectorAll('.product-group-check').forEach(function (check) {
        var currentGroup = productGroups().find(function (item) { return item.id === check.dataset.id; });
        var currentSelectedCount = selectedSkuCount(currentGroup);
        check.indeterminate = currentSelectedCount > 0 && currentSelectedCount < currentGroup.skus.length;
        check.onchange = function () {
          var group = productGroups().find(function (item) { return item.id === check.dataset.id; });
          group.skus.forEach(function (sku) { setDraftSelected(sku.id, check.checked); });
          renderTable();
        };
      });
      host.querySelectorAll('[data-choose-skus]').forEach(function (button) {
        button.onclick = function () {
          var group = productGroups().find(function (item) { return item.id === button.dataset.chooseSkus; });
          openSkuModal(group);
        };
      });
    }

    function renderPagination(total, totalPages) {
      var pages = '';
      for (var page = 1; page <= totalPages; page++) pages += '<button class="page-chip ' + (page === currentPage ? 'active' : '') + '" data-page="' + page + '">' + page + '</button>';
      host.querySelector('#productPagination').innerHTML = '<span>共 ' + total + ' 个商品</span><span>每页 ' + pageSize + ' 个商品</span><button class="btn pagination-btn" data-page-action="prev" ' + (currentPage === 1 ? 'disabled' : '') + '>上一页</button>' + pages + '<button class="btn pagination-btn" data-page-action="next" ' + (currentPage === totalPages ? 'disabled' : '') + '>下一页</button><span>第 ' + currentPage + ' / ' + totalPages + ' 页</span>';
      host.querySelectorAll('[data-page]').forEach(function (button) { button.onclick = function () { currentPage = Number(button.dataset.page); renderTable(); }; });
      host.querySelector('[data-page-action="prev"]').onclick = function () { if (currentPage > 1) { currentPage--; renderTable(); } };
      host.querySelector('[data-page-action="next"]').onclick = function () { if (currentPage < totalPages) { currentPage++; renderTable(); } };
    }

    function renderTable() {
      var results = filteredProducts();
      var totalPages = Math.max(1, Math.ceil(results.length / pageSize));
      if (currentPage > totalPages) currentPage = totalPages;
      currentPageGroups = results.slice((currentPage - 1) * pageSize, currentPage * pageSize);
      host.querySelector('#productRows').innerHTML = currentPageGroups.length ? currentPageGroups.map(rowHtml).join('') : '<tr><td colspan="7"><div class="product-empty">当前履约方式下暂无符合条件的商品</div></td></tr>';
      bindRows();
      renderPagination(results.length, totalPages);
      updateSelectionState();
    }

    host.querySelector('#selectAllProducts').onchange = function () {
      var checked = this.checked;
      currentPageGroups.forEach(function (group) { group.skus.forEach(function (sku) { setDraftSelected(sku.id, checked); }); });
      renderTable();
    };
    host.querySelector('#queryProducts').onclick = function () { currentPage = 1; renderTable(); };
    host.querySelector('#resetProducts').onclick = function () {
      host.querySelector('#productKeyword').value = '';
      host.querySelector('#categoryFilter').value = '';
      host.querySelector('#supplierFilter').value = '';
      currentPage = 1;
      renderTable();
    };
    host.querySelector('#confirmProducts').onclick = function () {
      var redeemLimit = 2;
      var ids = compatibleProducts().filter(function (product) { return draftSelectedIds.indexOf(product.id) > -1; }).map(function (product) { return product.id; });
      if (mode === 'choice' && ids.length < redeemLimit) { window.showToast('候选商品数不能少于每券可兑换件数2'); return; }
      if (mode === 'choice') {
        var capacity = ids.reduce(function (sum, id) { return sum + Number(draftRules[id] || 1); }, 0);
        if (capacity < redeemLimit) { window.showToast('单商品上限合计不能少于每券可兑换件数2'); return; }
      }
      window.PrototypeState.selectedProductIds = ids;
      var nextRules = {};
      ids.forEach(function (id) { nextRules[id] = Math.max(1, Number(draftRules[id] || 1)); });
      window.PrototypeState.couponProductRules = nextRules;
      host.remove();
      renderSelected();
      window.showToast('已更新兑换商品 SKU/规格配置');
    };
    renderTable();
  }

      if (flow.total() !== coupon.redeemQuantity) { window.showToast('请先按规则选择商品'); return; }

        window.navigateTo('mobile-mall-order');

(function () {

  function statusLabel(type,status){var list=window.ExchangeCouponMock.fulfillmentStatusEnums[type]||[];var hit=list.find(function(s){return s.value===status;});return hit?hit.label:status;}

  <script data-inline-source="js/nav.js?v=coupon-20260728-1">
(function () {
  'use strict';

  var _config = null;
  var _currentPage = 'overview';

  /* ---- Load nav config from config/nav.json ---- */
  function loadConfig() {
    if (window.location.protocol === 'file:' && window.PrototypeNavConfig) {
      _config = window.PrototypeNavConfig;
      render();
      window.navigateTo(_currentPage);
      return;
    }
    return fetch('config/nav.json?v=coupon-20260728-1')
      .then(function (res) { return res.json(); })
      .then(function (cfg) {
        _config = cfg;
        render();
        window.navigateTo(_currentPage);
      })
      .catch(function (err) {
        console.warn('Failed to load config/nav.json, using embedded menu:', err);
        if (window.PrototypeNavConfig) {
          _config = window.PrototypeNavConfig;
          render();
          window.navigateTo(_currentPage);
          return;
        }
        var navEl = document.getElementById('main-nav');
        if (navEl) {
          navEl.innerHTML = '<p style="padding:16px;color:#ff4d4f;font-size:12px;line-height:1.6;">⚠️ 导航加载失败<br>请通过 HTTP 服务器打开页面：<br><code>python3 -m http.server 8080</code></p>';
        }
      });
  }

  /* ---- Render menu tree into #main-nav ---- */
  function render() {
    var navEl = document.getElementById('main-nav');
    if (!navEl || !_config || !_config.menu) return;
    var html = buildTree(_config.menu, 0);
    navEl.innerHTML = html;
    bindClicks(navEl);
    highlightCurrent();
  }

  function buildTree(items, depth) {
    if (!items || !items.length) return '';
    var cls = depth === 0 ? 'nav-list nav-list--root' : 'nav-list nav-list--sub';
    return '<ul class="' + cls + '">' + items.map(function (item) {
      var hasChildren = item.children && item.children.length;
      var linkCls = 'nav-link' + (hasChildren ? ' nav-link--group' : '');
      var icon = item.icon ? '<span class="nav-icon">' + item.icon + '</span>' : '';
      return '<li class="nav-item' + (hasChildren ? ' nav-item--group' : '') + '">' +
        '<a href="#" class="' + linkCls + '" data-page="' + (item.key || '') + '">' +
        icon + '<span class="nav-label">' + (item.label || '') + '</span></a>' +
        (hasChildren ? buildTree(item.children, depth + 1) : '') +
        '</li>';
    }).join('') + '</ul>';
  }

  function bindClicks(navEl) {
    var links = navEl.querySelectorAll('.nav-link[data-page]');
    Array.prototype.forEach.call(links, function (link) {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        var pageKey = this.getAttribute('data-page');
        if (pageKey) window.navigateTo(pageKey);
      });
    });
  }

  function highlightCurrent() {
    var navEl = document.getElementById('main-nav');
    if (!navEl) return;
    var prev = navEl.querySelector('.nav-link.active');
    if (prev) prev.classList.remove('active');
    var cur = navEl.querySelector('.nav-link[data-page="' + _currentPage + '"]');
    if (cur) cur.classList.add('active');
  }

  /* ---- Navigate to page ---- */
  window.navigateTo = function (pageKey) {
    _currentPage = pageKey;
    var page = window.Pages && window.Pages[pageKey];
    if (!page || typeof page.render !== 'function') return;
    document.getElementById('app').innerHTML = page.render();
    if (typeof page.init === 'function') page.init();
    highlightCurrent();
  };

  window.getCurrentPage = function () {
    return _currentPage;
  };

  window.getNavConfig = function () {
    return _config;
  };

  /* ---- Init ---- */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadConfig);
  } else {
    loadConfig();
  }
})();

</script>

  <script data-inline-source="annotations/annotation-runtime.js?v=coupon-20260722-2">
(function () {
  'use strict';

  var visible = true;
  var activePopup = null;
  var currentAnno = null;
  var dragState = null;
  var observer = null;

  var sectionFields = [
    ['functionName', '功能名称'],
    ['functionDesc', '功能说明'],
    ['permissionScope', '权限范围'],
    ['dataSource', '数据来源'],
    ['valueLogic', '取值逻辑'],
    ['fieldDesc', '字段说明'],
    ['interactionDesc', '交互说明'],
    ['judgeRule', '判断规则'],
    ['exceptionRule', '异常规则'],
    ['otherDesc', '其他说明']
  ];

  function getConfig() {
    return window.AnnotationConfig || {};
  }

  function getPageKey() {
    var cfg = getConfig();
    if (typeof cfg.page === 'function') return cfg.page();
    if (cfg.page) return cfg.page;
    var active = document.querySelector('.nav-sub-item.active');
    return active && active.id ? active.id : 'index';
  }

  function getRawAnnotations() {
    var cfg = getConfig();
    var page = getPageKey();
    if (cfg.dataKey && Array.isArray(window[cfg.dataKey])) {
      return window[cfg.dataKey].filter(function (item) { return item.page === page; });
    }
    if (window.AnnotationData && Array.isArray(window.AnnotationData[page])) {
      return window.AnnotationData[page];
    }
    return [];
  }

  function storageKey() {
    var cfg = getConfig();
    var projectId = cfg.projectId || window.location.pathname || 'default-project';
    var dataVersion = cfg.dataVersion || '1';
    return ['prototype_annotations', projectId, dataVersion, getPageKey()].join('_');
  }

  function loadCached() {
    try {
      var raw = window.localStorage.getItem(storageKey());
      return raw ? JSON.parse(raw) : [];
    } catch (err) {
      return [];
    }
  }

  function saveCached(items) {
    try {
      window.localStorage.setItem(storageKey(), JSON.stringify(items));
    } catch (err) {
      showToast('保存到浏览器缓存失败');
    }
  }

  function getAnnotations() {
    var source = getRawAnnotations();
    if (!source.length) return [];
    var cached = loadCached();
    var cachedMap = {};
    cached.forEach(function (item) {
      if (item && item.id != null) cachedMap[item.id] = item;
    });
    return source.map(function (item) {
      return clone(cachedMap[item.id] || item);
    }).sort(function (a, b) {
      return Number(a.id) - Number(b.id);
    });
  }

  function clone(value) {
    return JSON.parse(JSON.stringify(value || {}));
  }

  function ensureToggle() {
    var buttons = document.querySelectorAll('#anno-toggle-btn');
    buttons.forEach(function (btn, index) {
      if (index > 0) btn.remove();
    });
    var btn = document.getElementById('anno-toggle-btn');
    if (!btn) {
      btn = document.createElement('button');
      btn.id = 'anno-toggle-btn';
      btn.type = 'button';
      btn.title = '显示/隐藏标注';
      btn.textContent = '●';
      btn.addEventListener('click', function () {
        visible = !visible;
        btn.classList.toggle('anno-hidden', !visible);
        closePopup();
        render();
      });
      document.body.appendChild(btn);
    }
    placeToggle(btn);
  }

  function placeToggle(btn) {
    var topBar = document.querySelector('.top-bar');
    var sideMenu = document.querySelector('.side-menu, .sidebar, .nav-panel');
    var top = topBar ? topBar.getBoundingClientRect().bottom + 12 : 16;
    var left = sideMenu ? sideMenu.getBoundingClientRect().right + 16 : 16;
    btn.style.top = Math.max(16, top) + 'px';
    btn.style.left = Math.max(16, left) + 'px';
  }

  function ensureOverlay() {
    var overlay = document.getElementById('anno-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'anno-overlay';
      document.body.appendChild(overlay);
    }
    return overlay;
  }

  function render() {
    ensureToggle();
    var overlay = ensureOverlay();
    overlay.innerHTML = '';
    if (!visible) return;
    getAnnotations().forEach(function (anno, index) {
      var target = resolveTarget(anno.target);
      if (!target) return;
      var marker = document.createElement('button');
      marker.type = 'button';
      marker.className = 'anno-marker';
      marker.textContent = anno.id || String(index + 1);
      marker.title = anno.title || '';
      marker.addEventListener('click', function (event) {
        event.stopPropagation();
        openPopup(anno, marker);
      });
      overlay.appendChild(marker);
      positionMarker(marker, target, anno.position);
    });
  }

  function resolveTarget(selector) {
    if (!selector) return null;
    try {
      var nodes = document.querySelectorAll(selector);
      return nodes.length === 1 ? nodes[0] : null;
    } catch (err) {
      return null;
    }
  }

  function positionMarker(marker, target, position) {
    var rect = target.getBoundingClientRect();
    var pos = position || {};
    var placement = pos.placement || 'top-right';
    var x = rect.right;
    var y = rect.top;
    if (placement.indexOf('left') >= 0) x = rect.left;
    if (placement.indexOf('bottom') >= 0) y = rect.bottom;
    if (placement.indexOf('center') >= 0) y = rect.top + rect.height / 2;
    marker.style.left = Math.round(x + Number(pos.offsetX || 0) - 10) + 'px';
    marker.style.top = Math.round(y + Number(pos.offsetY || 0) - 10) + 'px';
  }

  function openPopup(anno, marker) {
    closePopup();
    currentAnno = clone(anno);
    currentAnno.desc = currentAnno.desc || generateDesc(currentAnno.sections);
    activePopup = document.createElement('div');
    activePopup.className = 'anno-popup';
    activePopup.innerHTML = buildViewHTML(currentAnno);
    document.body.appendChild(activePopup);
    positionPopup(activePopup, marker);
    bindViewEvents();
    bindDrag();
  }

  function positionPopup(popup, marker) {
    var rect = marker.getBoundingClientRect();
    var popupWidth = popup.offsetWidth;
    var popupHeight = popup.offsetHeight;
    var left = rect.right + 12;
    var top = rect.top;
    if (left + popupWidth > window.innerWidth - 16) {
      left = rect.left - popupWidth - 12;
    }
    left = Math.max(16, Math.min(left, window.innerWidth - popupWidth - 16));
    top = Math.max(16, Math.min(top, window.innerHeight - popupHeight - 16));
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  }

  function fitPopupToViewport(popup) {
    if (!popup) return;
    var rect = popup.getBoundingClientRect();
    var left = Math.max(16, Math.min(rect.left, window.innerWidth - rect.width - 16));
    var top = Math.max(16, Math.min(rect.top, window.innerHeight - rect.height - 16));
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  }

  function buildViewHTML(anno) {
    return ''
      + '<div class="anno-popup-header">'
      + '  <div class="anno-popup-title">' + escapeHTML(anno.title || '未命名标注') + '</div>'
      + '  <button class="anno-popup-close" type="button" title="关闭">&times;</button>'
      + '</div>'
      + '<div class="anno-popup-body"><div class="anno-popup-desc">' + (anno.desc || generateDesc(anno.sections)) + '</div></div>'
      + '<div class="anno-popup-footer">'
      + '  <button class="anno-btn anno-copy" type="button">复制数据</button>'
      + '  <button class="anno-btn anno-btn-primary anno-edit" type="button">编辑</button>'
      + '</div>';
  }

  function buildEditHTML(anno) {
    var sections = anno.sections || {};
    var fields = sectionFields.map(function (field) {
      return ''
        + '<div class="anno-edit-field">'
        + '  <label class="anno-edit-label">' + field[1] + '</label>'
        + '  <textarea class="anno-edit-textarea" data-section="' + field[0] + '">' + escapeHTML(sections[field[0]] || '') + '</textarea>'
        + '</div>';
    }).join('');
    return ''
      + '<div class="anno-popup-header">'
      + '  <div class="anno-popup-title">编辑标注</div>'
      + '  <button class="anno-popup-close" type="button" title="关闭">&times;</button>'
      + '</div>'
      + '<div class="anno-popup-body">'
      + '  <div class="anno-edit-field">'
      + '    <label class="anno-edit-label">标注标题</label>'
      + '    <input class="anno-edit-input" id="anno-edit-title" value="' + escapeHTML(anno.title || '') + '">'
      + '  </div>'
      + fields
      + '</div>'
      + '<div class="anno-popup-footer">'
      + '  <button class="anno-btn anno-cancel" type="button">取消</button>'
      + '  <button class="anno-btn anno-copy" type="button">复制数据</button>'
      + '  <button class="anno-btn anno-btn-primary anno-save" type="button">保存</button>'
      + '</div>';
  }

  function bindViewEvents() {
    activePopup.querySelector('.anno-popup-close').addEventListener('click', closePopup);
    activePopup.querySelector('.anno-copy').addEventListener('click', copyCurrent);
    activePopup.querySelector('.anno-edit').addEventListener('click', function () {
      activePopup.innerHTML = buildEditHTML(currentAnno);
      bindEditEvents();
      bindDrag();
      fitPopupToViewport(activePopup);
    });
  }

  function bindEditEvents() {
    activePopup.querySelector('.anno-popup-close').addEventListener('click', closePopup);
    activePopup.querySelector('.anno-cancel').addEventListener('click', function () {
      activePopup.innerHTML = buildViewHTML(currentAnno);
      bindViewEvents();
      bindDrag();
      fitPopupToViewport(activePopup);
    });
    activePopup.querySelector('.anno-copy').addEventListener('click', copyCurrent);
    activePopup.querySelector('.anno-save').addEventListener('click', saveEdit);
  }

  function saveEdit() {
    currentAnno.title = activePopup.querySelector('#anno-edit-title').value.trim();
    currentAnno.sections = {};
    activePopup.querySelectorAll('[data-section]').forEach(function (field) {
      currentAnno.sections[field.getAttribute('data-section')] = field.value.trim();
    });
    sectionFields.forEach(function (field) {
      if (!(field[0] in currentAnno.sections)) currentAnno.sections[field[0]] = '';
    });
    currentAnno.desc = generateDesc(currentAnno.sections);
    var items = getAnnotations();
    var found = false;
    items = items.map(function (item) {
      if (item.id === currentAnno.id) {
        found = true;
        return clone(currentAnno);
      }
      return item;
    });
    if (!found) items.push(clone(currentAnno));
    saveCached(items);
    activePopup.innerHTML = buildViewHTML(currentAnno);
    bindViewEvents();
    bindDrag();
    fitPopupToViewport(activePopup);
    showToast('已保存到浏览器缓存');
  }

  function copyCurrent() {
    if (!currentAnno) return;
    copyText(JSON.stringify(currentAnno, null, 2));
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { showToast('数据已复制'); });
      return;
    }
    var input = document.createElement('textarea');
    input.value = text;
    input.style.position = 'fixed';
    input.style.left = '-9999px';
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    input.remove();
    showToast('数据已复制');
  }

  function bindDrag() {
    var header = activePopup.querySelector('.anno-popup-header');
    header.addEventListener('mousedown', function (event) {
      if (event.target.closest('button')) return;
      var rect = activePopup.getBoundingClientRect();
      dragState = { x: event.clientX - rect.left, y: event.clientY - rect.top };
      event.preventDefault();
    });
  }

  function closePopup() {
    if (activePopup) activePopup.remove();
    activePopup = null;
    currentAnno = null;
    dragState = null;
  }

  function generateDesc(sections) {
    var data = sections || {};
    return sectionFields.map(function (field, index) {
      return (index + 1) + '. ' + field[1] + '：' + escapeHTML(data[field[0]] || '待确认');
    }).join('<br>');
  }

  function escapeHTML(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function showToast(text) {
    var old = document.querySelector('.anno-toast');
    if (old) old.remove();
    var toast = document.createElement('div');
    toast.className = 'anno-toast';
    toast.textContent = text;
    document.body.appendChild(toast);
    setTimeout(function () { toast.remove(); }, 1800);
  }

  document.addEventListener('mousemove', function (event) {
    if (!dragState || !activePopup) return;
    var x = Math.max(8, Math.min(event.clientX - dragState.x, window.innerWidth - activePopup.offsetWidth - 8));
    var y = Math.max(8, Math.min(event.clientY - dragState.y, window.innerHeight - activePopup.offsetHeight - 8));
    activePopup.style.left = x + 'px';
    activePopup.style.top = y + 'px';
  });

  document.addEventListener('mouseup', function () {
    dragState = null;
    fitPopupToViewport(activePopup);
  });

  window.addEventListener('resize', function () {
    render();
    fitPopupToViewport(activePopup);
  });
  window.addEventListener('scroll', render, true);

  function observeChanges() {
    var root = document.getElementById('page-content') || document.body;
    var _lastRender = 0;
    var _rafPending = false;

    function scheduleRender() {
      var now = Date.now();
      // Burst protection: skip if we rendered within the last 200 ms.
      if (now - _lastRender < 200) return;
      if (_rafPending) return;
      _rafPending = true;
      window.requestAnimationFrame(function () {
        _rafPending = false;
        _lastRender = Date.now();
        render();
      });
    }

    observer = new MutationObserver(function (mutations) {
      // Skip entirely when annotations are hidden.
      if (!visible) return;

      var shouldRender = false;
      for (var i = 0; i < mutations.length; i++) {
        var target = mutations[i].target;
        if (target && target.closest && target.closest('#anno-overlay, #anno-toggle-btn, .anno-popup, .anno-toast')) {
          continue;
        }
        shouldRender = true;
        break;
      }
      if (!shouldRender) return;

      window.clearTimeout(observer._debounceTimer);
      observer._debounceTimer = window.setTimeout(scheduleRender, 300);
    });
    observer.observe(root, { childList: true, subtree: true });
  }

  function init() {
    try {
      ensureToggle();
      ensureOverlay();
      render();
      observeChanges();
    } catch (err) {
      console.warn('[AnnotationRuntime] init failed:', err);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  window.AnnotationRuntime = {
    refresh: render,
    getPageKey: getPageKey,
    getAnnotations: getAnnotations,
    close: closePopup
  };
})();

</script>
