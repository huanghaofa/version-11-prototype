  <script data-inline-source="js/common.js?v=20260814-1">
(function () {
  'use strict';

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>'"]/g, function (char) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char];
    });
  }

  function showToast(message) {
    var toast = document.getElementById('toast');
    if (!toast) return;
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
  }

  function statusClass(value) {
    if (/不允许|已关闭/.test(value)) return 'danger';
    if (/成功|有效|已核销|已激活|中奖|允许|已启用|已生效/.test(value)) return 'success';
    if (/过期|未中奖|待/.test(value)) return 'warning';
    if (/失效|撤销|失败/.test(value)) return 'danger';
    if (/未激活|未启用|全部|部分/.test(value)) return 'info';
    return 'neutral';
  }

  function status(value) {
    return '<span class="status ' + statusClass(String(value)) + '">' + escapeHtml(value) + '</span>';
  }

  function openDrawer(title, body, foot) {
    var drawer = document.getElementById('detailDrawer');
    var mask = document.getElementById('drawerMask');
    if (!drawer || !mask) return;
    drawer.innerHTML = '<div class="drawer-head"><h2>' + escapeHtml(title) + '</h2><button class="drawer-close" data-close-drawer type="button">×</button></div>' +
      '<div class="drawer-body">' + body + '</div>' +
      '<div class="drawer-foot">' + (foot || '<button class="button" data-close-drawer type="button">关闭</button>') + '</div>';
    drawer.classList.add('open');
    drawer.setAttribute('aria-hidden', 'false');
    mask.hidden = false;
  }

  function closeDrawers() {
    ['detailDrawer','specDrawer'].forEach(function (id) {
      var node = document.getElementById(id);
      if (node) { node.classList.remove('open'); node.setAttribute('aria-hidden','true'); }
    });
    var mask = document.getElementById('drawerMask');
    if (mask) mask.hidden = true;
  }

  function openModal(title, body, foot, className) {
    var modal = document.getElementById('businessModal');
    var mask = document.getElementById('businessModalMask');
    if (!modal || !mask) return;
    modal.className = 'business-modal open' + (className ? ' ' + className : '');
    modal.innerHTML = '<div class="business-modal-head"><h2>' + escapeHtml(title) + '</h2><button class="drawer-close" data-close-modal type="button">×</button></div>' +
      '<div class="business-modal-body">' + body + '</div>' +
      '<div class="business-modal-foot">' + (foot || '<button class="button" data-close-modal type="button">取消</button>') + '</div>';
    modal.setAttribute('aria-hidden', 'false');
    mask.hidden = false;
  }

  function closeModal() {
    var modal = document.getElementById('businessModal');
    var mask = document.getElementById('businessModalMask');
    if (modal) { modal.classList.remove('open'); modal.setAttribute('aria-hidden','true'); }
    if (mask) mask.hidden = true;
  }

  function detailGrid(items) {
    return '<div class="detail-grid">' + items.map(function (item) {
      return '<div class="detail-item"><label>' + escapeHtml(item[0]) + '</label><div>' + (item[2] ? item[1] : escapeHtml(item[1])) + '</div></div>';
    }).join('') + '</div>';
  }

  function detailSection(title, content) {
    return '<section class="detail-section"><h3>' + escapeHtml(title) + '</h3>' + content + '</section>';
  }

  function pagination(total) {
    return '<div class="pagination-row"><span>共 ' + total + ' 条</span><button class="page-no">‹</button><button class="page-no active">1</button><button class="page-no">2</button><button class="page-no">›</button><span>20 条/页</span></div>';
  }

  window.SACommon = {
    escapeHtml: escapeHtml,
    showToast: showToast,
    status: status,
    openDrawer: openDrawer,
    closeDrawers: closeDrawers,
    openModal: openModal,
    closeModal: closeModal,
    detailGrid: detailGrid,
    detailSection: detailSection,
    pagination: pagination
  };

  document.addEventListener('click', function (event) {
    if (event.target.closest('[data-close-drawer]') || event.target.id === 'drawerMask') closeDrawers();
    if (event.target.closest('[data-close-modal]') || event.target.id === 'businessModalMask') closeModal();
  });
})();

</script>

  function updateField(target) {

      state.form.claimMode = target.value === '抽奖' ? '自动抽奖' : '一键领取';

  function persistForm(targetStatus) {
    var form = state.form;
    var existing = findActivity(form.id);
    if (!existing) {
      form.id = 'ACT-SA-DEMO-' + String(data.activityConfigs.length + 1).padStart(3,'0');
      data.activityConfigs.unshift(copyForm(form,'edit'));
      existing = data.activityConfigs[0];
    }
    Object.keys(form).forEach(function (key) { existing[key] = JSON.parse(JSON.stringify(form[key])); });
    existing.status = targetStatus || form.status;
    state.form.status = existing.status;
    state.selectedId = existing.id;
    return existing;
  }

  function handleClick(event) {
    var target;
    if (event.target.closest('[data-placement-new]')) {
      preparePlacement('create'); location.hash = 'sa-placement-edit'; return true;
    }
    if (event.target.closest('[data-open-placement-selector]')) { openPlacementSelector(); return true; }
    if ((target = event.target.closest('[data-placement-selector-tab]'))) {
      state.placementSelectorTab = target.getAttribute('data-placement-selector-tab');
      renderPlacementSelectorModal(); return true;
    }
    if (event.target.closest('[data-remove-placement-candidate]')) {
      state.placementCandidateId = null;
      renderPlacementSelectorModal(); return true;
    }
    if (event.target.closest('[data-confirm-placement-object]')) {
      if (!state.placementCandidateId) { common.showToast('请先选择一个投放对象'); return true; }
      state.placementForm.objectId = state.placementCandidateId;
      syncPlacementObject(state.placementForm);
      common.closeModal();
      window.SAApp.render();
      common.showToast('投放对象已回填'); return true;
    }
    if ((target = event.target.closest('[data-placement-view]'))) {
      state.placementId = target.getAttribute('data-placement-view'); location.hash = 'sa-placement-detail'; return true;
    }
    if ((target = event.target.closest('[data-placement-edit]'))) {
      preparePlacement('edit',target.getAttribute('data-placement-edit')); location.hash = 'sa-placement-edit'; return true;
    }
    if (event.target.closest('[data-placement-back]')) { location.hash = 'sa-placement-manage'; return true; }
    if ((target = event.target.closest('[data-placement-toggle]'))) {
      var placement = findPlacement(target.getAttribute('data-placement-toggle'));
      if (placement) placement.status = placement.status === '已生效' ? '已停用' : '已生效';
      common.showToast(placement && placement.status === '已生效' ? 'SA活动配置已生效' : 'SA活动配置已停用');
      window.SAApp.render(); return true;
    }
    if ((target = event.target.closest('[data-placement-save]'))) {
      var placementForm = state.placementForm || freshPlacement();
      syncPlacementObject(placementForm);
      placementForm.status = target.getAttribute('data-placement-save') === 'active' ? '已生效' : '草稿';
      placementForm.updated = '2026-07-17 12:08:36';
      placementForm.operator = '当前用户';
      var currentPlacement = findPlacement(placementForm.id);
      if (!currentPlacement) {
        placementForm.id = 'SA-PUT-DEMO-' + String(data.saPlacements.length + 1).padStart(3,'0');
        data.saPlacements.unshift(JSON.parse(JSON.stringify(placementForm)));
      } else Object.keys(placementForm).forEach(function (key) { currentPlacement[key] = JSON.parse(JSON.stringify(placementForm[key])); });
      state.placementId = placementForm.id;
      common.showToast(placementForm.status === '已生效' ? 'SA活动配置已保存并生效' : 'SA活动配置草稿已保存');
      location.hash = 'sa-placement-detail'; return true;
    }
    if (event.target.closest('[data-ttl-reset]')) { window.SAApp.render(); common.showToast('已恢复当前已保存配置'); return true; }
    if (event.target.closest('[data-ttl-save]')) {
      var enabledDurations = Array.prototype.slice.call(document.querySelectorAll('[data-ttl-option]:checked')).map(function (node) { return Number(node.value); });
      var defaultDuration = Number(document.querySelector('[data-ttl-default]').value);
      if (!enabledDurations.length) { common.showToast('请至少保留一个可选时长'); return true; }
      if (enabledDurations.indexOf(defaultDuration) === -1) { common.showToast('默认值必须属于已启用时长'); return true; }
      if (enabledDurations.some(function (minutes) { return minutes !== -1 && (minutes < 5 || minutes > 1440); })) { common.showToast('固定有效时长必须在5分钟至1天之间'); return true; }
      data.saQrSettings.durationOptions = enabledDurations;
      data.saQrSettings.defaultMinutes = defaultDuration;
      data.saQrSettings.allowActivityEnd = enabledDurations.indexOf(-1) >= 0;
      data.saQrSettings.version = 'QR-TTL-V6';
      data.saQrSettings.updated = '2026-07-17 12:08:36';
      data.saQrSettings.operator = '当前用户';
      window.SAApp.render(); common.showToast('二维码参数已保存，仅影响新生成二维码'); return true;
    }
    if ((target = event.target.closest('[data-activity-new]'))) {
      prepare('create'); location.hash = 'activity-create'; return true;
    }
    if ((target = event.target.closest('[data-activity-action]'))) {
      var action = target.getAttribute('data-activity-action');
      var id = target.getAttribute('data-id');
      var row = findActivity(id);
      if (action === 'view') { state.selectedId = id; location.hash = 'activity-detail'; }
      if (action === 'edit') { prepare('edit',id); location.hash = 'activity-create'; }
      if (action === 'copy') openCopy(row);
      if (action === 'enable') openEnable(row);
      if (action === 'close') openClose(row);
      return true;
    }
    if ((target = event.target.closest('[data-detail-edit]'))) {
      prepare('edit',target.getAttribute('data-detail-edit')); location.hash = 'activity-create'; return true;
    }
    if (event.target.closest('[data-back-list]')) { location.hash = 'activity-manage'; return true; }
    if ((target = event.target.closest('[data-form-step]'))) { state.step = Number(target.getAttribute('data-form-step')); window.SAApp.render(); return true; }
    if (event.target.closest('[data-form-next]')) { state.step = Math.min(4,state.step + 1); window.SAApp.render(); return true; }
    if (event.target.closest('[data-form-prev]')) { state.step = Math.max(1,state.step - 1); window.SAApp.render(); return true; }
    if (event.target.closest('[data-save-draft]')) { persistForm('草稿'); common.showToast('原型演示：草稿已保存'); return true; }
    if (event.target.closest('[data-submit-activity]')) {
      if (state.form.status === '已启用') { persistForm('已启用'); common.showToast('原型演示：可编辑配置已保存，锁定字段未变更'); }
      else openEnable(state.form);
      return true;
    }
    if (event.target.closest('[data-configure-access]')) { openAccessConfig(); return true; }
    if ((target = event.target.closest('[data-access-enabled]'))) {
      state.accessDraft.enabled = target.getAttribute('data-access-enabled');
      renderAccessConfigModal();
      return true;
    }
    if ((target = event.target.closest('[data-access-level]'))) {
      state.accessDraft.level = target.getAttribute('data-access-level');
      renderAccessConfigModal();
      return true;
    }
    if (event.target.closest('[data-confirm-access]')) {
      var previousLevel = state.form.level;
      state.accessDraft.checkpoints = Array.prototype.slice.call(document.querySelectorAll('[data-access-checkpoint]:checked')).map(function (node) { return node.value; });
      state.form.accessEnabled = state.accessDraft.enabled;
      state.form.level = state.accessDraft.level;
      state.form.checkpoints = state.accessDraft.checkpoints.slice();
      state.form.mutexSubject = accessSubject(state.form.level);
      if (previousLevel !== state.form.level || state.form.accessEnabled !== '启用') state.form.mutexIds = [];
      common.closeModal();
      common.showToast('准入配置已更新，SA链路将直接读取该结果');
      window.SAApp.render();
      return true;
    }
    if (event.target.closest('[data-select-mutex]')) { openMutexSelector(); return true; }
    if (event.target.closest('[data-confirm-copy]')) {
      var copySource = findActivity(state.pendingId); common.closeModal(); prepare('copy',copySource.id); location.hash = 'activity-create'; return true;
    }
    if (event.target.closest('[data-confirm-enable]')) {
      var enableRow = findActivity(state.pendingId);
      if (enableRow) enableRow.status = '已启用';
      else enableRow = persistForm('已启用');
      if (state.form && state.form.id === enableRow.id) state.form.status = '已启用';
      common.closeModal(); common.showToast('活动已启用，关键字段已锁定');
      if (location.hash === '#activity-create') { state.selectedId = enableRow.id; location.hash = 'activity-detail'; } else window.SAApp.render();
      return true;
    }
    if (event.target.closest('[data-confirm-close]')) {
      var closeRow = findActivity(state.pendingId); if (closeRow) closeRow.status = '已关闭';
      common.closeModal(); common.showToast('活动已关闭；二维码内其他有效活动不受影响'); window.SAApp.render(); return true;
    }
    if (event.target.closest('[data-confirm-mutex]')) {
      state.form.mutexIds = Array.prototype.slice.call(document.querySelectorAll('[data-mutex-choice]:checked')).map(function (node) { return node.value; });
      common.closeModal(); common.showToast('已更新互斥活动，互斥主体口径保持为' + state.form.mutexSubject); window.SAApp.render(); return true;
    }
    if ((target = event.target.closest('[data-view-mutex]'))) {
      var relation = data.mutexRelations.find(function (item) { return item.id === target.getAttribute('data-view-mutex'); });
      if (relation) common.openDrawer('活动互斥关系详情', common.detailSection('关系信息',common.detailGrid([
        ['关系ID',relation.id],['生效状态',status(relation.status),true],['活动A',relation.activityA + ' / ' + relation.nameA],['活动A准入',relation.levelA],['活动B',relation.activityB + ' / ' + relation.nameB],['活动B准入',relation.levelB],['互斥主体口径',relation.subject],['配置来源',relation.source],['更新时间',relation.updated]
      ])) + common.detailSection('执行说明','<div class="rule-alert neutral">聚合页加载、用户切换选择及一键参与提交前均按该主体口径校验；命中已参与关系时，另一活动置灰。</div>'));
      return true;
    }
    if (event.target.closest('[data-demo-action]')) { common.showToast('原型演示：已打开原有选择卡券能力'); return true; }
    return false;
  }

  function handleChange(event) {
    if (event.target.matches('[data-placement-candidate]')) {
      state.placementCandidateId = event.target.value;
      renderPlacementSelectorModal(); return;
    }
    if (event.target.matches('[data-placement-type]') && state.placementForm) {
      state.placementForm.objectType = event.target.value;
      state.placementForm.objectId = event.target.value === '组合活动' ? data.comboActivities[0].id : data.activityConfigs.filter(function (item) { return item.status === '已启用' && item.trigger !== '后台统一推送' && item.trigger !== '用户行为触发'; })[0].id;
      syncPlacementObject(state.placementForm);
      window.SAApp.render(); return;
    }
    if (event.target.matches('[data-placement-object]') && state.placementForm) {
      state.placementForm.objectId = event.target.value;
      syncPlacementObject(state.placementForm);
      window.SAApp.render(); return;
    }
    if (event.target.matches('[data-placement-field]') && state.placementForm) {
      state.placementForm[event.target.getAttribute('data-placement-field')] = event.target.value;
      return;
    }
    if (event.target.matches('[data-access-checkpoint]') && state.accessDraft) {
      state.accessDraft.checkpoints = Array.prototype.slice.call(document.querySelectorAll('[data-access-checkpoint]:checked')).map(function (node) { return node.value; });
      event.target.closest('.checkpoint-option').classList.toggle('checked',event.target.checked);
      return;
    }
    if (event.target.matches('[data-activity-field]')) updateField(event.target);
  }

  function onNavigate(route) {
    if (route === 'activity-create' && !state.form) prepare('create');
    if (route === 'sa-placement-edit' && !state.placementForm) preparePlacement('create');
  }

  window.ActivityConfigPages = {
    pages: pages,
    isPage: function (route) { return !!pages[route]; },
    render: render,
    pageActions: pageActions,
    infoStrip: infoStrip,
    handleClick: handleClick,
    handleChange: handleChange,
    onNavigate: onNavigate
  };
})();

      var request = pendingOpen;
      pendingOpen = null;

  }

    var row = data.claimRows.find(function (item) { return item.id === id; });

    var coupon = window.SACommon.detailGrid([
      ['券实例ID',row.id],['券状态',status(row.status),true],['模板ID',row.templateId],['卡券名称',row.coupon],

    ]);
    var owner = window.SACommon.detailGrid([
      ['手机号',row.mobile],['oneID',row.oneId],['券归属主体',status(row.owner),true],['归属VIN',row.vin],['当前VIN可绑定oneID数',String(row.boundCount)]
    ]);
    var source = window.SACommon.detailGrid([
      ['来源渠道','SA动态二维码'],['来源SA',row.sa],['来源门店',row.store],['sceneId',row.sceneId],['scanId',row.scanId],['活动参与流水','<a class="link-action" data-cross-participation="' + row.participationId + '">' + row.participationId + '</a>',true]
    ]);
    window.SACommon.openDrawer('卡券领取详情', window.SACommon.detailSection('卡券信息',coupon) + window.SACommon.detailSection('归属信息',owner) + window.SACommon.detailSection('来源链路',source));
  }

  function openRedemption(id) {
    var row = data.redemptionRows.find(function (item) { return item.id === id; });
    if (!row) return;
    var basic = window.SACommon.detailGrid([
      ['核销流水',row.id],['核销状态',status(row.status),true],['券实例ID',row.couponId],['卡券名称',row.coupon],
      ['来源活动',row.activity],['归属主体',row.owner],['实际核销用户',row.actualUser],['业务单号',row.order]
    ]);
    var stores = window.SACommon.detailGrid([
      ['来源SA',row.sa],['来源门店',row.sourceStore],['实际核销门店',row.redeemStore],['跨店核销',status(row.cross),true]
    ]);
    var amount = window.SACommon.detailGrid([
      ['核销时间',row.redeemed],['订单金额',row.amount],['补贴金额',row.subsidy]
    ]);
    window.SACommon.openDrawer('卡券核销详情', window.SACommon.detailSection('核销信息',basic) + window.SACommon.detailSection('门店归属',stores) + window.SACommon.detailSection('金额信息',amount));
  }

  window.addEventListener('hashchange', navigate);
})();

      otherDesc: '门店范围不修改子活动与卡券核销门店。'
    }

  'sa-qr-settings': [{
    id: 1,
    target: '[data-anno="qr-duration-settings"]',
    title: '二维码有效时长',

    sections: {
      functionName: '二维码时长参数',
      functionDesc: '配置SA生成前可选择的固定时长、长期有效选项和默认值。',

</script>
  <script data-inline-source="annotations/annotation-runtime.js?v=20260814-1">
(function () {
  'use strict';

  var visible = true;
  var activePopup = null;
  var currentAnno = null;
  var dragState = null;
  var observer = null;

  var sectionFields = [
    ['functionName', '功能名称'],
    ['functionDesc', '功能说明'],
    ['permissionScope', '权限范围'],
    ['dataSource', '数据来源'],
    ['valueLogic', '取值逻辑'],
    ['fieldDesc', '字段说明'],
    ['interactionDesc', '交互说明'],
    ['judgeRule', '判断规则'],
    ['exceptionRule', '异常规则'],
    ['otherDesc', '其他说明']
  ];

  function getConfig() {
    return window.AnnotationConfig || {};
  }

  function getPageKey() {
    var cfg = getConfig();
    if (typeof cfg.page === 'function') return cfg.page();
    if (cfg.page) return cfg.page;
    var active = document.querySelector('.nav-sub-item.active');
    return active && active.id ? active.id : 'index';
  }

  function getRawAnnotations() {
    var cfg = getConfig();
    var page = getPageKey();
    if (cfg.dataKey && Array.isArray(window[cfg.dataKey])) {
      return window[cfg.dataKey].filter(function (item) { return item.page === page; });
    }
    if (window.AnnotationData && Array.isArray(window.AnnotationData[page])) {
      return window.AnnotationData[page];
    }
    return [];
  }

  function storageKey() {
    var cfg = getConfig();
    var projectId = cfg.projectId || window.location.pathname || 'default-project';
    var dataVersion = cfg.dataVersion || '1';
    return ['prototype_annotations', projectId, dataVersion, getPageKey()].join('_');
  }

  function loadCached() {
    try {
      var raw = window.localStorage.getItem(storageKey());
      return raw ? JSON.parse(raw) : [];
    } catch (err) {
      return [];
    }
  }

  function saveCached(items) {
    try {
      window.localStorage.setItem(storageKey(), JSON.stringify(items));
    } catch (err) {
      showToast('保存到浏览器缓存失败');
    }
  }

  function getAnnotations() {
    var source = getRawAnnotations();
    if (!source.length) return [];
    var cached = loadCached();
    var cachedMap = {};
    cached.forEach(function (item) {
      if (item && item.id != null) cachedMap[item.id] = item;
    });
    return source.map(function (item) {
      return clone(cachedMap[item.id] || item);
    }).sort(function (a, b) {
      return Number(a.id) - Number(b.id);
    });
  }

  function clone(value) {
    return JSON.parse(JSON.stringify(value || {}));
  }

  function ensureToggle() {
    var buttons = document.querySelectorAll('#anno-toggle-btn');
    buttons.forEach(function (btn, index) {
      if (index > 0) btn.remove();
    });
    var btn = document.getElementById('anno-toggle-btn');
    if (!btn) {
      btn = document.createElement('button');
      btn.id = 'anno-toggle-btn';
      btn.type = 'button';
      btn.title = '显示/隐藏标注';
      btn.textContent = '●';
      btn.addEventListener('click', function () {
        visible = !visible;
        btn.classList.toggle('anno-hidden', !visible);
        closePopup();
        render();
      });
      document.body.appendChild(btn);
    }
    placeToggle(btn);
  }

  function placeToggle(btn) {
    var topBar = document.querySelector('.top-bar');
    var sideMenu = document.querySelector('.side-menu, .sidebar, .nav-panel');
    var top = topBar ? topBar.getBoundingClientRect().bottom + 12 : 16;
    var left = sideMenu ? sideMenu.getBoundingClientRect().right + 16 : 16;
    btn.style.top = Math.max(16, top) + 'px';
    btn.style.left = Math.max(16, left) + 'px';
  }

  function ensureOverlay() {
    var overlay = document.getElementById('anno-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'anno-overlay';
      document.body.appendChild(overlay);
    }
    return overlay;
  }

  function render() {
    ensureToggle();
    var overlay = ensureOverlay();
    overlay.innerHTML = '';
    if (!visible) return;
    getAnnotations().forEach(function (anno, index) {
      var target = resolveTarget(anno.target);
      if (!target) return;
      var marker = document.createElement('button');
      marker.type = 'button';
      marker.className = 'anno-marker';
      marker.textContent = anno.id || String(index + 1);
      marker.title = anno.title || '';
      marker.addEventListener('click', function (event) {
        event.stopPropagation();
        openPopup(anno, marker);
      });
      overlay.appendChild(marker);
      positionMarker(marker, target, anno.position);
    });
  }

  function resolveTarget(selector) {
    if (!selector) return null;
    try {
      var nodes = document.querySelectorAll(selector);
      return nodes.length === 1 ? nodes[0] : null;
    } catch (err) {
      return null;
    }
  }

  function positionMarker(marker, target, position) {
    var rect = target.getBoundingClientRect();
    var pos = position || {};
    var placement = pos.placement || 'top-right';
    var x = rect.right;
    var y = rect.top;
    if (placement.indexOf('left') >= 0) x = rect.left;
    if (placement.indexOf('bottom') >= 0) y = rect.bottom;
    if (placement.indexOf('center') >= 0) y = rect.top + rect.height / 2;
    marker.style.left = Math.round(x + Number(pos.offsetX || 0) - 10) + 'px';
    marker.style.top = Math.round(y + Number(pos.offsetY || 0) - 10) + 'px';
  }

  function openPopup(anno, marker) {
    closePopup();
    currentAnno = clone(anno);
    currentAnno.desc = currentAnno.desc || generateDesc(currentAnno.sections);
    activePopup = document.createElement('div');
    activePopup.className = 'anno-popup';
    activePopup.innerHTML = buildViewHTML(currentAnno);
    document.body.appendChild(activePopup);
    positionPopup(activePopup, marker);
    bindViewEvents();
    bindDrag();
  }

  function positionPopup(popup, marker) {
    var rect = marker.getBoundingClientRect();
    var popupWidth = popup.offsetWidth;
    var popupHeight = popup.offsetHeight;
    var left = rect.right + 12;
    var top = rect.top;
    if (left + popupWidth > window.innerWidth - 16) {
      left = rect.left - popupWidth - 12;
    }
    left = Math.max(16, Math.min(left, window.innerWidth - popupWidth - 16));
    top = Math.max(16, Math.min(top, window.innerHeight - popupHeight - 16));
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  }

  function fitPopupToViewport(popup) {
    if (!popup) return;
    var rect = popup.getBoundingClientRect();
    var left = Math.max(16, Math.min(rect.left, window.innerWidth - rect.width - 16));
    var top = Math.max(16, Math.min(rect.top, window.innerHeight - rect.height - 16));
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  }

  function buildViewHTML(anno) {
    return ''
      + '<div class="anno-popup-header">'
      + '  <div class="anno-popup-title">' + escapeHTML(anno.title || '未命名标注') + '</div>'
      + '  <button class="anno-popup-close" type="button" title="关闭">&times;</button>'
      + '</div>'
      + '<div class="anno-popup-body"><div class="anno-popup-desc">' + (anno.desc || generateDesc(anno.sections)) + '</div></div>'
      + '<div class="anno-popup-footer">'
      + '  <button class="anno-btn anno-copy" type="button">复制数据</button>'
      + '  <button class="anno-btn anno-btn-primary anno-edit" type="button">编辑</button>'
      + '</div>';
  }

  function buildEditHTML(anno) {
    var sections = anno.sections || {};
    var fields = sectionFields.map(function (field) {
      return ''
        + '<div class="anno-edit-field">'
        + '  <label class="anno-edit-label">' + field[1] + '</label>'
        + '  <textarea class="anno-edit-textarea" data-section="' + field[0] + '">' + escapeHTML(sections[field[0]] || '') + '</textarea>'
        + '</div>';
    }).join('');
    return ''
      + '<div class="anno-popup-header">'
      + '  <div class="anno-popup-title">编辑标注</div>'
      + '  <button class="anno-popup-close" type="button" title="关闭">&times;</button>'
      + '</div>'
      + '<div class="anno-popup-body">'
      + '  <div class="anno-edit-field">'
      + '    <label class="anno-edit-label">标注标题</label>'
      + '    <input class="anno-edit-input" id="anno-edit-title" value="' + escapeHTML(anno.title || '') + '">'
      + '  </div>'
      + fields
      + '</div>'
      + '<div class="anno-popup-footer">'
      + '  <button class="anno-btn anno-cancel" type="button">取消</button>'
      + '  <button class="anno-btn anno-copy" type="button">复制数据</button>'
      + '  <button class="anno-btn anno-btn-primary anno-save" type="button">保存</button>'
      + '</div>';
  }

  function bindViewEvents() {
    activePopup.querySelector('.anno-popup-close').addEventListener('click', closePopup);
    activePopup.querySelector('.anno-copy').addEventListener('click', copyCurrent);
    activePopup.querySelector('.anno-edit').addEventListener('click', function () {
      activePopup.innerHTML = buildEditHTML(currentAnno);
      bindEditEvents();
      bindDrag();
      fitPopupToViewport(activePopup);
    });
  }

  function bindEditEvents() {
    activePopup.querySelector('.anno-popup-close').addEventListener('click', closePopup);
    activePopup.querySelector('.anno-cancel').addEventListener('click', function () {
      activePopup.innerHTML = buildViewHTML(currentAnno);
      bindViewEvents();
      bindDrag();
      fitPopupToViewport(activePopup);
    });
    activePopup.querySelector('.anno-copy').addEventListener('click', copyCurrent);
    activePopup.querySelector('.anno-save').addEventListener('click', saveEdit);
  }

  function saveEdit() {
    currentAnno.title = activePopup.querySelector('#anno-edit-title').value.trim();
    currentAnno.sections = {};
    activePopup.querySelectorAll('[data-section]').forEach(function (field) {
      currentAnno.sections[field.getAttribute('data-section')] = field.value.trim();
    });
    sectionFields.forEach(function (field) {
      if (!(field[0] in currentAnno.sections)) currentAnno.sections[field[0]] = '';
    });
    currentAnno.desc = generateDesc(currentAnno.sections);
    var items = getAnnotations();
    var found = false;
    items = items.map(function (item) {
      if (item.id === currentAnno.id) {
        found = true;
        return clone(currentAnno);
      }
      return item;
    });
    if (!found) items.push(clone(currentAnno));
    saveCached(items);
    activePopup.innerHTML = buildViewHTML(currentAnno);
    bindViewEvents();
    bindDrag();
    fitPopupToViewport(activePopup);
    showToast('已保存到浏览器缓存');
  }

  function copyCurrent() {
    if (!currentAnno) return;
    copyText(JSON.stringify(currentAnno, null, 2));
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { showToast('数据已复制'); });
      return;
    }
    var input = document.createElement('textarea');
    input.value = text;
    input.style.position = 'fixed';
    input.style.left = '-9999px';
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    input.remove();
    showToast('数据已复制');
  }

  function bindDrag() {
    var header = activePopup.querySelector('.anno-popup-header');
    header.addEventListener('mousedown', function (event) {
      if (event.target.closest('button')) return;
      var rect = activePopup.getBoundingClientRect();
      dragState = { x: event.clientX - rect.left, y: event.clientY - rect.top };
      event.preventDefault();
    });
  }

  function closePopup() {
    if (activePopup) activePopup.remove();
    activePopup = null;
    currentAnno = null;
    dragState = null;
  }

  function generateDesc(sections) {
    var data = sections || {};
    return sectionFields.map(function (field, index) {
      return (index + 1) + '. ' + field[1] + '：' + escapeHTML(data[field[0]] || '待确认');
    }).join('<br>');
  }

  function escapeHTML(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function showToast(text) {
    var old = document.querySelector('.anno-toast');
    if (old) old.remove();
    var toast = document.createElement('div');
    toast.className = 'anno-toast';
    toast.textContent = text;
    document.body.appendChild(toast);
    setTimeout(function () { toast.remove(); }, 1800);
  }

  document.addEventListener('mousemove', function (event) {
    if (!dragState || !activePopup) return;
    var x = Math.max(8, Math.min(event.clientX - dragState.x, window.innerWidth - activePopup.offsetWidth - 8));
    var y = Math.max(8, Math.min(event.clientY - dragState.y, window.innerHeight - activePopup.offsetHeight - 8));
    activePopup.style.left = x + 'px';
    activePopup.style.top = y + 'px';
  });

  document.addEventListener('mouseup', function () {
    dragState = null;
    fitPopupToViewport(activePopup);
  });

  window.addEventListener('resize', function () {
    render();
    fitPopupToViewport(activePopup);
  });
  window.addEventListener('scroll', render, true);

  function observeChanges() {
    var root = document.getElementById('page-content') || document.body;
    var _lastRender = 0;
    var _rafPending = false;

    function scheduleRender() {
      var now = Date.now();
      // Burst protection: skip if we rendered within the last 200 ms.
      if (now - _lastRender < 200) return;
      if (_rafPending) return;
      _rafPending = true;
      window.requestAnimationFrame(function () {
        _rafPending = false;
        _lastRender = Date.now();
        render();
      });
    }

    observer = new MutationObserver(function (mutations) {
      // Skip entirely when annotations are hidden.
      if (!visible) return;

      var shouldRender = false;
      for (var i = 0; i < mutations.length; i++) {
        var target = mutations[i].target;
        if (target && target.closest && target.closest('#anno-overlay, #anno-toggle-btn, .anno-popup, .anno-toast')) {
          continue;
        }
        shouldRender = true;
        break;
      }
      if (!shouldRender) return;

      window.clearTimeout(observer._debounceTimer);
      observer._debounceTimer = window.setTimeout(scheduleRender, 300);
    });
    observer.observe(root, { childList: true, subtree: true });
  }

  function init() {
    try {
      ensureToggle();
      ensureOverlay();
      render();
      observeChanges();
    } catch (err) {
      console.warn('[AnnotationRuntime] init failed:', err);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  window.AnnotationRuntime = {
    refresh: render,
    getPageKey: getPageKey,
    getAnnotations: getAnnotations,
    close: closePopup
  };
})();
