/* ========================================
   Global B端 Design Tokens & Shared Components
   ======================================== */

:root {
  /* ---- Color Palette ---- */
  --color-primary: #3370ff;
  --color-primary-hover: #2860e1;
  --color-success: #34c759;
  --color-warning: #ff9500;
  --color-danger: #ff3b30;
  --color-info: #5ac8fa;

  --color-text-primary: #1f2329;
  --color-text-secondary: #646a73;
  --color-text-disabled: #c0c4cc;
  --color-text-placeholder: #8f959e;

  --color-bg-page: #f5f6f8;
  --color-bg-white: #ffffff;
  --color-bg-hover: #f2f3f5;

  --color-border: #e5e6eb;
  --color-border-light: #f0f1f5;
  --color-divider: #ebecf0;

  /* ---- Typography ---- */
  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
  --font-size-xs: 12px;
  --font-size-sm: 13px;
  --font-size-base: 14px;
  --font-size-lg: 16px;
  --font-size-xl: 20px;
  --font-size-xxl: 24px;

  /* ---- Spacing ---- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-lg: 16px;
  --spacing-xl: 24px;
  --spacing-xxl: 32px;

  /* ---- Border Radius ---- */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;

  /* ---- Shadows ---- */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
}

/* ---- Reset ---- */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  color: var(--color-text-primary);
  background: var(--color-bg-page);
  font-family: var(--font-family);
  font-size: var(--font-size-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a {
  color: var(--color-primary);
  text-decoration: none;
}

a:hover {
  color: var(--color-primary-hover);
}

/* ---- Shared Component: Button ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 32px;
  padding: 0 var(--spacing-lg);
  font-size: var(--font-size-base);
  font-weight: 500;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-bg-white);
  color: var(--color-text-primary);
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
  white-space: nowrap;
}

.btn:hover {
  border-color: var(--color-primary);
  color: var(--color-primary);
}

.btn:disabled {
  color: var(--color-text-disabled);
  cursor: not-allowed;
}

.btn-primary {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

.btn-primary:hover {
  background: var(--color-primary-hover);
  border-color: var(--color-primary-hover);
  color: #fff;
}

.btn-danger {
  background: var(--color-danger);
  border-color: var(--color-danger);
  color: #fff;
}

.btn-danger:hover {
  opacity: 0.85;
  color: #fff;
}

/* ---- Shared Component: Table ---- */
.table-wrapper {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--font-size-base);
}

thead th {
  padding: var(--spacing-md) var(--spacing-lg);
  text-align: left;
  font-weight: 600;
  color: var(--color-text-secondary);
  background: var(--color-bg-hover);
  border-bottom: 1px solid var(--color-border);
  white-space: nowrap;
}

tbody td {
  padding: var(--spacing-md) var(--spacing-lg);
  border-bottom: 1px solid var(--color-border-light);
}

tbody tr:hover {
  background: var(--color-bg-hover);
}

/* ---- Shared Component: Form ---- */
.form-group {
  margin-bottom: var(--spacing-lg);
}

.form-label {
  display: block;
  margin-bottom: var(--spacing-xs);
  font-size: var(--font-size-base);
  font-weight: 500;
  color: var(--color-text-primary);
}

.form-input,
.form-select,
.form-textarea {
  width: 100%;
  height: 32px;
  padding: 0 var(--spacing-md);
  font-size: var(--font-size-base);
  font-family: var(--font-family);
  color: var(--color-text-primary);
  background: var(--color-bg-white);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  outline: none;
  transition: border-color 0.2s ease;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus {
  border-color: var(--color-primary);
}

.form-input::placeholder {
  color: var(--color-text-placeholder);
}

.form-textarea {
  height: auto;
  min-height: 80px;
  padding: var(--spacing-sm) var(--spacing-md);
  resize: vertical;
}

/* ---- Shared Component: Card ---- */
.card {
  background: var(--color-bg-white);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--spacing-xl);
  box-shadow: var(--shadow-sm);
}

/* ---- Shared Component: Modal / Dialog ---- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal-content {
  background: var(--color-bg-white);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  min-width: 420px;
  max-width: 90vw;
  max-height: 80vh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--spacing-lg) var(--spacing-xl);
  border-bottom: 1px solid var(--color-border);
}

.modal-body {
  padding: var(--spacing-xl);
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: var(--spacing-sm);
  padding: var(--spacing-lg) var(--spacing-xl);
  border-top: 1px solid var(--color-border);
}

/* ---- Shared Component: Pagination ---- */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-xs);
  padding: var(--spacing-lg) 0;
}

.pagination-item {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 32px;
  height: 32px;
  padding: 0 var(--spacing-sm);
  font-size: var(--font-size-base);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-bg-white);
  color: var(--color-text-primary);
  cursor: pointer;
  transition: all 0.2s ease;
}

.pagination-item:hover {
  border-color: var(--color-primary);
  color: var(--color-primary);
}

.pagination-item.active {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

/* ---- Shared Component: Advanced Search Bar ---- */
.search-bar {
  display: flex;
  align-items: center;
  gap: var(--spacing-md);
  padding: var(--spacing-lg);
  background: var(--color-bg-white);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  margin-bottom: var(--spacing-lg);
}

.search-bar .form-input,
.search-bar .form-select {
  width: auto;
  min-width: 160px;
}

/* ---- Utility ---- */
.text-secondary {
  color: var(--color-text-secondary);
}

.text-muted {
  color: var(--color-text-disabled);
}

.mt-lg {
  margin-top: var(--spacing-lg);
}

.mb-lg {
  margin-bottom: var(--spacing-lg);
}

</style>

@media (max-width: 1280px) {
  body { min-width: 1024px; }
  .app-sidebar { width: 218px; flex-basis: 218px; }

  .editor-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }

}

@media (max-width: 720px) {

}

(function () {
  'use strict';

  var toastTimer = null;

  function esc(value) {

      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];

  window.showToast = function (message) {
    var toast = document.getElementById('toast');
    if (!toast) return;

  window.openPageSpec = function () {
    var key = window.getCurrentPage ? window.getCurrentPage() : 'overview';
    var spec = ((window.PrototypeData || {}).pageSpecs || {})[key] || {};
    var enumEvidence = (window.PrototypeEnums || {}).evidence || {};

    drawer.innerHTML = '<div class="spec-head"><div><strong>页面标注与功能说明</strong><div style="font-size:11px;color:#bcd1e5;margin-top:2px">' + esc(spec.title || key) + '</div></div>' +
      '<button class="spec-close" type="button" aria-label="关闭">×</button></div>' +
      '<div class="spec-body">' +
      '<section class="spec-section"><h3>功能说明</h3><p>' + esc(spec.function || '待补充') + '</p></section>' +
      '<section class="spec-section"><h3>当前证据</h3><p class="spec-evidence">' + esc(spec.evidence || '待补充') + '</p></section>' +
      '<section class="spec-section"><h3>下拉枚举与级联口径</h3><p>' + esc((enumEvidence.primary || 'SIT 可见值') + '；' + (enumEvidence.secondary || 'Axure 仅辅助补充分支。')) + '</p><p>' + esc(enumEvidence.limitation || '') + '</p></section>' +
      '<section class="spec-section"><h3>Axure 辅助说明</h3><p>' + esc(spec.axure || '无') + '</p></section>' +
      '<section class="spec-section"><h3>规则 / 风险 / 待确认</h3><ul>' + (spec.risks || []).map(function (item) { return '<li>' + esc(item) + '</li>'; }).join('') + '</ul></section>' +
      '<section class="spec-section"><h3>口径</h3><p>SIT 可见页面、字段、页签和交互优先；未安全触发的条件分支才引用 Axure。原型中的记录值为演示 Mock，不代表测试环境真实业务数据。</p></section>' +
      '<section class="spec-section"><h3>配套文档</h3><p><a href="docs/interaction.html" target="_blank" rel="noopener">打开完整交互与功能说明</a></p></section>' +
      '</div>';

    drawer.setAttribute('aria-hidden', 'false');
    mask.hidden = false;
    drawer.querySelector('.spec-close').addEventListener('click', window.closePageSpec);
  };

  window.closePageSpec = function () {
    var drawer = document.getElementById('specDrawer');
    var mask = document.getElementById('drawerMask');
    if (drawer) { drawer.classList.remove('open'); drawer.setAttribute('aria-hidden', 'true'); }
    if (mask) mask.hidden = true;
  };

  window.openPrototypeModal = function (options) {
    options = options || {};
    window.closePrototypeModal();
    var overlay = document.createElement('div');
    overlay.className = 'prototype-modal';
    overlay.id = 'prototypeModal';
    overlay.innerHTML = '<div class="modal-card ' + (options.wide ? 'wide' : '') + '" role="dialog" aria-modal="true">' +
      '<div class="modal-head"><strong>' + esc(options.title || '功能预览') + '</strong><button class="spec-close modal-x" type="button" aria-label="关闭">×</button></div>' +
      '<div class="modal-body">' + (options.body || '') + '</div>' +
      '<div class="modal-foot"><button class="button modal-cancel" type="button">取消</button>' +
      (options.confirmText === false ? '' : '<button class="button primary modal-confirm" type="button">' + esc(options.confirmText || '确定') + '</button>') + '</div></div>';
    document.body.appendChild(overlay);
    function cancelModal() {
      window.closePrototypeModal();
      if (typeof options.onCancel === 'function') options.onCancel();
    }
    overlay.querySelector('.modal-x').addEventListener('click', cancelModal);
    overlay.querySelector('.modal-cancel').addEventListener('click', cancelModal);
    var confirm = overlay.querySelector('.modal-confirm');
    if (confirm) confirm.addEventListener('click', function () {
      if (typeof options.onConfirm === 'function') options.onConfirm();
      else { window.showToast('原型仅模拟操作，未写入任何数据'); window.closePrototypeModal(); }
    });
  };

  window.closePrototypeModal = function () {
    var modal = document.getElementById('prototypeModal');
    if (modal) modal.remove();
  };

  document.addEventListener('DOMContentLoaded', function () {
    var specButton = document.getElementById('globalSpecButton');
    var mask = document.getElementById('drawerMask');
    if (specButton) specButton.addEventListener('click', window.openPageSpec);
    if (mask) mask.addEventListener('click', window.closePageSpec);

  });
})();

  <script data-inline-source="js/app.js?v=20260716-6">
(function () {
  'use strict';

  window.Pages = window.Pages || {};

  function data() { return window.PrototypeData || {}; }
  function enumData() { return window.PrototypeEnums || {labelMap:{},options:{},cascades:{}}; }
  function esc(value) { return window.escapeHTML ? window.escapeHTML(value) : String(value == null ? '' : value); }
  function spec(key) { return (data().pageSpecs || {})[key] || {}; }

  var activityTabs = [
    ['activity-combo','组合活动列表'],['activity-benefit','专属福利活动列表'],['activity-list','保客活动创建'],
    ['activity-exclusive','保客活动互斥关系'],['activity-qr','保客活动一店一码_HD']
  ];
  var activityReportTabs = [['activity-report','保客活动汇总表'],['activity-trigger-report','保客活动行为触发汇总表']];
  var couponTabs = [
    ['coupon-legacy-issue','优惠券发放'],['coupon-receive-record','领券记录'],['coupon-list','卡券列表'],['coupon-limit','卡券限额'],
    ['coupon-after-report','售后业务报表'],['coupon-business-report','业务报表'],['coupon-writeoff','核销列表'],['coupon-issue','卡券发放'],
    ['coupon-issue-record','发放记录'],['coupon-rules','卡券规则设置'],['coupon-dealer-task','经销商券任务记录'],
    ['coupon-batch','批量操作优惠券'],['coupon-redemption','领券管理(领券中心)']
  ];

  function pageTabs(key) {
    if (key.indexOf('coupon-') === 0) return couponTabs;
    if (key === 'activity-report' || key === 'activity-trigger-report') return activityReportTabs;
    if (key.indexOf('activity-') === 0) return activityTabs;
    return [];
  }

  function frame(key, body, actions) {
    var s = spec(key);
    var tabs = pageTabs(key);
    var bottomTabs = tabs.length ? tabs.slice(0, 8) : [['overview','现状总览']];
    return '<div class="workspace" data-page-key="' + esc(key) + '">' +
      '<div class="crumb-bar"><i class="iconfont icon-home-fill" aria-hidden="true"></i><span>工作台</span><span>&gt;</span><span>' + esc(s.group || '现状总览') + '</span><span>&gt;</span><strong>' + esc(s.title || '') + '</strong></div>' +
      (tabs.length ? '<div class="page-tabs">' + tabs.map(function (item) {
        return '<button class="page-tab ' + (item[0] === key || (key === 'activity-editor' && item[0] === 'activity-list') ? 'active' : '') + '" data-nav="' + item[0] + '" type="button">' + esc(item[1]) + '</button>';
      }).join('') + '</div>' : '') +
      '<div class="content-wrap"><div class="page-heading"><div><h1>' + esc(s.title || '') + '</h1></div>' +
      '<div class="page-actions">' + (actions || '') + '<button class="button ghost-blue" data-action="open-spec" type="button">标注与功能说明</button></div></div>' +
      sourceStrip(key) + body + '</div><div class="bottom-work-tabs">' + bottomTabs.map(function (item) {
        return '<button class="bottom-work-tab ' + (item[0] === key || (key === 'activity-editor' && item[0] === 'activity-list') ? 'active' : '') + '" data-nav="' + item[0] + '" type="button">' + esc(item[1]) + '<span>×</span></button>';
      }).join('') + '<button class="bottom-grid" type="button" title="全部窗口"><i class="iconfont icon-more" aria-hidden="true"></i></button></div></div>';
  }

  function sourceStrip(key) {
    var s = spec(key);
    return '<div class="source-strip" data-anno="source-strip"><span><strong>功能说明：</strong>' + esc(s.function || '按当前 SIT 可见能力还原') + '</span>' +
      '<span class="source-meta">SIT 现状为准 · Axure 说明辅助 · 数据为演示 Mock</span></div>';
  }

  function panel(title, note, body, anno) {
    return '<section class="panel"' + (anno ? ' data-anno="' + anno + '"' : '') + '><div class="panel-head"><div class="panel-title">' + esc(title) +
      (note ? '<span class="panel-note">' + esc(note) + '</span>' : '') + '</div></div><div class="panel-body">' + body + '</div></section>';
  }

  function enumKeyFor(label, config) {
    return (config && config.enumKey) || (enumData().labelMap || {})[label] || '';
  }

  function optionHTML(value, selected) {
    return '<option value="' + esc(value) + '"' + (value === selected ? ' selected' : '') + '>' + esc(value) + '</option>';
  }

  function field(label, placeholder, type, required, config) {
    config = config || {};
    var key = enumKeyFor(label, config);
    var cascade = key && (enumData().cascades || {})[key];
    var selected = config.defaultValue || '';
    var options = key ? ((enumData().options || {})[key] || []) : [];
    if (!selected && placeholder && placeholder !== '请选择' && options.indexOf(placeholder) >= 0) selected = placeholder;
    var attrs = key ? ' data-enum-key="' + esc(key) + '"' : '';
    if (cascade) attrs += ' data-cascade-parent="' + esc(cascade.parentKey) + '"';
    var control;
    if (type === 'select') {
      var selectOptions = '<option value="">请选择</option>';
      if (!cascade) selectOptions += options.map(function (value) { return optionHTML(value, selected); }).join('');
      control = '<select aria-label="' + esc(label) + '"' + attrs + (cascade ? ' disabled' : '') + '>' + selectOptions + '</select>';
    } else {
      control = '<input type="text" placeholder="' + esc(placeholder || '请输入') + '"' + attrs + '>';
    }
    var wrapperAttrs = key ? ' data-field-key="' + esc(key) + '"' : '';
    if (config.visibleFor) wrapperAttrs += ' data-conditional-parent="' + esc(config.conditionalParent || 'businessScenario') + '" data-visible-for="' + esc(config.visibleFor) + '" hidden';
    return '<div class="field' + (config.className ? ' ' + esc(config.className) : '') + '"' + wrapperAttrs + '><label class="' + (required ? 'required' : '') + '">' + esc(label) + '</label>' + control + (config.help ? '<div class="field-help">' + esc(config.help) + '</div>' : '') + '</div>';
  }

  function searchPanel(fields, anno) {
    return panel('查询条件', '支持折叠/展开；本原型展示常用条件', '<div class="search-grid" data-filter-form data-anno="enum-cascade">' + fields.map(function (item) {
      return field(item[0], item[1], item[2], item[3], item[4]);
    }).join('') + '<div class="search-actions"><button class="button" data-action="reset" type="button">重置</button><button class="button primary" data-action="search" type="button">查询</button></div></div>', anno || 'search-area');
  }

  function cascadeContext(select, root) {
    return select.closest('[data-filter-form], .editor-grid, .modal-body, .panel-body') || root;
  }

  function setCascadeOptions(select, parentValue) {
    var key = select.getAttribute('data-enum-key');
    var cascade = (enumData().cascades || {})[key];
    if (!cascade) return;
    var values = parentValue ? (cascade.values[parentValue] || []) : [];
    var previous = select.value;
    select.innerHTML = '<option value="">' + (parentValue ? (values.length ? '请选择' : '暂无已确认枚举') : '请先选择上级条件') + '</option>' + values.map(function (value) { return optionHTML(value, previous); }).join('');
    select.disabled = !parentValue || !values.length;
    if (values.indexOf(previous) < 0) select.value = '';
  }

  function updateConditionalFields(context, parentKey, value) {
    Array.prototype.forEach.call(context.querySelectorAll('[data-conditional-parent="' + parentKey + '"]'), function (wrapper) {
      var allowed = (wrapper.getAttribute('data-visible-for') || '').split(',');
      wrapper.hidden = !value || allowed.indexOf(value) < 0;
      Array.prototype.forEach.call(wrapper.querySelectorAll('input,select,textarea'), function (control) { control.disabled = wrapper.hidden; });
    });
    var scenarioNote = context.querySelector('[data-scenario-note]');
    if (scenarioNote && parentKey === 'businessScenario') {
      var notes = {
        '售前营销':'展示车型、专营店及售前活动字段；日产售前分支还包含 CAP/直播/区域/试驾/新车上市。',
        '售后营销':'展示车型、专营店及售后核销范围。',
        '售后营销-上门取送车':'展示取送车适用车型与服务门店。',
        '商城营销':'展示适用商城商品，不展示门店与车型选择。'
      };
      scenarioNote.textContent = notes[value] || '请先选择业务场景，系统将联动卡券分类和适用范围。';
    }
  }

  function refreshCascadeTree(parentSelect, root) {
    var parentKey = parentSelect.getAttribute('data-enum-key');
    var context = cascadeContext(parentSelect, root);
    updateConditionalFields(context, parentKey, parentSelect.value);
    Array.prototype.forEach.call(context.querySelectorAll('select[data-cascade-parent="' + parentKey + '"]'), function (child) {
      setCascadeOptions(child, parentSelect.value);
      refreshCascadeTree(child, root);
    });
  }

  function initializeEnums(root) {
    if (!root) return;
    Array.prototype.forEach.call(root.querySelectorAll('select[data-cascade-parent]'), function (select) {
      var context = cascadeContext(select, root);
      var parentKey = select.getAttribute('data-cascade-parent');
      var parent = context.querySelector('select[data-enum-key="' + parentKey + '"]');
      setCascadeOptions(select, parent ? parent.value : '');
    });
    Array.prototype.forEach.call(root.querySelectorAll('select[data-enum-key]'), function (select) {
      updateConditionalFields(cascadeContext(select, root), select.getAttribute('data-enum-key'), select.value);
    });
  }

  function bindEnumInteractions(root) {
    if (!root) return;
    initializeEnums(root);
    if (root.getAttribute('data-enums-bound') === 'true') return;
    root.setAttribute('data-enums-bound', 'true');
    root.addEventListener('change', function (event) {
      var select = event.target.closest('select[data-enum-key]');
      if (select && root.contains(select)) refreshCascadeTree(select, root);
    });
  }

  function renderCell(value) {
    var statusValues = ['进行中','未开始','已关闭','草稿','启用','停用','已启用','已停用','执行完成','执行中','待执行','部分失败','已核销','已撤销','已生成'];
    if (statusValues.indexOf(String(value)) >= 0) {
      var cls = /完成|进行|启用|已核销|已生成/.test(value) ? 'on' : (/待|草稿|未开始|执行中/.test(value) ? 'pending' : 'off');
      return '<span class="status ' + cls + '">' + esc(value) + '</span>';
    }
    return esc(value);
  }

  function table(columns, rows, options) {
    options = options || {};
    var actions = options.actions === false ? false : true;
    var head = columns.map(function (col) { return '<th>' + esc(col) + '</th>'; }).join('') + (actions ? '<th>操作</th>' : '');
    var body;
    if (!rows || !rows.length) {
      body = '<tr><td colspan="' + (columns.length + (actions ? 1 : 0)) + '"><div class="empty-state"><i class="iconfont icon-wendangfujian empty-document-icon" aria-hidden="true"></i><strong>暂无数据</strong><div style="margin-top:4px">与 SIT 本次打开时的空态一致</div></div></td></tr>';
    } else {
      body = rows.map(function (row, rowIndex) {
        var viewAction = options.viewAction || 'view-row';
        var editAction = options.editAction || 'edit-row';
        return '<tr>' + columns.map(function (_, index) { return '<td>' + renderCell(row[index]) + '</td>'; }).join('') +
          (actions ? '<td><button class="link-action" data-action="' + esc(viewAction) + '" data-row-index="' + rowIndex + '" type="button">查看</button><button class="link-action" data-action="' + esc(editAction) + '" data-row-index="' + rowIndex + '" type="button">编辑</button></td>' : '') + '</tr>';
      }).join('');
    }
    return '<div class="table-shell"><table class="data-table"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>' +
      '<div class="pagination-row"><span>共 ' + esc(options.total == null ? (rows || []).length : options.total) + ' 条</span><button class="page-no active" type="button">1</button><button class="page-no" type="button">2</button><button class="page-no" type="button">3</button></div>';
  }

  function listPanel(title, columns, rows, options, anno) {
    options = options || {};
    var tools = '<div><button class="button small" data-action="refresh" type="button">刷新</button> <button class="button small" data-action="columns" type="button">字段说明</button></div>';
    return '<section class="panel" data-anno="' + (anno || 'result-table') + '"><div class="panel-head"><div class="panel-title">' + esc(title) + '</div>' + tools + '</div><div class="panel-body">' + table(columns, rows, options) + '</div></section>';
  }

  function bindCommon(root) {
    bindEnumInteractions(root);
    Array.prototype.forEach.call(root.querySelectorAll('[data-nav]'), function (el) {
      el.addEventListener('click', function () { window.navigateTo(this.getAttribute('data-nav'), true); });
    });
    root.addEventListener('click', function (event) {
      var target = event.target.closest('[data-action]');
      if (!target) return;
      var action = target.getAttribute('data-action');
      if (action === 'open-spec') window.openPageSpec();
      if (action === 'reset') {
        Array.prototype.forEach.call(root.querySelectorAll('[data-filter-form] input'), function (input) { input.value = ''; });
        Array.prototype.forEach.call(root.querySelectorAll('[data-filter-form] select'), function (select) { select.selectedIndex = 0; });
        initializeEnums(root);
        window.showToast('查询条件已重置');
      }
      if (action === 'search') window.showToast('已按当前条件刷新演示列表');
      if (action === 'refresh') window.showToast('列表已刷新');
      if (action === 'columns') openColumnGuide();
      if (action === 'view-row') openRecordModal('查看详情', false);
      if (action === 'edit-row') openRecordModal('编辑记录', true);
      if (action === 'new-generic') openGenericCreate(target.getAttribute('data-modal-title') || '新建');
      if (action === 'export') window.showToast('原型仅模拟导出，不会下载或发送真实数据');

  }

  function openColumnGuide() {
    window.openPrototypeModal({title:'字段说明',confirmText:false,body:'<div class="info-callout">字段名称与页面结构来自 SIT 只读检查；表格记录为演示 Mock。正式迭代时，请先更新 <code>mock/data.js</code>，再同步页面标注。</div>' +
      '<div class="annotation-summary" style="margin-top:14px"><div class="annotation-card"><div class="number">1</div><h4>查询字段</h4><p>控制列表过滤，不改变业务数据。</p></div><div class="annotation-card"><div class="number">2</div><h4>列表字段</h4><p>用于现状追踪、导出与操作入口。</p></div><div class="annotation-card"><div class="number">3</div><h4>状态字段</h4><p>状态口径需结合后端接口和枚举表确认。</p></div></div>'});
  }

  function openRecordModal(title, editable) {
    window.openPrototypeModal({title:title,confirmText:editable ? '保存演示' : false,body:'<div class="editor-grid" style="padding:0">' +
      field('记录ID','系统自动生成','input') + field('记录名称','演示记录','input') + field('当前状态','请选择','select') +
      '<div class="field span-3"><label>说明</label><textarea placeholder="查看或补充说明"></textarea></div></div>'});
    bindEnumInteractions(document.getElementById('prototypeModal'));
  }

  function openGenericCreate(title) {
    window.openPrototypeModal({title:title,wide:true,confirmText:'保存草稿',body:'<div class="info-callout">此弹窗用于验证后续修改入口，保存动作不会写入 SIT。</div><div class="editor-grid" style="padding:16px 0 0">' +

  function comboUniqueValues(items, key) {
    return items.map(function (item) { return item[key]; }).filter(function (value, index, values) { return values.indexOf(value) === index; });
  }
  function filteredComboStores() {
    var keyword = comboStoreUI.keyword.trim().toLowerCase();
    return availableComboStores().filter(function (store) {
      if (comboStoreUI.tab === 'selected' && !comboStoreUI.selection.has(store.id)) return false;
      if (!keyword) return true;
      return [store.name,store.code,store.brand,store.province,store.city].some(function (value) { return String(value).toLowerCase().indexOf(keyword) > -1; });
    });
  }
  function comboGroupRow(label, stores, level) {
    var ids = stores.map(function (store) { return store.id; });
    var selected = ids.filter(function (id) { return comboStoreUI.selection.has(id); }).length;
    var checked = ids.length > 0 && selected === ids.length;
    var partial = selected > 0 && selected < ids.length;
    return '<div class="combo-store-row group level-' + level + '"><label><input type="checkbox" data-combo-store-group="' + ids.join(',') + '"' + (checked ? ' checked' : '') + (partial ? ' data-partial="true"' : '') + '><span>' + esc(label) + '</span></label><small>' + selected + '/' + ids.length + '</small></div>';
  }
  function renderComboStoreTree() {
    var stores = filteredComboStores();
    if (!stores.length) return '<div class="empty-state combo-store-empty"><strong>没有匹配的可用门店</strong><div>调整搜索条件或切换“全部门店”页签。</div></div>';
    var html = '';
    comboUniqueValues(stores,'brand').forEach(function (brand) {
      var brandStores = stores.filter(function (store) { return store.brand === brand; });
      html += comboGroupRow(brand,brandStores,1);
      comboUniqueValues(brandStores,'province').forEach(function (province) {
        var provinceStores = brandStores.filter(function (store) { return store.province === province; });
        html += comboGroupRow(province,provinceStores,2);
        comboUniqueValues(provinceStores,'city').forEach(function (city) {
          var cityStores = provinceStores.filter(function (store) { return store.city === city; });
          html += comboGroupRow(city,cityStores,3);
          cityStores.forEach(function (store) {
            html += '<div class="combo-store-row store level-4"><label><input type="checkbox" data-combo-store-id="' + esc(store.id) + '"' + (comboStoreUI.selection.has(store.id) ? ' checked' : '') + '><span><strong>' + esc(store.name) + '</strong><small>门店编码：' + esc(store.code) + '</small></span></label></div>';
          });
        });
      });
    });
    return html;
  }
  function bindComboStoreSelector() {
    var modal = document.getElementById('prototypeModal');
    if (!modal) return;
    Array.prototype.forEach.call(modal.querySelectorAll('[data-partial="true"]'), function (input) { input.indeterminate = true; });
    Array.prototype.forEach.call(modal.querySelectorAll('[data-combo-store-id]'), function (input) {
      input.addEventListener('change', function () { if (input.checked) comboStoreUI.selection.add(input.getAttribute('data-combo-store-id')); else comboStoreUI.selection.delete(input.getAttribute('data-combo-store-id')); openComboStoreSelector(); });
    });
    Array.prototype.forEach.call(modal.querySelectorAll('[data-combo-store-group]'), function (input) {
      input.addEventListener('change', function () { input.getAttribute('data-combo-store-group').split(',').filter(Boolean).forEach(function (id) { if (input.checked) comboStoreUI.selection.add(id); else comboStoreUI.selection.delete(id); }); openComboStoreSelector(); });
    });
    Array.prototype.forEach.call(modal.querySelectorAll('[data-combo-store-tab]'), function (button) {
      button.addEventListener('click', function () { comboStoreUI.tab = button.getAttribute('data-combo-store-tab'); openComboStoreSelector(); });

    var runSearch = function () { comboStoreUI.keyword = search ? search.value : ''; openComboStoreSelector(); };
    var searchButton = modal.querySelector('[data-combo-store-search-button]');
    if (searchButton) searchButton.addEventListener('click', runSearch);
    if (search) search.addEventListener('keydown', function (event) { if (event.key === 'Enter') runSearch(); });
    var reset = modal.querySelector('[data-combo-store-reset]');
    if (reset) reset.addEventListener('click', function () { comboStoreUI.keyword='';openComboStoreSelector(); });

    'activity-exclusive': [sourceNote('互斥关系','SIT 活动互斥/卡券互斥页签；Axure 图2/图3/图9。'),note(2,'[data-anno="exclusive-tabs"]','两类互斥关系','售后活动规则查询','活动互斥与活动内卡券叠加/互斥分开查询。','SIT + Axure。','切换页签更新查询维度和列表字段。','不能与售前卡券中心独立叠加规则混写。','全部叠加/全部互斥在 SIT 列表不可审计，标记为待确认。')],
    'activity-qr': [sourceNote('一店一码','SIT 一店一码；Axure 1.2。'),note(2,'[data-anno="result-table"]','门店二维码','一店一码管理','按活动和门店生成页面地址及二维码。','SIT + Axure。','查看和下载仅模拟。','二维码必须绑定唯一活动、门店和渠道。','生成失败时应返回明确失败原因。')],
    'activity-report': [sourceNote('活动汇总表','SIT 汇总表；Axure 2.1。'),note(2,'[data-anno="result-table"]','活动统计','保客活动汇总','按活动统计 PV、UV、参与人数和转化。','SIT + Axure。','查询时间示意不超过3个月。','指标口径与明细必须一致。','超出时间范围应阻断并提示。')],
    'activity-trigger-report': [sourceNote('行为触发汇总','SIT 行为触发/激活/失效；Axure 2.2。'),note(2,'[data-anno="result-table"]','触发上报','行为触发追踪','按场景标识追踪上报成功、失败和最近时间。','SIT + Axure。','查询和详情仅模拟。','场景标识需同步中文含义与来源系统。','未知场景或上报失败需支持跨系统排查。')]
  };

  var couponPages = {
    'coupon-legacy-issue':['优惠券发放','历史模板式发券，SIT 414 条。','与新卡券发放主从关系待确认。'],
    'coupon-receive-record':['领券记录','SIT 本次暂无数据，表头 26 字段。','空态原因和批量领券记录入口待确认。'],
    'coupon-list':['卡券列表','SIT 列表空态，新建页可进入。','业务场景切换会改变车型、门店、商品范围。'],
    'coupon-limit':['卡券限额','SIT 28 条任务。','当前新建任务固定售前营销/在线购车。'],
    'coupon-after-report':['售后业务报表','SIT 总部汇总/明细。','店端报表不在 13 页范围。'],
    'coupon-business-report':['业务报表','SIT 在线购车统计。','新商城改造后统计维度需同步。'],
    'coupon-writeoff':['核销列表','SIT 36 个核销及补贴字段。','撤销与异常补偿需接口证据。'],
    'coupon-issue':['卡券发放','SIT 341 条任务。','建议未来作为主链路，仍待业务确认。'],
    'coupon-issue-record':['发放记录','SIT 13,302 条。','失败原因需可操作且导出要受权限控制。'],
    'coupon-rules':['卡券规则设置','SIT 225 条，实质为结算规则。','菜单名与实际能力范围不一致。'],
    'coupon-dealer-task':['经销商券任务记录','SIT 103 条任务。','批量禁用属于高风险动作。'],
    'coupon-batch':['批量操作优惠券','SIT 15 条历史任务。','未见批量领券记录变更能力。'],
    'coupon-redemption':['领券管理','SIT 日产 15 张券、总数据 4,492 条。','添加优惠券按钮禁用原因待确认。']
  };

  Object.keys(couponPages).forEach(function (key) {
    var item = couponPages[key];
    window.AnnotationData[key] = [
      sourceNote(item[0],item[1]),
      note(2,'[data-anno="coupon-table"]',item[0] + '列表',item[0],item[1],'2026-07-16 SIT 只读检查；历史 Axure 页面树。','查询、分页、查看、编辑、新建和导出均为静态原型交互。','字段结构需保持与 SIT 基线一致；后续变更必须有明确需求依据。',item[2]),
      enumNote()
    ];
  });
})();

  <script data-inline-source="annotations/annotation-runtime.js?v=20260716-6">
(function () {
  'use strict';

  var visible = true;
  var activePopup = null;
  var currentAnno = null;
  var dragState = null;
  var observer = null;

  var sectionFields = [
    ['functionName', '功能名称'],
    ['functionDesc', '功能说明'],
    ['permissionScope', '权限范围'],
    ['dataSource', '数据来源'],
    ['valueLogic', '取值逻辑'],
    ['fieldDesc', '字段说明'],
    ['interactionDesc', '交互说明'],
    ['judgeRule', '判断规则'],
    ['exceptionRule', '异常规则'],
    ['otherDesc', '其他说明']
  ];

  function getConfig() {
    return window.AnnotationConfig || {};
  }

  function getPageKey() {
    var cfg = getConfig();
    if (typeof cfg.page === 'function') return cfg.page();
    if (cfg.page) return cfg.page;
    var active = document.querySelector('.nav-sub-item.active');
    return active && active.id ? active.id : 'index';
  }

  function getRawAnnotations() {
    var cfg = getConfig();
    var page = getPageKey();
    if (cfg.dataKey && Array.isArray(window[cfg.dataKey])) {
      return window[cfg.dataKey].filter(function (item) { return item.page === page; });
    }
    if (window.AnnotationData && Array.isArray(window.AnnotationData[page])) {
      return window.AnnotationData[page];
    }
    return [];
  }

  function storageKey() {
    var cfg = getConfig();
    var projectId = cfg.projectId || window.location.pathname || 'default-project';
    var dataVersion = cfg.dataVersion || '1';
    return ['prototype_annotations', projectId, dataVersion, getPageKey()].join('_');
  }

  function loadCached() {
    try {
      var raw = window.localStorage.getItem(storageKey());
      return raw ? JSON.parse(raw) : [];
    } catch (err) {
      return [];
    }
  }

  function saveCached(items) {
    try {
      window.localStorage.setItem(storageKey(), JSON.stringify(items));
    } catch (err) {
      showToast('保存到浏览器缓存失败');
    }
  }

  function getAnnotations() {
    var source = getRawAnnotations();
    if (!source.length) return [];
    var cached = loadCached();
    var cachedMap = {};
    cached.forEach(function (item) {
      if (item && item.id != null) cachedMap[item.id] = item;
    });
    return source.map(function (item) {
      return clone(cachedMap[item.id] || item);
    }).sort(function (a, b) {
      return Number(a.id) - Number(b.id);
    });
  }

  function clone(value) {
    return JSON.parse(JSON.stringify(value || {}));
  }

  function ensureToggle() {
    var buttons = document.querySelectorAll('#anno-toggle-btn');
    buttons.forEach(function (btn, index) {
      if (index > 0) btn.remove();
    });
    var btn = document.getElementById('anno-toggle-btn');
    if (!btn) {
      btn = document.createElement('button');
      btn.id = 'anno-toggle-btn';
      btn.type = 'button';
      btn.title = '显示/隐藏标注';
      btn.textContent = '●';
      btn.addEventListener('click', function () {
        visible = !visible;
        btn.classList.toggle('anno-hidden', !visible);
        closePopup();
        render();
      });
      document.body.appendChild(btn);
    }
    placeToggle(btn);
  }

  function placeToggle(btn) {
    var topBar = document.querySelector('.top-bar');
    var sideMenu = document.querySelector('.side-menu, .sidebar, .nav-panel');
    var top = topBar ? topBar.getBoundingClientRect().bottom + 12 : 16;
    var left = sideMenu ? sideMenu.getBoundingClientRect().right + 16 : 16;
    btn.style.top = Math.max(16, top) + 'px';
    btn.style.left = Math.max(16, left) + 'px';
  }

  function ensureOverlay() {
    var overlay = document.getElementById('anno-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'anno-overlay';
      document.body.appendChild(overlay);
    }
    return overlay;
  }

  function render() {
    ensureToggle();
    var overlay = ensureOverlay();
    overlay.innerHTML = '';
    if (!visible) return;
    getAnnotations().forEach(function (anno, index) {
      var target = resolveTarget(anno.target);
      if (!target) return;
      var marker = document.createElement('button');
      marker.type = 'button';
      marker.className = 'anno-marker';
      marker.textContent = anno.id || String(index + 1);
      marker.title = anno.title || '';
      marker.addEventListener('click', function (event) {
        event.stopPropagation();
        openPopup(anno, marker);
      });
      overlay.appendChild(marker);
      positionMarker(marker, target, anno.position);
    });
  }

  function resolveTarget(selector) {
    if (!selector) return null;
    try {
      var nodes = document.querySelectorAll(selector);
      return nodes.length === 1 ? nodes[0] : null;
    } catch (err) {
      return null;
    }
  }

  function positionMarker(marker, target, position) {
    var rect = target.getBoundingClientRect();
    var pos = position || {};
    var placement = pos.placement || 'top-right';
    var x = rect.right;
    var y = rect.top;
    if (placement.indexOf('left') >= 0) x = rect.left;
    if (placement.indexOf('bottom') >= 0) y = rect.bottom;
    if (placement.indexOf('center') >= 0) y = rect.top + rect.height / 2;
    marker.style.left = Math.round(x + Number(pos.offsetX || 0) - 10) + 'px';
    marker.style.top = Math.round(y + Number(pos.offsetY || 0) - 10) + 'px';
  }

  function openPopup(anno, marker) {
    closePopup();
    currentAnno = clone(anno);
    currentAnno.desc = currentAnno.desc || generateDesc(currentAnno.sections);
    activePopup = document.createElement('div');
    activePopup.className = 'anno-popup';
    activePopup.innerHTML = buildViewHTML(currentAnno);
    document.body.appendChild(activePopup);
    positionPopup(activePopup, marker);
    bindViewEvents();
    bindDrag();
  }

  function positionPopup(popup, marker) {
    var rect = marker.getBoundingClientRect();
    var popupWidth = popup.offsetWidth;
    var popupHeight = popup.offsetHeight;
    var left = rect.right + 12;
    var top = rect.top;
    if (left + popupWidth > window.innerWidth - 16) {
      left = rect.left - popupWidth - 12;
    }
    left = Math.max(16, Math.min(left, window.innerWidth - popupWidth - 16));
    top = Math.max(16, Math.min(top, window.innerHeight - popupHeight - 16));
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  }

  function fitPopupToViewport(popup) {
    if (!popup) return;
    var rect = popup.getBoundingClientRect();
    var left = Math.max(16, Math.min(rect.left, window.innerWidth - rect.width - 16));
    var top = Math.max(16, Math.min(rect.top, window.innerHeight - rect.height - 16));
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  }

  function buildViewHTML(anno) {
    return ''
      + '<div class="anno-popup-header">'
      + '  <div class="anno-popup-title">' + escapeHTML(anno.title || '未命名标注') + '</div>'
      + '  <button class="anno-popup-close" type="button" title="关闭">&times;</button>'
      + '</div>'
      + '<div class="anno-popup-body"><div class="anno-popup-desc">' + (anno.desc || generateDesc(anno.sections)) + '</div></div>'
      + '<div class="anno-popup-footer">'
      + '  <button class="anno-btn anno-copy" type="button">复制数据</button>'
      + '  <button class="anno-btn anno-btn-primary anno-edit" type="button">编辑</button>'
      + '</div>';
  }

  function buildEditHTML(anno) {
    var sections = anno.sections || {};
    var fields = sectionFields.map(function (field) {
      return ''
        + '<div class="anno-edit-field">'
        + '  <label class="anno-edit-label">' + field[1] + '</label>'
        + '  <textarea class="anno-edit-textarea" data-section="' + field[0] + '">' + escapeHTML(sections[field[0]] || '') + '</textarea>'
        + '</div>';
    }).join('');
    return ''
      + '<div class="anno-popup-header">'
      + '  <div class="anno-popup-title">编辑标注</div>'
      + '  <button class="anno-popup-close" type="button" title="关闭">&times;</button>'
      + '</div>'
      + '<div class="anno-popup-body">'
      + '  <div class="anno-edit-field">'
      + '    <label class="anno-edit-label">标注标题</label>'
      + '    <input class="anno-edit-input" id="anno-edit-title" value="' + escapeHTML(anno.title || '') + '">'
      + '  </div>'
      + fields
      + '</div>'
      + '<div class="anno-popup-footer">'
      + '  <button class="anno-btn anno-cancel" type="button">取消</button>'
      + '  <button class="anno-btn anno-copy" type="button">复制数据</button>'
      + '  <button class="anno-btn anno-btn-primary anno-save" type="button">保存</button>'
      + '</div>';
  }

  function bindViewEvents() {
    activePopup.querySelector('.anno-popup-close').addEventListener('click', closePopup);
    activePopup.querySelector('.anno-copy').addEventListener('click', copyCurrent);
    activePopup.querySelector('.anno-edit').addEventListener('click', function () {
      activePopup.innerHTML = buildEditHTML(currentAnno);
      bindEditEvents();
      bindDrag();
      fitPopupToViewport(activePopup);
    });
  }

  function bindEditEvents() {
    activePopup.querySelector('.anno-popup-close').addEventListener('click', closePopup);
    activePopup.querySelector('.anno-cancel').addEventListener('click', function () {
      activePopup.innerHTML = buildViewHTML(currentAnno);
      bindViewEvents();
      bindDrag();
      fitPopupToViewport(activePopup);
    });
    activePopup.querySelector('.anno-copy').addEventListener('click', copyCurrent);
    activePopup.querySelector('.anno-save').addEventListener('click', saveEdit);
  }

  function saveEdit() {
    currentAnno.title = activePopup.querySelector('#anno-edit-title').value.trim();
    currentAnno.sections = {};
    activePopup.querySelectorAll('[data-section]').forEach(function (field) {
      currentAnno.sections[field.getAttribute('data-section')] = field.value.trim();
    });
    sectionFields.forEach(function (field) {
      if (!(field[0] in currentAnno.sections)) currentAnno.sections[field[0]] = '';
    });
    currentAnno.desc = generateDesc(currentAnno.sections);
    var items = getAnnotations();
    var found = false;
    items = items.map(function (item) {
      if (item.id === currentAnno.id) {
        found = true;
        return clone(currentAnno);
      }
      return item;
    });
    if (!found) items.push(clone(currentAnno));
    saveCached(items);
    activePopup.innerHTML = buildViewHTML(currentAnno);
    bindViewEvents();
    bindDrag();
    fitPopupToViewport(activePopup);
    showToast('已保存到浏览器缓存');
  }

  function copyCurrent() {
    if (!currentAnno) return;
    copyText(JSON.stringify(currentAnno, null, 2));
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { showToast('数据已复制'); });
      return;
    }
    var input = document.createElement('textarea');
    input.value = text;
    input.style.position = 'fixed';
    input.style.left = '-9999px';
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    input.remove();
    showToast('数据已复制');
  }

  function bindDrag() {
    var header = activePopup.querySelector('.anno-popup-header');
    header.addEventListener('mousedown', function (event) {
      if (event.target.closest('button')) return;
      var rect = activePopup.getBoundingClientRect();
      dragState = { x: event.clientX - rect.left, y: event.clientY - rect.top };
      event.preventDefault();
    });
  }

  function closePopup() {
    if (activePopup) activePopup.remove();
    activePopup = null;
    currentAnno = null;
    dragState = null;
  }

  function generateDesc(sections) {
    var data = sections || {};
    return sectionFields.map(function (field, index) {
      return (index + 1) + '. ' + field[1] + '：' + escapeHTML(data[field[0]] || '待确认');
    }).join('<br>');
  }

  function escapeHTML(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function showToast(text) {
    var old = document.querySelector('.anno-toast');
    if (old) old.remove();
    var toast = document.createElement('div');
    toast.className = 'anno-toast';
    toast.textContent = text;
    document.body.appendChild(toast);
    setTimeout(function () { toast.remove(); }, 1800);
  }

  document.addEventListener('mousemove', function (event) {
    if (!dragState || !activePopup) return;
    var x = Math.max(8, Math.min(event.clientX - dragState.x, window.innerWidth - activePopup.offsetWidth - 8));
    var y = Math.max(8, Math.min(event.clientY - dragState.y, window.innerHeight - activePopup.offsetHeight - 8));
    activePopup.style.left = x + 'px';
    activePopup.style.top = y + 'px';
  });

  document.addEventListener('mouseup', function () {
    dragState = null;
    fitPopupToViewport(activePopup);
  });

  window.addEventListener('resize', function () {
    render();
    fitPopupToViewport(activePopup);
  });
  window.addEventListener('scroll', render, true);

  function observeChanges() {
    var root = document.getElementById('page-content') || document.body;
    var _lastRender = 0;
    var _rafPending = false;

    function scheduleRender() {
      var now = Date.now();
      // Burst protection: skip if we rendered within the last 200 ms.
      if (now - _lastRender < 200) return;
      if (_rafPending) return;
      _rafPending = true;
      window.requestAnimationFrame(function () {
        _rafPending = false;
        _lastRender = Date.now();
        render();
      });
    }

    observer = new MutationObserver(function (mutations) {
      // Skip entirely when annotations are hidden.
      if (!visible) return;

      var shouldRender = false;
      for (var i = 0; i < mutations.length; i++) {
        var target = mutations[i].target;
        if (target && target.closest && target.closest('#anno-overlay, #anno-toggle-btn, .anno-popup, .anno-toast')) {
          continue;
        }
        shouldRender = true;
        break;
      }
      if (!shouldRender) return;

      window.clearTimeout(observer._debounceTimer);
      observer._debounceTimer = window.setTimeout(scheduleRender, 300);
    });
    observer.observe(root, { childList: true, subtree: true });
  }

  function init() {
    try {
      ensureToggle();
      ensureOverlay();
      render();
      observeChanges();
    } catch (err) {
      console.warn('[AnnotationRuntime] init failed:', err);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  window.AnnotationRuntime = {
    refresh: render,
    getPageKey: getPageKey,
    getAnnotations: getAnnotations,
    close: closePopup
  };
})();
