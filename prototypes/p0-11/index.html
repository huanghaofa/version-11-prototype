/* ========================================
   Global B端 Design Tokens & Shared Components
   ======================================== */

:root {
  /* ---- Color Palette ---- */
  --color-primary: #3370ff;
  --color-primary-hover: #2860e1;
  --color-success: #34c759;
  --color-warning: #ff9500;
  --color-danger: #ff3b30;
  --color-info: #5ac8fa;

  --color-text-primary: #1f2329;
  --color-text-secondary: #646a73;
  --color-text-disabled: #c0c4cc;
  --color-text-placeholder: #8f959e;

  --color-bg-page: #f5f6f8;
  --color-bg-white: #ffffff;
  --color-bg-hover: #f2f3f5;

  --color-border: #e5e6eb;
  --color-border-light: #f0f1f5;
  --color-divider: #ebecf0;

  /* ---- Typography ---- */
  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
  --font-size-xs: 12px;
  --font-size-sm: 13px;
  --font-size-base: 14px;
  --font-size-lg: 16px;
  --font-size-xl: 20px;
  --font-size-xxl: 24px;

  /* ---- Spacing ---- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-lg: 16px;
  --spacing-xl: 24px;
  --spacing-xxl: 32px;

  /* ---- Border Radius ---- */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;

  /* ---- Shadows ---- */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
}

/* ---- Reset ---- */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  color: var(--color-text-primary);
  background: var(--color-bg-page);
  font-family: var(--font-family);
  font-size: var(--font-size-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a {
  color: var(--color-primary);
  text-decoration: none;
}

a:hover {
  color: var(--color-primary-hover);
}

/* ---- Shared Component: Button ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 32px;
  padding: 0 var(--spacing-lg);
  font-size: var(--font-size-base);
  font-weight: 500;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-bg-white);
  color: var(--color-text-primary);
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
  white-space: nowrap;
}

.btn:hover {
  border-color: var(--color-primary);
  color: var(--color-primary);
}

.btn:disabled {
  color: var(--color-text-disabled);
  cursor: not-allowed;
}

.btn-primary {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

.btn-primary:hover {
  background: var(--color-primary-hover);
  border-color: var(--color-primary-hover);
  color: #fff;
}

.btn-danger {
  background: var(--color-danger);
  border-color: var(--color-danger);
  color: #fff;
}

.btn-danger:hover {
  opacity: 0.85;
  color: #fff;
}

/* ---- Shared Component: Table ---- */
.table-wrapper {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--font-size-base);
}

thead th {
  padding: var(--spacing-md) var(--spacing-lg);
  text-align: left;
  font-weight: 600;
  color: var(--color-text-secondary);
  background: var(--color-bg-hover);
  border-bottom: 1px solid var(--color-border);
  white-space: nowrap;
}

tbody td {
  padding: var(--spacing-md) var(--spacing-lg);
  border-bottom: 1px solid var(--color-border-light);
}

tbody tr:hover {
  background: var(--color-bg-hover);
}

/* ---- Shared Component: Form ---- */
.form-group {
  margin-bottom: var(--spacing-lg);
}

.form-label {
  display: block;
  margin-bottom: var(--spacing-xs);
  font-size: var(--font-size-base);
  font-weight: 500;
  color: var(--color-text-primary);
}

.form-input,
.form-select,
.form-textarea {
  width: 100%;
  height: 32px;
  padding: 0 var(--spacing-md);
  font-size: var(--font-size-base);
  font-family: var(--font-family);
  color: var(--color-text-primary);
  background: var(--color-bg-white);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  outline: none;
  transition: border-color 0.2s ease;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus {
  border-color: var(--color-primary);
}

.form-input::placeholder {
  color: var(--color-text-placeholder);
}

.form-textarea {
  height: auto;
  min-height: 80px;
  padding: var(--spacing-sm) var(--spacing-md);
  resize: vertical;
}

/* ---- Shared Component: Card ---- */
.card {
  background: var(--color-bg-white);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--spacing-xl);
  box-shadow: var(--shadow-sm);
}

/* ---- Shared Component: Modal / Dialog ---- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal-content {
  background: var(--color-bg-white);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  min-width: 420px;
  max-width: 90vw;
  max-height: 80vh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--spacing-lg) var(--spacing-xl);
  border-bottom: 1px solid var(--color-border);
}

.modal-body {
  padding: var(--spacing-xl);
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: var(--spacing-sm);
  padding: var(--spacing-lg) var(--spacing-xl);
  border-top: 1px solid var(--color-border);
}

.modal-header h2,
.modal-header p {
  margin: 0;
}

/* ---- Shared Component: Pagination ---- */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-xs);
  padding: var(--spacing-lg) 0;
}

.pagination-item {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 32px;
  height: 32px;
  padding: 0 var(--spacing-sm);
  font-size: var(--font-size-base);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-bg-white);
  color: var(--color-text-primary);
  cursor: pointer;
  transition: all 0.2s ease;
}

.pagination-item:hover {
  border-color: var(--color-primary);
  color: var(--color-primary);
}

.pagination-item.active {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

/* ---- Shared Component: Advanced Search Bar ---- */
.search-bar {
  display: flex;
  align-items: center;
  gap: var(--spacing-md);
  padding: var(--spacing-lg);
  background: var(--color-bg-white);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  margin-bottom: var(--spacing-lg);
}

.search-bar .form-input,
.search-bar .form-select {
  width: auto;
  min-width: 160px;
}

/* ---- Utility ---- */
.text-secondary {
  color: var(--color-text-secondary);
}

.text-muted {
  color: var(--color-text-disabled);
}

.mt-lg {
  margin-top: var(--spacing-lg);
}

.mb-lg {
  margin-bottom: var(--spacing-lg);
}

/* Prototype annotation runtime. All selectors are scoped with anno-. */
#anno-toggle-btn {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 99990;
  width: 28px;
  height: 28px;
  border: 2px solid #ff4d4f;
  border-radius: 50%;
  background: #fff;
  color: #ff4d4f;
  box-shadow: 0 4px 14px rgba(255, 77, 79, 0.25);
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  line-height: 1;
}

#anno-toggle-btn:hover {
  background: #fff1f0;
}

#anno-toggle-btn.anno-hidden {
  border-color: #d9d9d9;
  color: #8c8c8c;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
}

#anno-overlay {
  position: fixed;
  inset: 0;
  z-index: 99980;
  pointer-events: none;
}

.anno-marker {
  position: fixed;
  z-index: 99981;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 999px;
  border: 2px solid #fff;
  background: #ff4d4f;
  color: #fff;
  box-shadow: 0 4px 12px rgba(255, 77, 79, 0.35);
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
  line-height: 18px;
  text-align: center;
  pointer-events: auto;
  user-select: none;
}

.anno-marker:hover {
  transform: scale(1.12);
}

.anno-popup {
  position: fixed;
  z-index: 99992;
  width: 560px;
  min-width: min(420px, calc(100vw - 32px));
  min-height: 300px;
  max-width: calc(100vw - 32px);
  max-height: calc(100vh - 32px);
  display: flex;
  flex-direction: column;
  resize: both;
  overflow: hidden;
  border-radius: 8px;
  background: #fff;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18);
  color: #262626;
}

.anno-popup-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid #f0f0f0;
  background: #fafafa;
  cursor: move;
  user-select: none;
  flex-shrink: 0;
}

.anno-popup-title {
  font-size: 15px;
  font-weight: 700;
}

.anno-popup-close {
  border: 0;
  background: transparent;
  color: #8c8c8c;

(function () {
  'use strict';

  window.escapeHTML = function (value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  };

  window.showToast = function (message, type) {
    var root = document.getElementById('toast-root');
    if (!root) return;
    var toast = document.createElement('div');
    toast.className = 'toast toast-' + (type || 'success');
    toast.textContent = message;
    root.appendChild(toast);
    window.setTimeout(function () {
      toast.classList.add('toast-leave');
      window.setTimeout(function () { toast.remove(); }, 220);
    }, 2600);
  };

  window.closeModal = function () {
    var overlay = document.querySelector('.modal-overlay[data-prototype-modal]');
    if (overlay) overlay.remove();
  };
})();

    rule: {

    { value: 'partialMutex', number: '4', label: '部分互斥', help: '对应原“与指定券互斥”' },
    { value: 'partialBoth', number: '5', label: '部分叠加互斥', help: '新增：同时维护两组部分券名单', isNew: true }
  ];

  function getModeLabel(mode) {

  }

  function relationshipConfigRows() {
    var rule = window.PrototypeState.rule;
    var relations = [];
    if (rule.stackScope === 'all') {

    } else if (rule.stackScope === 'specified') {
      window.getCouponsByIds(rule.stackCouponIds).forEach(function (coupon) {

      });

      window.getCouponsByIds(rule.mutexCouponIds).forEach(function (coupon) {

    var primaryCoupons = window.MockData.primaryCoupons;
    var rows = [];

    rule.mode = mode;
    rule.stackScope = mode === 'allStack' ? 'all' : ((mode === 'partialStack' || mode === 'partialBoth') ? 'specified' : 'none');
    rule.mutexScope = mode === 'allMutex' ? 'all' : ((mode === 'partialMutex' || mode === 'partialBoth') ? 'specified' : 'none');
    window.navigateTo('activity-edit');
  }

  function setRuleError(kind, message) {
    var node = document.querySelector('[data-rule-error="' + kind + '"]');
    if (node) node.textContent = message || '';
  }

  function validateRule() {
    var rule = window.PrototypeState.rule;
    setRuleError('stack', '');
    setRuleError('mutex', '');
    if (rule.stackScope === 'specified' && !rule.stackCouponIds.length) {
      setRuleError('stack', '请选择至少 1 张叠加券');
      return '叠加规则选择了“指定券”，但还没有选择卡券';
    }
    if (rule.mutexScope === 'specified' && !rule.mutexCouponIds.length) {
      setRuleError('mutex', '请选择至少 1 张互斥券');
      return '互斥规则选择了“指定券”，但还没有选择卡券';
    }
    if (rule.mode === 'partialBoth') {
      var duplicate = rule.stackCouponIds.find(function (id) {
        return rule.mutexCouponIds.indexOf(id) >= 0;
      });
      if (duplicate) return '同一张目标券不能同时配置为叠加和互斥';
    }
    return '';
  }

  function save(andPreview) {
    var error = validateRule();
    var errorNode = document.querySelector('[data-save-error]');
    if (error) {
      if (errorNode) errorNode.textContent = error;
      window.showToast(error, 'error');
      return;
    }
    if (errorNode) errorNode.textContent = '';
    window.PrototypeState.savedAt = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    window.showToast('卡券组合使用规则已保存', 'success');
    if (andPreview) {
      window.setTimeout(function () { window.navigateTo('relation-preview'); }, 350);
    }
  }

  function removeCoupon(kind, couponId) {
    var rule = window.PrototypeState.rule;
    var key = kind === 'stack' ? 'stackCouponIds' : 'mutexCouponIds';
    rule[key] = rule[key].filter(function (id) { return id !== couponId; });
    window.navigateTo('activity-edit');
  }

  function renderMatrixModal() {
    var html = '<div class="modal-overlay" data-prototype-modal><div class="modal-content matrix-modal">' +
      '<div class="modal-header"><div><h2>规则方式说明</h2><p>新增方式不改变历史规则的解释</p></div><button class="modal-close" type="button" data-close-modal>×</button></div>' +
      '<div class="modal-body"><div class="matrix-grid">' +
      '<div class="matrix-item allowed"><span>历史</span><strong>方式 1–4</strong><p>继续按原有单一叠加或单一互斥规则保存和回显。</p></div>' +
      '<div class="matrix-item allowed"><span>新增</span><strong>部分叠加互斥</strong><p>分别维护两组部分券名单，两组卡券不能重复。</p></div>' +
      '<div class="matrix-item allowed"><span>兼容</span><strong>历史数据无需迁移</strong><p>旧枚举值保持原意，不自动转换为双规则配置。</p></div>' +
      '<div class="matrix-item blocked"><span>阻止</span><strong>同券同时叠加和互斥</strong><p>选择或导入阶段即阻止，并给出冲突原因。</p></div>' +
      '</div><div class="priority-callout"><strong>最终判断顺序</strong><span>活动互斥</span><i>›</i><span>卡券互斥</span><i>›</i><span>卡券叠加</span><i>›</i><span>默认不可组合</span></div></div>' +
      '<div class="modal-footer"><button class="btn btn-primary" type="button" data-close-modal>我知道了</button></div></div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
  }

  function validateImportIds(ids, kind) {
    var rule = window.PrototypeState.rule;
    var targetIds = kind === 'stack' ? rule.stackCouponIds : rule.mutexCouponIds;
    var oppositeIds = rule.mode === 'partialBoth' ? (kind === 'stack' ? rule.mutexCouponIds : rule.stackCouponIds) : [];
    var oppositeLabel = kind === 'stack' ? '互斥' : '叠加';
    var seen = {};
    return ids.map(function (rawId, index) {
      var couponId = String(rawId || '').trim();
      var coupon = window.getCouponById(couponId);
      var result = {
        row: index + 2,
        couponId: couponId || '-',
        couponName: coupon ? coupon.name : '-',
        status: 'success',
        label: '可导入',
        reason: '校验通过'
      };
      if (!couponId) {
        result.status = 'fail';
        result.label = '不可导入';
        result.reason = '卡券 ID 为空';
      } else if (seen[couponId]) {
        result.status = 'fail';
        result.label = '不可导入';
        result.reason = '文件内卡券 ID 重复';
      } else if (!coupon) {
        result.status = 'fail';
        result.label = '不可导入';
        result.reason = '卡券 ID 不存在';
      } else if (coupon.status !== '已发布') {
        result.status = 'fail';
        result.label = '不可导入';
        result.reason = '卡券状态为“' + coupon.status + '”';
      } else if (oppositeIds.indexOf(couponId) >= 0) {
        result.status = 'fail';
        result.label = '不可导入';
        result.reason = '已在' + oppositeLabel + '关系中';
      } else if (targetIds.indexOf(couponId) >= 0) {
        result.status = 'skip';
        result.label = '已存在';
        result.reason = '当前名单已包含，无需重复导入';
      }
      if (couponId) seen[couponId] = true;
      return result;
    });
  }

  function importSummary() {
    var rows = importState ? importState.rows : [];
    return {
      success: rows.filter(function (row) { return row.status === 'success'; }).length,
      skip: rows.filter(function (row) { return row.status === 'skip'; }).length,
      fail: rows.filter(function (row) { return row.status === 'fail'; }).length
    };
  }

  function renderImportRows() {
    if (!importState) return '';
    var rows = importState.rows.filter(function (row) {
      return importState.filter === 'all' || row.status === importState.filter;
    });
    if (!rows.length) {
      return '<tr><td colspan="5"><div class="table-empty">当前分类没有数据</div></td></tr>';
    }
    return rows.map(function (row) {
      return '<tr><td>' + row.row + '</td><td><strong>' + window.escapeHTML(row.couponId) + '</strong></td>' +
        '<td>' + window.escapeHTML(row.couponName) + '</td>' +
        '<td><span class="import-status import-status-' + row.status + '">' + row.label + '</span></td>' +
        '<td>' + window.escapeHTML(row.reason) + '</td></tr>';
    }).join('');
  }

  function renderImportModal() {
    if (!importState) return;
    window.closeModal();
    var isStack = importState.kind === 'stack';
    var kindLabel = isStack ? '叠加券' : '互斥券';
    var config = window.MockData.batchImport;
    var hasResult = importState.rows.length > 0;
    var summary = importSummary();
    var body = '';
    if (!hasResult) {
      body = '<div class="import-stepbar"><div class="active"><span>1</span><strong>上传文件</strong></div><i></i><div><span>2</span><strong>预校验并确认</strong></div></div>' +
        '<div class="template-card"><div><strong>第一步：下载导入模板</strong><p>卡券 ID 必填，卡券名称可选；不要修改表头。</p></div>' +
        '<a class="btn" href="assets/templates/卡券叠加互斥关系批量导入模板.csv" download>下载模板</a></div>' +
        '<div class="import-upload"><input type="file" accept=".xlsx,.xls,.csv" data-import-file id="import-file-input">' +
        '<label for="import-file-input"><span class="upload-icon">↑</span><strong>第二步：上传已填写的文件</strong>' +
        '<p>点击选择或拖拽文件到此处</p><small>支持 ' + config.acceptedExtensions + '，最多 ' + config.maxRows + ' 行，不超过 ' + config.maxFileSizeMB + 'MB</small></label>' +
        '<button class="text-button sample-import-button" type="button" data-use-sample-import>加载示例文件演示</button></div>' +
        '<div class="import-rule-list"><strong>导入校验规则</strong><ul><li>卡券必须存在且状态为“已发布”</li>' +
        '<li>已配置为' + (isStack ? '互斥' : '叠加') + '的券不可导入当前关系</li><li>当前名单已有券自动跳过，文件内重复行不导入</li></ul></div>';
    } else {
      body = '<div class="import-stepbar"><div class="done"><span>✓</span><strong>文件已上传</strong></div><i></i><div class="active"><span>2</span><strong>预校验并确认</strong></div></div>' +
        '<div class="import-file-meta"><div><span class="file-icon">X</span><div><strong>' + window.escapeHTML(importState.fileName) + '</strong><p>共 ' + importState.rows.length + ' 行，已完成预校验</p></div></div>' +
        '<button class="text-button" type="button" data-import-reset>重新上传</button></div>' +
        '<div class="import-summary"><div class="success"><small>可导入</small><strong>' + summary.success + '</strong></div>' +
        '<div class="skip"><small>已存在</small><strong>' + summary.skip + '</strong></div><div class="fail"><small>不可导入</small><strong>' + summary.fail + '</strong></div></div>' +
        '<div class="import-result-tabs"><button type="button" data-import-filter="all" class="' + (importState.filter === 'all' ? 'active' : '') + '">全部 ' + importState.rows.length + '</button>' +
        '<button type="button" data-import-filter="success" class="' + (importState.filter === 'success' ? 'active' : '') + '">可导入 ' + summary.success + '</button>' +
        '<button type="button" data-import-filter="skip" class="' + (importState.filter === 'skip' ? 'active' : '') + '">已存在 ' + summary.skip + '</button>' +
        '<button type="button" data-import-filter="fail" class="' + (importState.filter === 'fail' ? 'active' : '') + '">不可导入 ' + summary.fail + '</button></div>' +
        '<div class="import-result-table table-wrapper"><table><thead><tr><th>行号</th><th>卡券 ID</th><th>卡券名称</th><th>校验结果</th><th>说明</th></tr></thead><tbody data-import-rows>' + renderImportRows() + '</tbody></table></div>' +
        '<div class="import-partial-note"><span>i</span><p>确认后仅导入通过的 ' + summary.success + ' 行；已存在和不可导入行不会写入。</p></div>';
    }
    var html = '<div class="modal-overlay" data-prototype-modal><div class="modal-content import-modal">' +
      '<div class="modal-header"><div><h2>批量导入' + kindLabel + '</h2><p>导入对象：当前活动的部分' + kindLabel + '名单</p></div><button class="modal-close" type="button" data-close-modal>×</button></div>' +
      '<div class="modal-body">' + body + '</div><div class="modal-footer"><button class="btn" type="button" data-close-modal>取消</button>' +
      (hasResult ? '<button class="btn btn-primary" type="button" data-import-confirm' + (summary.success ? '' : ' disabled') + '>确认导入 ' + summary.success + ' 张卡券</button>' : '') +
      '</div></div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
  }

  function openImport(kind) {
    selectorState = null;
    importState = { kind: kind, fileName: '', rows: [], filter: 'all' };
    renderImportModal();
  }

  function loadImportIds(ids, fileName) {
    if (!importState) return;
    if (ids.length > window.MockData.batchImport.maxRows) {
      window.showToast('文件超过 ' + window.MockData.batchImport.maxRows + ' 行，请拆分后重新上传', 'error');
      return;
    }
    importState.fileName = fileName;
    importState.rows = validateImportIds(ids, importState.kind);
    importState.filter = 'all';
    renderImportModal();
  }

  function readImportFile(file) {
    if (!importState || !file) return;
    var config = window.MockData.batchImport;
    var extension = file.name.split('.').pop().toLowerCase();
    if (['xlsx', 'xls', 'csv'].indexOf(extension) < 0) {
      window.showToast('文件格式不正确，请上传 Excel 或 CSV 文件', 'error');
      return;
    }
    if (file.size > config.maxFileSizeMB * 1024 * 1024) {
      window.showToast('文件超过 ' + config.maxFileSizeMB + 'MB，请拆分后上传', 'error');
      return;
    }
    if (extension !== 'csv') {
      loadImportIds(config.sampleIds[importState.kind], file.name);
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      var lines = String(reader.result || '').split(/\r?\n/).filter(function (line) { return line.trim(); });
      var ids = lines.slice(1).map(function (line) { return line.split(',')[0].replace(/^\uFEFF/, '').trim(); });
      loadImportIds(ids, file.name);
    };
    reader.readAsText(file);
  }

  function confirmImport() {
    if (!importState) return;
    var successIds = importState.rows.filter(function (row) { return row.status === 'success'; }).map(function (row) { return row.couponId; });
    var kind = importState.kind;
    var key = kind === 'stack' ? 'stackCouponIds' : 'mutexCouponIds';
    successIds.forEach(function (couponId) {
      if (window.PrototypeState.rule[key].indexOf(couponId) < 0) window.PrototypeState.rule[key].push(couponId);
    });
    window.closeModal();
    importState = null;
    window.navigateTo('activity-edit');
    window.showToast('已导入 ' + successIds.length + ' 张' + (kind === 'stack' ? '叠加券' : '互斥券') + '，失败行未写入', 'success');
  }

  function renderSelectorTable() {
    if (!selectorState) return;
    var body = document.querySelector('[data-selector-body]');
    var count = document.querySelector('[data-temp-count]');
    if (!body) return;
    var kind = selectorState.kind;
    var oppositeIds = window.PrototypeState.rule.mode === 'partialBoth' ?
      (kind === 'stack' ? window.PrototypeState.rule.mutexCouponIds : window.PrototypeState.rule.stackCouponIds) : [];
    var keyword = selectorState.keyword.toLowerCase();
    var items = window.MockData.candidateCoupons.filter(function (coupon) {
      var keywordMatch = !keyword || coupon.name.toLowerCase().indexOf(keyword) >= 0 || coupon.id.toLowerCase().indexOf(keyword) >= 0;
      var typeMatch = selectorState.type === 'all' || coupon.type === selectorState.type;
      var selectedMatch = selectorState.tab !== 'selected' || selectorState.tempIds.indexOf(coupon.id) >= 0;
      return keywordMatch && typeMatch && selectedMatch;
    });
    if (!items.length) {
      body.innerHTML = '<tr><td colspan="6"><div class="table-empty">没有符合条件的卡券</div></td></tr>';
    } else {
      body.innerHTML = items.map(function (coupon) {
        var inOpposite = oppositeIds.indexOf(coupon.id) >= 0;
        var unavailable = coupon.status !== '已发布';
        var disabled = inOpposite || unavailable;
        var selected = selectorState.tempIds.indexOf(coupon.id) >= 0;
        var reason = inOpposite ? '已在' + (kind === 'stack' ? '互斥' : '叠加') + '列表中' : (unavailable ? '当前状态不可选' : '');
        return '<tr class="' + (disabled ? 'row-disabled' : '') + '">' +
          '<td><label class="table-check"><input type="checkbox" data-selector-check value="' + coupon.id + '"' +
          (selected ? ' checked' : '') + (disabled ? ' disabled' : '') + '><span></span></label></td>' +
          '<td><strong>' + window.escapeHTML(coupon.name) + '</strong><div class="cell-sub">' + coupon.id + '</div>' +
          (reason ? '<div class="disabled-reason">' + reason + '</div>' : '') + '</td>' +
          '<td><span class="type-pill">' + coupon.type + '</span></td>' +
          '<td>' + coupon.scene + '</td>' +
          '<td>' + window.escapeHTML(coupon.sourceActivity) + '</td>' +
          '<td><span class="status-tag ' + (coupon.status === '已发布' ? 'status-success' : 'status-muted') + '">' + coupon.status + '</span></td>' +
          '</tr>';
      }).join('');
    }
    if (count) count.textContent = selectorState.tempIds.length;
  }

  function openSelector(kind) {
    var rule = window.PrototypeState.rule;
    selectorState = {
      kind: kind,
      tempIds: (kind === 'stack' ? rule.stackCouponIds : rule.mutexCouponIds).slice(),
      keyword: '',
      type: 'all',
      tab: 'available'
    };
    var title = kind === 'stack' ? '选择叠加卡券' : '选择互斥卡券';
    var html = '<div class="modal-overlay" data-prototype-modal><div class="modal-content selector-modal">' +
      '<div class="modal-header"><div><h2>' + title + '</h2><p>已在另一规则中的卡券不可重复选择</p></div><button class="modal-close" type="button" data-close-modal>×</button></div>' +
      '<div class="selector-tabs"><button class="active" type="button" data-selector-tab="available">可选卡券</button>' +
      '<button type="button" data-selector-tab="selected">已选（<span data-temp-count>' + selectorState.tempIds.length + '</span>）</button></div>' +
      '<div class="selector-toolbar"><label class="search-box"><span>⌕</span><input type="search" placeholder="搜索卡券名称或 ID" data-selector-search></label>' +
      '<select class="form-select compact-select" data-selector-type><option value="all">全部卡券属性</option><option value="促销券">促销券</option><option value="权益券">权益券</option></select>' +
      '<button type="button" class="btn" data-open-import="' + kind + '">批量导入</button></div>' +
      '<div class="selector-table table-wrapper"><table><thead><tr><th></th><th>卡券名称 / ID</th><th>卡券属性</th><th>业务场景</th><th>来源活动</th><th>状态</th></tr></thead>' +
      '<tbody data-selector-body></tbody></table></div>' +
      '<div class="selector-footnote"><span>规则提示</span> 权益券是否参与商城计算沿用现有已确认口径；此处仍展示其选择状态供评审。</div>' +
      '<div class="modal-footer"><button class="btn" type="button" data-close-modal>取消</button><button class="btn btn-primary" type="button" data-selector-confirm>确认选择</button></div>' +
      '</div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
    renderSelectorTable();
  }

  function bindDocumentClick(event) {
    var target = event.target;
    var close = target.closest('[data-close-modal]');
    if (close) {
      window.closeModal();
      selectorState = null;
      importState = null;
      return;
    }
    var openImportButton = target.closest('[data-open-import]');
    if (openImportButton) {
      openImport(openImportButton.getAttribute('data-open-import'));
      return;
    }
    if (target.closest('[data-use-sample-import]') && importState) {
      loadImportIds(window.MockData.batchImport.sampleIds[importState.kind], window.MockData.batchImport.sampleFileName);
      return;
    }
    if (target.closest('[data-import-reset]') && importState) {
      importState.fileName = '';
      importState.rows = [];
      importState.filter = 'all';
      renderImportModal();
      return;
    }
    var importFilter = target.closest('[data-import-filter]');
    if (importFilter && importState) {
      importState.filter = importFilter.getAttribute('data-import-filter');
      renderImportModal();
      return;
    }
    if (target.closest('[data-import-confirm]') && importState) {
      confirmImport();
      return;
    }
    var tab = target.closest('[data-selector-tab]');
    if (tab && selectorState) {
      selectorState.tab = tab.getAttribute('data-selector-tab');
      document.querySelectorAll('[data-selector-tab]').forEach(function (item) {
        item.classList.toggle('active', item === tab);
      });
      renderSelectorTable();
      return;
    }
    var confirm = target.closest('[data-selector-confirm]');
    if (confirm && selectorState) {
      var key = selectorState.kind === 'stack' ? 'stackCouponIds' : 'mutexCouponIds';
      window.PrototypeState.rule[key] = selectorState.tempIds.slice();
      window.closeModal();
      selectorState = null;
      window.navigateTo('activity-edit');
    }
  }

  function init() {
    document.querySelectorAll('input[name="rule-mode"]').forEach(function (input) {
      input.addEventListener('change', function () {
        handleModeChange(this.value);
      });
    });
    document.querySelectorAll('[data-open-selector]').forEach(function (button) {
      button.addEventListener('click', function () { openSelector(this.getAttribute('data-open-selector')); });
    });
    document.querySelectorAll('[data-remove-coupon]').forEach(function (button) {
      button.addEventListener('click', function () {
        removeCoupon(this.getAttribute('data-kind'), this.getAttribute('data-remove-coupon'));
      });
    });
    document.querySelector('[data-action="save"]').addEventListener('click', function () { save(false); });
    document.querySelector('[data-action="save-preview"]').addEventListener('click', function () { save(true); });
    document.querySelector('[data-action="cancel"]').addEventListener('click', function () {
      window.showToast('演示原型未接入真实活动列表', 'warning');
    });
    document.querySelector('[data-action="view-primary"]').addEventListener('click', function () {
      window.showToast('卡券详情沿用现有卡券选择与详情能力，本次不改', 'success');
    });
    if (!document.body.dataset.selectorBound) {
      document.body.dataset.selectorBound = 'true';
      document.addEventListener('click', bindDocumentClick);
      document.addEventListener('change', function (event) {
        if (event.target.matches('[data-import-file]') && importState) {
          readImportFile(event.target.files && event.target.files[0]);
          return;
        }
        if (event.target.matches('[data-selector-check]') && selectorState) {
          var id = event.target.value;
          if (event.target.checked) {
            if (selectorState.tempIds.indexOf(id) < 0) selectorState.tempIds.push(id);
          } else {
            selectorState.tempIds = selectorState.tempIds.filter(function (item) { return item !== id; });
          }
          renderSelectorTable();
        }
        if (event.target.matches('[data-selector-type]') && selectorState) {
          selectorState.type = event.target.value;
          renderSelectorTable();
        }
      });
      document.addEventListener('input', function (event) {
        if (event.target.matches('[data-selector-search]') && selectorState) {
          selectorState.keyword = event.target.value.trim();
          renderSelectorTable();
        }
      });
    }
  }

  window.Pages['activity-edit'] = {
    render: render,
    init: init
  };
})();

</script>
  <script data-inline-source="js/pages/relation-preview.js?v=20260810c">
(function () {
  'use strict';

  function relationshipTableRows(primary, rule, stackCoupons, mutexCoupons) {
    var relations = [];
    if (rule.stackScope === 'all') {
      relations.push({ target: '全部券', id: 'ALL', relation: '与全部券叠加', activityId: '-' });
    } else if (rule.stackScope === 'specified') {
      stackCoupons.forEach(function (coupon) {
        relations.push({ target: coupon.name, id: coupon.id, relation: '与指定券叠加', activityId: 'ACT-SRC-' + coupon.id.slice(-4) });
      });
    }
    if (rule.mutexScope === 'all') {
      relations.push({ target: '全部券', id: 'ALL', relation: '与全部券互斥', activityId: '-' });
    } else if (rule.mutexScope === 'specified') {
      mutexCoupons.forEach(function (coupon) {
        relations.push({ target: coupon.name, id: coupon.id, relation: '与指定券互斥', activityId: 'ACT-SRC-' + coupon.id.slice(-4) });
      });
    }
    if (!relations.length) {
      return '<tr><td colspan="7"><div class="table-empty">暂无卡券关系</div></td></tr>';
    }
    var rows = [];
    primary.forEach(function (mainCoupon) {
      relations.forEach(function (relation) {
        rows.push('<tr><td>' + (rows.length + 1) + '</td><td><strong>' + mainCoupon.id + '</strong></td>' +
          '<td>' + window.escapeHTML(mainCoupon.name) + '</td><td><strong>' + relation.id + '</strong></td>' +
          '<td>' + window.escapeHTML(relation.target) + '</td><td><span class="relation-text">' + relation.relation + '</span></td>' +
          '<td>' + relation.activityId + '</td></tr>');
      });
    });
    return rows.join('');
  }

  function render() {
    var activity = window.MockData.activity;
    var primary = window.MockData.primaryCoupons;
    var rule = window.PrototypeState.rule;
    var stackCoupons = rule.stackScope === 'specified' ? window.getCouponsByIds(rule.stackCouponIds) : [];
    var mutexCoupons = rule.mutexScope === 'specified' ? window.getCouponsByIds(rule.mutexCouponIds) : [];
    var relationTargetCount = stackCoupons.length + mutexCoupons.length + (rule.stackScope === 'all' ? 1 : 0) + (rule.mutexScope === 'all' ? 1 : 0);
    return '<section class="card legacy-relation-list">' +
      '<div class="legacy-list-title"><div><h1>互斥关系列表</h1><p>功能说明：此处可以查看在活动中心中已配置的活动互斥、卡券互斥关系；卡券页同时展示叠加关系。</p></div>' +
      '<button class="btn" type="button" data-back-edit>返回活动配置</button></div>' +
      '<div class="legacy-tabs"><button type="button">活动互斥</button><button type="button" class="active">卡券互斥</button></div>' +
      '<div class="legacy-query"><label><span>主卡券ID：</span><input class="form-input" type="text" placeholder="请输入"></label>' +
      '<label><span>主卡券名称：</span><input class="form-input" type="text" placeholder="请输入"></label>' +
      '<div><button class="btn" type="button" data-query-reset>重置</button><button class="btn btn-primary" type="button" data-query>查询</button></div></div>' +
      '<div class="legacy-table-head"><div><i></i><strong>卡券关系列表</strong><span>当前方式：' + window.getRuleModeLabel(rule.mode) + '</span></div><span>共 ' + (primary.length * relationTargetCount) + ' 条</span></div>' +
      '<div class="table-wrapper"><table class="relationship-table"><thead><tr><th>序号</th><th>主卡券ID</th><th>主卡券名称</th><th>叠加/互斥卡券ID</th><th>叠加/互斥卡券名称</th><th>叠加/互斥关系</th><th>来源活动ID</th></tr></thead><tbody>' +
      relationshipTableRows(primary, rule, stackCoupons, mutexCoupons) + '</tbody></table></div></section>';
  }

  function init() {
    document.querySelector('[data-back-edit]').addEventListener('click', function () {
      window.navigateTo('activity-edit');
    });
    document.querySelector('[data-query]').addEventListener('click', function () {
      window.showToast('已按当前条件查询', 'success');
    });
    document.querySelector('[data-query-reset]').addEventListener('click', function () {
      document.querySelectorAll('.legacy-query input').forEach(function (input) { input.value = ''; });
      window.showToast('查询条件已重置', 'success');
    });
  }

  window.Pages['relation-preview'] = {
    render: render,
    init: init
  };
})();

</script>
  <script data-inline-source="js/nav.js?v=20260810c">
(function () {
  'use strict';

  var _config = null;
  var _currentPage = 'activity-edit';

  /* ---- Load nav config from config/nav.json ---- */
  function loadConfig() {
    return fetch('config/nav.json?v=20260810b')
      .then(function (res) { return res.json(); })
      .then(function (cfg) {
        _config = cfg;
        render();
        window.navigateTo(_currentPage);
      })
      .catch(function (err) {
        console.warn('Failed to load config/nav.json, using empty menu:', err);
        var navEl = document.getElementById('main-nav');
        if (navEl) {
          navEl.innerHTML = '<p style="padding:16px;color:#ff4d4f;font-size:12px;line-height:1.6;">⚠️ 导航加载失败<br>请通过 HTTP 服务器打开页面：<br><code>python3 -m http.server 8080</code></p>';
        }
      });
  }

  /* ---- Render menu tree into #main-nav ---- */
  function render() {
    var navEl = document.getElementById('main-nav');
    if (!navEl || !_config || !_config.menu) return;
    var html = buildTree(_config.menu, 0);
    navEl.innerHTML = html;
    bindClicks(navEl);
    highlightCurrent();
  }

  function buildTree(items, depth) {
    if (!items || !items.length) return '';
    var cls = depth === 0 ? 'nav-list nav-list--root' : 'nav-list nav-list--sub';
    return '<ul class="' + cls + '">' + items.map(function (item) {
      var hasChildren = item.children && item.children.length;
      var linkCls = 'nav-link' + (hasChildren ? ' nav-link--group' : '');
      var icon = item.icon ? '<span class="nav-icon">' + item.icon + '</span>' : '';
      return '<li class="nav-item' + (hasChildren ? ' nav-item--group' : '') + '">' +
        '<a href="#" class="' + linkCls + '" data-page="' + (item.key || '') + '">' +
        icon + '<span class="nav-label">' + (item.label || '') + '</span></a>' +
        (hasChildren ? buildTree(item.children, depth + 1) : '') +
        '</li>';
    }).join('') + '</ul>';
  }

  function bindClicks(navEl) {
    var links = navEl.querySelectorAll('.nav-link[data-page]');
    Array.prototype.forEach.call(links, function (link) {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        var pageKey = this.getAttribute('data-page');
        if (pageKey) window.navigateTo(pageKey);
      });
    });
  }

  function highlightCurrent() {
    var navEl = document.getElementById('main-nav');
    if (!navEl) return;
    var prev = navEl.querySelector('.nav-link.active');
    if (prev) prev.classList.remove('active');
    var cur = navEl.querySelector('.nav-link[data-page="' + _currentPage + '"]');
    if (cur) cur.classList.add('active');
  }

  /* ---- Navigate to page ---- */
  window.navigateTo = function (pageKey) {
    if (pageKey === 'retention') return;
    _currentPage = pageKey;
    var page = window.Pages && window.Pages[pageKey];
    if (!page || typeof page.render !== 'function') return;
    document.getElementById('app').innerHTML = page.render();
    if (typeof page.init === 'function') page.init();
    var currentLabel = document.getElementById('breadcrumb-current');
    if (currentLabel) {
      currentLabel.textContent = pageKey === 'relation-preview' ? '保客活动互斥关系' : '活动创建';
    }
    if (window.AnnotationRuntime && typeof window.AnnotationRuntime.refresh === 'function') {
      window.AnnotationRuntime.refresh();
    }
    highlightCurrent();
  };

  window.getCurrentPage = function () {
    return _currentPage;
  };

  window.getNavConfig = function () {
    return _config;
  };

  /* ---- Init ---- */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadConfig);
  } else {
    loadConfig();
  }
})();

  <script data-inline-source="annotations/annotation-runtime.js">
(function () {
  'use strict';

  var visible = true;
  var activePopup = null;
  var currentAnno = null;
  var dragState = null;
  var observer = null;

  var sectionFields = [
    ['functionName', '功能名称'],
    ['functionDesc', '功能说明'],
    ['permissionScope', '权限范围'],
    ['dataSource', '数据来源'],
    ['valueLogic', '取值逻辑'],
    ['fieldDesc', '字段说明'],
    ['interactionDesc', '交互说明'],
    ['judgeRule', '判断规则'],
    ['exceptionRule', '异常规则'],
    ['otherDesc', '其他说明']
  ];

  function getConfig() {
    return window.AnnotationConfig || {};
  }

  function getPageKey() {
    var cfg = getConfig();
    if (typeof cfg.page === 'function') return cfg.page();
    if (cfg.page) return cfg.page;
    var active = document.querySelector('.nav-sub-item.active');
    return active && active.id ? active.id : 'index';
  }

  function getRawAnnotations() {
    var cfg = getConfig();
    var page = getPageKey();
    if (cfg.dataKey && Array.isArray(window[cfg.dataKey])) {
      return window[cfg.dataKey].filter(function (item) { return item.page === page; });
    }
    if (window.AnnotationData && Array.isArray(window.AnnotationData[page])) {
      return window.AnnotationData[page];
    }
    return [];
  }

  function storageKey() {
    var cfg = getConfig();
    var projectId = cfg.projectId || window.location.pathname || 'default-project';
    var dataVersion = cfg.dataVersion || '1';
    return ['prototype_annotations', projectId, dataVersion, getPageKey()].join('_');
  }

  function loadCached() {
    try {
      var raw = window.localStorage.getItem(storageKey());
      return raw ? JSON.parse(raw) : [];
    } catch (err) {
      return [];
    }
  }

  function saveCached(items) {
    try {
      window.localStorage.setItem(storageKey(), JSON.stringify(items));
    } catch (err) {
      showToast('保存到浏览器缓存失败');
    }
  }

  function getAnnotations() {
    var source = getRawAnnotations();
    if (!source.length) return [];
    var cached = loadCached();
    var cachedMap = {};
    cached.forEach(function (item) {
      if (item && item.id != null) cachedMap[item.id] = item;
    });
    return source.map(function (item) {
      return clone(cachedMap[item.id] || item);
    }).sort(function (a, b) {
      return Number(a.id) - Number(b.id);
    });
  }

  function clone(value) {
    return JSON.parse(JSON.stringify(value || {}));
  }

  function ensureToggle() {
    var buttons = document.querySelectorAll('#anno-toggle-btn');
    buttons.forEach(function (btn, index) {
      if (index > 0) btn.remove();
    });
    var btn = document.getElementById('anno-toggle-btn');
    if (!btn) {
      btn = document.createElement('button');
      btn.id = 'anno-toggle-btn';
      btn.type = 'button';
      btn.title = '显示/隐藏标注';
      btn.textContent = '●';
      btn.addEventListener('click', function () {
        visible = !visible;
        btn.classList.toggle('anno-hidden', !visible);
        closePopup();
        render();
      });
      document.body.appendChild(btn);
    }
    placeToggle(btn);
  }

  function placeToggle(btn) {
    var topBar = document.querySelector('.top-bar');
    var sideMenu = document.querySelector('.side-menu, .sidebar, .nav-panel');
    var top = topBar ? topBar.getBoundingClientRect().bottom + 12 : 16;
    var left = sideMenu ? sideMenu.getBoundingClientRect().right + 16 : 16;
    btn.style.top = Math.max(16, top) + 'px';
    btn.style.left = Math.max(16, left) + 'px';
  }

  function ensureOverlay() {
    var overlay = document.getElementById('anno-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'anno-overlay';
      document.body.appendChild(overlay);
    }
    return overlay;
  }

  function render() {
    ensureToggle();
    var overlay = ensureOverlay();
    overlay.innerHTML = '';
    if (!visible) return;
    getAnnotations().forEach(function (anno, index) {
      var target = resolveTarget(anno.target);
      if (!target) return;
      var marker = document.createElement('button');
      marker.type = 'button';
      marker.className = 'anno-marker';
      marker.textContent = anno.id || String(index + 1);
      marker.title = anno.title || '';
      marker.addEventListener('click', function (event) {
        event.stopPropagation();
        openPopup(anno, marker);
      });
      overlay.appendChild(marker);
      positionMarker(marker, target, anno.position);
    });
  }

  function resolveTarget(selector) {
    if (!selector) return null;
    try {
      var nodes = document.querySelectorAll(selector);
      return nodes.length === 1 ? nodes[0] : null;
    } catch (err) {
      return null;
    }
  }

  function positionMarker(marker, target, position) {
    var rect = target.getBoundingClientRect();
    var pos = position || {};
    var placement = pos.placement || 'top-right';
    var x = rect.right;
    var y = rect.top;
    if (placement.indexOf('left') >= 0) x = rect.left;
    if (placement.indexOf('bottom') >= 0) y = rect.bottom;
    if (placement.indexOf('center') >= 0) y = rect.top + rect.height / 2;
    marker.style.left = Math.round(x + Number(pos.offsetX || 0) - 10) + 'px';
    marker.style.top = Math.round(y + Number(pos.offsetY || 0) - 10) + 'px';
  }

  function openPopup(anno, marker) {
    closePopup();
    currentAnno = clone(anno);
    currentAnno.desc = currentAnno.desc || generateDesc(currentAnno.sections);
    activePopup = document.createElement('div');
    activePopup.className = 'anno-popup';
    activePopup.innerHTML = buildViewHTML(currentAnno);
    document.body.appendChild(activePopup);
    positionPopup(activePopup, marker);
    bindViewEvents();
    bindDrag();
  }

  function positionPopup(popup, marker) {
    var rect = marker.getBoundingClientRect();
    var popupWidth = popup.offsetWidth;
    var popupHeight = popup.offsetHeight;
    var left = rect.right + 12;
    var top = rect.top;
    if (left + popupWidth > window.innerWidth - 16) {
      left = rect.left - popupWidth - 12;
    }
    left = Math.max(16, Math.min(left, window.innerWidth - popupWidth - 16));
    top = Math.max(16, Math.min(top, window.innerHeight - popupHeight - 16));
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  }

  function fitPopupToViewport(popup) {
    if (!popup) return;
    var rect = popup.getBoundingClientRect();
    var left = Math.max(16, Math.min(rect.left, window.innerWidth - rect.width - 16));
    var top = Math.max(16, Math.min(rect.top, window.innerHeight - rect.height - 16));
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  }

  function buildViewHTML(anno) {
    return ''
      + '<div class="anno-popup-header">'
      + '  <div class="anno-popup-title">' + escapeHTML(anno.title || '未命名标注') + '</div>'
      + '  <button class="anno-popup-close" type="button" title="关闭">&times;</button>'
      + '</div>'
      + '<div class="anno-popup-body"><div class="anno-popup-desc">' + (anno.desc || generateDesc(anno.sections)) + '</div></div>'
      + '<div class="anno-popup-footer">'
      + '  <button class="anno-btn anno-copy" type="button">复制数据</button>'
      + '  <button class="anno-btn anno-btn-primary anno-edit" type="button">编辑</button>'
      + '</div>';
  }

  function buildEditHTML(anno) {
    var sections = anno.sections || {};
    var fields = sectionFields.map(function (field) {
      return ''
        + '<div class="anno-edit-field">'
        + '  <label class="anno-edit-label">' + field[1] + '</label>'
        + '  <textarea class="anno-edit-textarea" data-section="' + field[0] + '">' + escapeHTML(sections[field[0]] || '') + '</textarea>'
        + '</div>';
    }).join('');
    return ''
      + '<div class="anno-popup-header">'
      + '  <div class="anno-popup-title">编辑标注</div>'
      + '  <button class="anno-popup-close" type="button" title="关闭">&times;</button>'
      + '</div>'
      + '<div class="anno-popup-body">'
      + '  <div class="anno-edit-field">'
      + '    <label class="anno-edit-label">标注标题</label>'
      + '    <input class="anno-edit-input" id="anno-edit-title" value="' + escapeHTML(anno.title || '') + '">'
      + '  </div>'
      + fields
      + '</div>'
      + '<div class="anno-popup-footer">'
      + '  <button class="anno-btn anno-cancel" type="button">取消</button>'
      + '  <button class="anno-btn anno-copy" type="button">复制数据</button>'
      + '  <button class="anno-btn anno-btn-primary anno-save" type="button">保存</button>'
      + '</div>';
  }

  function bindViewEvents() {
    activePopup.querySelector('.anno-popup-close').addEventListener('click', closePopup);
    activePopup.querySelector('.anno-copy').addEventListener('click', copyCurrent);
    activePopup.querySelector('.anno-edit').addEventListener('click', function () {
      activePopup.innerHTML = buildEditHTML(currentAnno);
      bindEditEvents();
      bindDrag();
      fitPopupToViewport(activePopup);
    });
  }

  function bindEditEvents() {
    activePopup.querySelector('.anno-popup-close').addEventListener('click', closePopup);
    activePopup.querySelector('.anno-cancel').addEventListener('click', function () {
      activePopup.innerHTML = buildViewHTML(currentAnno);
      bindViewEvents();
      bindDrag();
      fitPopupToViewport(activePopup);
    });
    activePopup.querySelector('.anno-copy').addEventListener('click', copyCurrent);
    activePopup.querySelector('.anno-save').addEventListener('click', saveEdit);
  }

  function saveEdit() {
    currentAnno.title = activePopup.querySelector('#anno-edit-title').value.trim();
    currentAnno.sections = {};
    activePopup.querySelectorAll('[data-section]').forEach(function (field) {
      currentAnno.sections[field.getAttribute('data-section')] = field.value.trim();
    });
    sectionFields.forEach(function (field) {
      if (!(field[0] in currentAnno.sections)) currentAnno.sections[field[0]] = '';
    });
    currentAnno.desc = generateDesc(currentAnno.sections);
    var items = getAnnotations();
    var found = false;
    items = items.map(function (item) {
      if (item.id === currentAnno.id) {
        found = true;
        return clone(currentAnno);
      }
      return item;
    });
    if (!found) items.push(clone(currentAnno));
    saveCached(items);
    activePopup.innerHTML = buildViewHTML(currentAnno);
    bindViewEvents();
    bindDrag();
    fitPopupToViewport(activePopup);
    showToast('已保存到浏览器缓存');
  }

  function copyCurrent() {
    if (!currentAnno) return;
    copyText(JSON.stringify(currentAnno, null, 2));
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { showToast('数据已复制'); });
      return;
    }
    var input = document.createElement('textarea');
    input.value = text;
    input.style.position = 'fixed';
    input.style.left = '-9999px';
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    input.remove();
    showToast('数据已复制');
  }

  function bindDrag() {
    var header = activePopup.querySelector('.anno-popup-header');
    header.addEventListener('mousedown', function (event) {
      if (event.target.closest('button')) return;
      var rect = activePopup.getBoundingClientRect();
      dragState = { x: event.clientX - rect.left, y: event.clientY - rect.top };
      event.preventDefault();
    });
  }

  function closePopup() {
    if (activePopup) activePopup.remove();
    activePopup = null;
    currentAnno = null;
    dragState = null;
  }

  function generateDesc(sections) {
    var data = sections || {};
    return sectionFields.map(function (field, index) {
      return (index + 1) + '. ' + field[1] + '：' + escapeHTML(data[field[0]] || '待确认');
    }).join('<br>');
  }

  function escapeHTML(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function showToast(text) {
    var old = document.querySelector('.anno-toast');
    if (old) old.remove();
    var toast = document.createElement('div');
    toast.className = 'anno-toast';
    toast.textContent = text;
    document.body.appendChild(toast);
    setTimeout(function () { toast.remove(); }, 1800);
  }

  document.addEventListener('mousemove', function (event) {
    if (!dragState || !activePopup) return;
    var x = Math.max(8, Math.min(event.clientX - dragState.x, window.innerWidth - activePopup.offsetWidth - 8));
    var y = Math.max(8, Math.min(event.clientY - dragState.y, window.innerHeight - activePopup.offsetHeight - 8));
    activePopup.style.left = x + 'px';
    activePopup.style.top = y + 'px';
  });

  document.addEventListener('mouseup', function () {
    dragState = null;
    fitPopupToViewport(activePopup);
  });

  window.addEventListener('resize', function () {
    render();
    fitPopupToViewport(activePopup);
  });
  window.addEventListener('scroll', render, true);

  function observeChanges() {
    var root = document.getElementById('page-content') || document.body;
    var _lastRender = 0;
    var _rafPending = false;

    function scheduleRender() {
      var now = Date.now();
      // Burst protection: skip if we rendered within the last 200 ms.
      if (now - _lastRender < 200) return;
      if (_rafPending) return;
      _rafPending = true;
      window.requestAnimationFrame(function () {
        _rafPending = false;
        _lastRender = Date.now();
        render();
      });
    }

    observer = new MutationObserver(function (mutations) {
      // Skip entirely when annotations are hidden.
      if (!visible) return;

      var shouldRender = false;
      for (var i = 0; i < mutations.length; i++) {
        var target = mutations[i].target;
        if (target && target.closest && target.closest('#anno-overlay, #anno-toggle-btn, .anno-popup, .anno-toast')) {
          continue;
        }
        shouldRender = true;
        break;
      }
      if (!shouldRender) return;

      window.clearTimeout(observer._debounceTimer);
      observer._debounceTimer = window.setTimeout(scheduleRender, 300);
    });
    observer.observe(root, { childList: true, subtree: true });
  }

  function init() {
    try {
      ensureToggle();
      ensureOverlay();
      render();
      observeChanges();
    } catch (err) {
      console.warn('[AnnotationRuntime] init failed:', err);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  window.AnnotationRuntime = {
    refresh: render,
    getPageKey: getPageKey,
    getAnnotations: getAnnotations,
    close: closePopup
  };
})();

</script>
