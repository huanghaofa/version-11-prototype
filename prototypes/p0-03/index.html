/* ========================================
   Global B端 Design Tokens & Shared Components
   ======================================== */

:root {
  /* ---- Color Palette ---- */
  --color-primary: #3370ff;
  --color-primary-hover: #2860e1;
  --color-success: #34c759;
  --color-warning: #ff9500;
  --color-danger: #ff3b30;
  --color-info: #5ac8fa;

  --color-text-primary: #1f2329;
  --color-text-secondary: #646a73;
  --color-text-disabled: #c0c4cc;
  --color-text-placeholder: #8f959e;

  --color-bg-page: #f5f6f8;
  --color-bg-white: #ffffff;
  --color-bg-hover: #f2f3f5;

  --color-border: #e5e6eb;
  --color-border-light: #f0f1f5;
  --color-divider: #ebecf0;

  /* ---- Typography ---- */
  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
  --font-size-xs: 12px;
  --font-size-sm: 13px;
  --font-size-base: 14px;
  --font-size-lg: 16px;
  --font-size-xl: 20px;
  --font-size-xxl: 24px;

  /* ---- Spacing ---- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-lg: 16px;
  --spacing-xl: 24px;
  --spacing-xxl: 32px;

  /* ---- Border Radius ---- */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;

  /* ---- Shadows ---- */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
}

/* ---- Reset ---- */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  color: var(--color-text-primary);
  background: var(--color-bg-page);
  font-family: var(--font-family);
  font-size: var(--font-size-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a {
  color: var(--color-primary);
  text-decoration: none;
}

a:hover {
  color: var(--color-primary-hover);
}

/* ---- Shared Component: Button ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 32px;
  padding: 0 var(--spacing-lg);
  font-size: var(--font-size-base);
  font-weight: 500;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-bg-white);
  color: var(--color-text-primary);
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
  white-space: nowrap;
}

.btn:hover {
  border-color: var(--color-primary);
  color: var(--color-primary);
}

.btn:disabled {
  color: var(--color-text-disabled);
  cursor: not-allowed;
}

.btn-primary {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

.btn-primary:hover {
  background: var(--color-primary-hover);
  border-color: var(--color-primary-hover);
  color: #fff;
}

.btn-danger {
  background: var(--color-danger);
  border-color: var(--color-danger);
  color: #fff;
}

.btn-danger:hover {
  opacity: 0.85;
  color: #fff;
}

/* ---- Shared Component: Table ---- */
.table-wrapper {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--font-size-base);
}

thead th {
  padding: var(--spacing-md) var(--spacing-lg);
  text-align: left;
  font-weight: 600;
  color: var(--color-text-secondary);
  background: var(--color-bg-hover);
  border-bottom: 1px solid var(--color-border);
  white-space: nowrap;
}

tbody td {
  padding: var(--spacing-md) var(--spacing-lg);
  border-bottom: 1px solid var(--color-border-light);
}

tbody tr:hover {
  background: var(--color-bg-hover);
}

/* ---- Shared Component: Form ---- */
.form-group {
  margin-bottom: var(--spacing-lg);
}

.form-label {
  display: block;
  margin-bottom: var(--spacing-xs);
  font-size: var(--font-size-base);
  font-weight: 500;
  color: var(--color-text-primary);
}

.form-input,
.form-select,
.form-textarea {
  width: 100%;
  height: 32px;
  padding: 0 var(--spacing-md);
  font-size: var(--font-size-base);
  font-family: var(--font-family);
  color: var(--color-text-primary);
  background: var(--color-bg-white);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  outline: none;
  transition: border-color 0.2s ease;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus {
  border-color: var(--color-primary);
}

.form-input::placeholder {
  color: var(--color-text-placeholder);
}

.form-textarea {
  height: auto;
  min-height: 80px;
  padding: var(--spacing-sm) var(--spacing-md);
  resize: vertical;
}

/* ---- Shared Component: Card ---- */
.card {
  background: var(--color-bg-white);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--spacing-xl);
  box-shadow: var(--shadow-sm);
}

/* ---- Shared Component: Modal / Dialog ---- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal-content {
  background: var(--color-bg-white);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  min-width: 420px;
  max-width: 90vw;
  max-height: 80vh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--spacing-lg) var(--spacing-xl);
  border-bottom: 1px solid var(--color-border);
}

.modal-body {
  padding: var(--spacing-xl);
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: var(--spacing-sm);
  padding: var(--spacing-lg) var(--spacing-xl);
  border-top: 1px solid var(--color-border);
}

/* ---- Shared Component: Pagination ---- */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-xs);
  padding: var(--spacing-lg) 0;
}

.pagination-item {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 32px;
  height: 32px;
  padding: 0 var(--spacing-sm);
  font-size: var(--font-size-base);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-bg-white);
  color: var(--color-text-primary);
  cursor: pointer;
  transition: all 0.2s ease;
}

.pagination-item:hover {
  border-color: var(--color-primary);
  color: var(--color-primary);
}

.pagination-item.active {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

/* ---- Shared Component: Advanced Search Bar ---- */
.search-bar {
  display: flex;
  align-items: center;
  gap: var(--spacing-md);
  padding: var(--spacing-lg);
  background: var(--color-bg-white);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  margin-bottom: var(--spacing-lg);
}

.search-bar .form-input,
.search-bar .form-select {
  width: auto;
  min-width: 160px;
}

/* ---- Utility ---- */
.text-secondary {
  color: var(--color-text-secondary);
}

.text-muted {
  color: var(--color-text-disabled);
}

.mt-lg {
  margin-top: var(--spacing-lg);
}

.mb-lg {
  margin-bottom: var(--spacing-lg);
}

</style>

  <script data-inline-source="js/app.js">
(function () {
  'use strict';

  var data = window.MockData;

  function money(value) {
    return '¥' + Number(value || 0).toLocaleString('zh-CN', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  function moneyOrDash(value) {
    return value == null ? '—' : money(value);
  }

  function priceSource(item, type) {
    if (type === 'couponFaceValue') return '卡券中心';
    if (type === 'mallProductPrice' && item.sourceSystem !== '商城') return '不适用';
    return item.sourceSystem;
  }

  function basisSource(item) {
    var map = {
      '商城商品单价': 'mallProductPrice',
      '实际优惠金额': 'actualDiscountAmount',
      '卡券面值': 'couponFaceValue',
      '网点价': 'dealerPrice'
    };
    return priceSource(item, map[item.priceBasisType] || 'actualDiscountAmount');
  }

  function renderPriceCard(item, label, type, value) {
    var basisByType = {
      mallProductPrice: '商城商品单价',
      actualDiscountAmount: '实际优惠金额',
      couponFaceValue: '卡券面值',
      dealerPrice: '网点价'
    };
    var selected = basisByType[type] === item.priceBasisType ? ' selected' : '';
    return '<div class="price-card' + selected + '"><span>' + label + '</span><strong>' + moneyOrDash(value) + '</strong><small>来源：' + priceSource(item, type) + '</small></div>';
  }

  function renderAmountSnapshot(item, type, value, note) {
    var source = priceSource(item, type);
    return '<div class="snapshot-cell"><strong>' + moneyOrDash(value) + '</strong><small>' + source + (note ? ' · ' + note : '') + '</small></div>';
  }

  function safe(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
    });
  }

  function identityColumns(record) {
    return {
      vin: record.vin || '—',
      mobile: record.mobile || '—',
      oneId: record.oneId || '—'
    };
  }

  function renderIdentityColumns(record) {
    var identity = identityColumns(record);
    return '<td class="identity-cell">' + identity.vin + '</td>' +
      '<td class="identity-cell">' + identity.mobile + '</td>' +
      '<td class="identity-cell">' + identity.oneId + '</td>';
  }

  function renderIdentitySummary(record) {
    var identity = identityColumns(record);
    return '<div class="identity-summary"><strong>VIN：' + identity.vin + '</strong><small>手机号码：' + identity.mobile + '</small><small>oneID：' + identity.oneId + '</small></div>';
  }

  function applicableProducts(item) {
    return item.products.filter(function (product) { return product.applicable !== false; });
  }

  function applicableMeta(item) {
    return { count: applicableProducts(item).length, total: item.products.length };
  }

  function applicableMallAmount(item) {
    if (item.sourceSystem !== '商城') return null;
    return applicableProducts(item).reduce(function (sum, product) { return sum + Number(product.amount || 0); }, 0);
  }

  function applicableActualDiscount(item) {
    return applicableProducts(item).reduce(function (sum, product) {
      return sum + Math.max(0, Number(product.discount || 0) - Number(product.refund || 0));
    }, 0);
  }

  function applicableDealerAmount(item) {
    return applicableProducts(item).reduce(function (sum, product) { return sum + Number(product.dealerPrice || 0); }, 0);
  }

  function settlementBasisValue(item) {
    if (item.priceBasisType === '商城商品单价') return applicableMallAmount(item);
    if (item.priceBasisType === '实际优惠金额') return applicableActualDiscount(item);
    if (item.priceBasisType === '卡券面值') return item.couponFaceValue;
    if (item.priceBasisType === '网点价') return applicableDealerAmount(item);
    return item.priceBasisValue;
  }

  function statusMeta(status) {
    var map = {
      refundable: { label: '退款窗口内', cls: 'status-warn' },
      processing: { label: 'E3S 处理中', cls: 'status-info' },
      settled: { label: '已结算', cls: 'status-done' },
      closed: { label: '无需结算', cls: 'status-muted' }
    };
    return map[status] || map.refundable;
  }

  function pageHead(title, subtitle, actions) {
    return '<div class="breadcrumb">卡券中心 <span>/</span> 卡券结算 <span>/</span> ' + title + '</div>' +
      '<div class="page-head"><div><h1>' + title + '</h1><p>' + subtitle + '</p></div><div class="page-actions">' + (actions || '') + '</div></div>';
  }

  function metricCard(label, value, foot, tone) {
    return '<div class="metric-card ' + (tone || '') + '"><div class="metric-label">' + label + '<span class="metric-dot"></span></div>' +
      '<div class="metric-value">' + value + '</div><div class="metric-foot">' + foot + '</div></div>';
  }

  function renderFlow() {
    var steps = [
      ['1', '核销明细回传', '商品、适用性与价格快照'],
      ['2', '筛选适用商品', '不适用商品不进入计算'],
      ['3', '退款/撤销重算', '仅扣减适用商品优惠'],
      ['4', '订单冻结', '不可退款后确定最终金额'],
      ['5', '提交 E3S', '每冻结一次订单提交一次']
    ];
    return '<section class="process-strip"><div class="process-title"><strong>卡券结算链路</strong><span>区分核销渠道与来源系统，不按账期，订单冻结后自动提交</span></div><div class="process-steps">' +
      steps.map(function (step, index) {
        return '<div class="process-step"><span class="step-index">' + step[0] + '</span><div><strong>' + step[1] + '</strong><small>' + step[2] + '</small></div></div>' +
          (index < steps.length - 1 ? '<span class="step-arrow">→</span>' : '');
      }).join('') + '</div></section>';
  }

  function renderReportRows(rows) {
    return rows.map(function (item) {
      var status = statusMeta(item.status);
      var identity = identityColumns(item);
      var applicability = applicableMeta(item);
      var actualDiscount = applicableActualDiscount(item);
      return '<tr data-status="' + item.status + '" data-channel="' + item.writeoffChannel + '" data-source="' + item.sourceSystem + '" data-search="' + [item.id, item.couponName, item.user, item.orderNo, identity.vin, identity.mobile, identity.oneId, item.writeoffChannel, item.sourceSystem].join(' ') + '">' +
        '<td><button class="link-btn detail-btn" data-id="' + item.id + '">' + item.id + '</button><small class="cell-sub">' + item.orderNo + '</small></td>' +
        '<td><strong class="cell-title">' + item.couponName + '</strong><small class="cell-sub">' + item.couponCode + '</small></td>' +
        renderIdentityColumns(item) +
        '<td><span class="writeoff-tag ' + (item.writeoffChannel === '线上' ? 'online' : 'offline') + '">' + item.writeoffChannel + '</span></td>' +
        '<td><span class="source-system-tag">' + item.sourceSystem + '</span></td>' +
        '<td>' + renderAmountSnapshot(item, 'mallProductPrice', applicableMallAmount(item), applicability.count + '/' + applicability.total + ' 件适用') + '</td>' +
        '<td>' + renderAmountSnapshot(item, 'actualDiscountAmount', actualDiscount, '仅适用商品' + (item.refundDeduction ? ' · 已扣退款 ' + money(item.refundDeduction) : '')) + '</td>' +
        '<td>' + renderAmountSnapshot(item, 'couponFaceValue', item.couponFaceValue) + '</td>' +
        '<td>' + renderAmountSnapshot(item, 'dealerPrice', applicableDealerAmount(item), '仅适用商品') + '</td>' +
        '<td><strong class="basis-type">' + item.priceBasisType + '</strong><small class="cell-sub">' + item.priceBasisNote + '</small></td>' +
        '<td class="amount-cell emphasized">' + money(settlementBasisValue(item)) + '</td>' +
        '<td><span class="original-rule">' + item.rule + '</span><small class="cell-sub">规则 ' + item.ruleVersion + '</small></td>' +
        '<td><span class="rule-line">' + money(item.settlement) + '</span></td>' +
        '<td><span class="status-pill ' + status.cls + '"><i></i>' + status.label + '</span><small class="cell-sub">' + item.statusTime + '</small></td>' +
        '<td><button class="link-btn detail-btn" data-id="' + item.id + '">详情</button></td></tr>';
    }).join('');
  }

  function reportPage() {
    return pageHead('卡券实例结算报表', '仅使用卡券适用商品汇总价格与优惠，再按原结算规则计算补贴金额。', '<button class="btn">导出当前结果</button>') +
      renderFlow() +
      '<div class="metrics-grid">' +
        metricCard('卡券实例数', data.summary.total, '线上与线下累计写入', 'metric-blue') +
        metricCard('退款窗口内', data.summary.refundable, '仅展示预计结算金额', 'metric-amber') +
        metricCard('E3S 处理中', data.summary.processing, '订单冻结后已自动提交', 'metric-purple') +
        metricCard('累计已结算', money(data.summary.settledAmount), 'E3S 已确认金额', 'metric-green') + '</div>' +
      '<section class="content-card filter-card"><div class="filter-grid report-filter-grid">' +
        '<label><span>快速搜索</span><input id="keyword" class="form-input" placeholder="实例ID / 订单号 / VIN / 手机号 / oneID"></label>' +
        '<label><span>核销渠道</span><select id="writeoff-channel-filter" class="form-select"><option value="">全部渠道</option><option value="线上">线上</option><option value="线下">线下</option></select></label>' +

      Array.prototype.forEach.call(document.querySelectorAll('#report-body tr'), function (row) {

      Array.prototype.forEach.call(document.querySelectorAll('#rule-body tr'), function (row) {
        var text = row.getAttribute('data-search');
        var matched = (!terms[0] || text.indexOf(terms[0]) > -1) && (!terms[1] || text.indexOf(terms[1]) > -1) && (!terms[2] || text.indexOf(terms[2]) > -1);
        row.hidden = !matched;
        if (matched) visible += 1;
      });
      document.getElementById('rule-result-count').textContent = '共 ' + visible + ' 条';
    }
    document.getElementById('rule-search').addEventListener('click', applyRuleFilter);
    document.getElementById('rule-reset').addEventListener('click', function () { ruleId.value = ''; templateId.value = ''; templateName.value = ''; applyRuleFilter(); });
    document.getElementById('rule-create').addEventListener('click', function () { openRuleModal(); });
    document.getElementById('rule-export').addEventListener('click', function () { window.showToast('已导出当前结算规则列表'); });
    Array.prototype.forEach.call(document.querySelectorAll('.rule-edit'), function (button) { button.addEventListener('click', function () { openRuleModal(this.getAttribute('data-rule-id')); }); });
    Array.prototype.forEach.call(document.querySelectorAll('.rule-delete'), function (button) { button.addEventListener('click', function () { openDeleteRuleModal(this.getAttribute('data-rule-id')); }); });
  }

  function renderSubmissions() {
    return pageHead('E3S 提交记录', '每次订单冻结后，卡券中心通过接口提交一次最终结算。', '<button class="btn" onclick="window.navigateTo(\'settlement-report\')">返回实例报表</button>') +
      '<div class="final-step-banner"><span class="gate-icon">⇄</span><div><strong>E3S 为最后结算步骤</strong><p>不人工勾选，不生成批次。订单退款窗口关闭且最终金额冻结后，系统立即提交一次 E3S 请求。</p></div></div>' +
      '<section class="content-card table-card"><div class="table-toolbar"><div><strong>接口提交记录</strong><span>共 ' + data.submissions.length + ' 条</span></div></div><div class="table-wrapper"><table class="submission-table"><thead><tr><th>请求ID</th><th>订单号</th><th>卡券实例ID</th><th>VIN</th><th>手机号码</th><th>oneID</th><th>结算金额</th><th>提交时间</th><th>E3S 结算单号</th><th>状态</th><th>操作</th></tr></thead><tbody>' +
      data.submissions.map(function (record) { var processing = record.status.indexOf('处理') > -1; return '<tr><td><strong>' + record.requestId + '</strong></td><td>' + record.orderNo + '</td><td><button class="link-btn detail-btn" data-id="' + record.instanceId + '">' + record.instanceId + '</button></td>' + renderIdentityColumns(record) + '<td class="amount-cell emphasized">' + money(record.amount) + '</td><td>' + record.submittedAt + '</td><td>' + record.e3sNo + '</td><td><span class="status-pill ' + (processing ? 'status-info' : 'status-done') + '"><i></i>' + record.status + '</span></td><td><button class="link-btn detail-btn" data-id="' + record.instanceId + '">查看实例</button></td></tr>'; }).join('') +
      '</tbody></table></div></section>';
  }

  function renderSync() {
    return pageHead('商城数据同步', '监控商品优惠拆分、退款明细和不可退款事件。') +
      '<div class="empty-panel"><span>↻</span><h2>数据同步监控</h2><p>本轮原型暂不展开接口级监控，该页保留为后续幂等、重试和对账能力入口。</p></div>';
  }

  window.Pages = {
    'settlement-report': { render: reportPage, init: bindReport },
    'rule-config': { render: renderRules, init: bindRules },
    'e3s-submissions': { render: renderSubmissions, init: bindDetailButtons },
    'sync-monitor': { render: renderSync }
  };
})();

  <script data-inline-source="js/nav.js">
(function () {
  'use strict';

  var _config = null;
  var _currentPage = 'index';

  /* ---- Load nav config from config/nav.json ---- */
  function loadConfig() {
    return fetch('config/nav.json')
      .then(function (res) { return res.json(); })
      .then(function (cfg) {
        _config = cfg;
        render();
        var initialPage = window.location.hash.replace('#', '') || cfg.defaultPage || 'index';
        window.navigateTo(initialPage);
      })
      .catch(function (err) {
        console.warn('Failed to load config/nav.json, using empty menu:', err);
        var navEl = document.getElementById('main-nav');
        if (navEl) {
          navEl.innerHTML = '<p style="padding:16px;color:#ff4d4f;font-size:12px;line-height:1.6;">⚠️ 导航加载失败<br>请通过 HTTP 服务器打开页面：<br><code>python3 -m http.server 8080</code></p>';
        }
      });
  }

  /* ---- Render menu tree into #main-nav ---- */
  function render() {
    var navEl = document.getElementById('main-nav');
    if (!navEl || !_config || !_config.menu) return;
    var html = buildTree(_config.menu, 0);
    navEl.innerHTML = html;
    bindClicks(navEl);
    highlightCurrent();
  }

  function buildTree(items, depth) {
    if (!items || !items.length) return '';
    var cls = depth === 0 ? 'nav-list nav-list--root' : 'nav-list nav-list--sub';
    return '<ul class="' + cls + '">' + items.map(function (item) {
      var hasChildren = item.children && item.children.length;
      var linkCls = 'nav-link' + (hasChildren ? ' nav-link--group' : '');
      var icon = item.icon ? '<span class="nav-icon">' + item.icon + '</span>' : '';
      return '<li class="nav-item' + (hasChildren ? ' nav-item--group' : '') + '">' +
        '<a href="#" class="' + linkCls + '" data-page="' + (item.key || '') + '">' +
        icon + '<span class="nav-label">' + (item.label || '') + '</span></a>' +
        (hasChildren ? buildTree(item.children, depth + 1) : '') +
        '</li>';
    }).join('') + '</ul>';
  }

  function bindClicks(navEl) {
    var links = navEl.querySelectorAll('.nav-link[data-page]');
    Array.prototype.forEach.call(links, function (link) {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        var pageKey = this.getAttribute('data-page');
        if (pageKey) window.navigateTo(pageKey);
      });
    });
  }

  function highlightCurrent() {
    var navEl = document.getElementById('main-nav');
    if (!navEl) return;
    var prev = navEl.querySelector('.nav-link.active');
    if (prev) prev.classList.remove('active');
    var cur = navEl.querySelector('.nav-link[data-page="' + _currentPage + '"]');
    if (cur) cur.classList.add('active');
  }

  /* ---- Navigate to page ---- */
  window.navigateTo = function (pageKey) {
    _currentPage = pageKey;
    var page = window.Pages && window.Pages[pageKey];
    if (!page || typeof page.render !== 'function') return;
    document.getElementById('app').innerHTML = page.render();
    if (typeof page.init === 'function') page.init();
    highlightCurrent();
  };

  window.getCurrentPage = function () {
    return _currentPage;
  };

  window.getNavConfig = function () {
    return _config;
  };

  /* ---- Init ---- */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadConfig);
  } else {
    loadConfig();
  }
})();

</script>

  <script data-inline-source="annotations/annotation-runtime.js">
(function () {
  'use strict';

  var visible = true;
  var activePopup = null;
  var currentAnno = null;
  var dragState = null;
  var observer = null;

  var sectionFields = [
    ['functionName', '功能名称'],
    ['functionDesc', '功能说明'],
    ['permissionScope', '权限范围'],
    ['dataSource', '数据来源'],
    ['valueLogic', '取值逻辑'],
    ['fieldDesc', '字段说明'],
    ['interactionDesc', '交互说明'],
    ['judgeRule', '判断规则'],
    ['exceptionRule', '异常规则'],
    ['otherDesc', '其他说明']
  ];

  function getConfig() {
    return window.AnnotationConfig || {};
  }

  function getPageKey() {
    var cfg = getConfig();
    if (typeof cfg.page === 'function') return cfg.page();
    if (cfg.page) return cfg.page;
    var active = document.querySelector('.nav-sub-item.active');
    return active && active.id ? active.id : 'index';
  }

  function getRawAnnotations() {
    var cfg = getConfig();
    var page = getPageKey();
    if (cfg.dataKey && Array.isArray(window[cfg.dataKey])) {
      return window[cfg.dataKey].filter(function (item) { return item.page === page; });
    }
    if (window.AnnotationData && Array.isArray(window.AnnotationData[page])) {
      return window.AnnotationData[page];
    }
    return [];
  }

  function storageKey() {
    var cfg = getConfig();
    var projectId = cfg.projectId || window.location.pathname || 'default-project';
    var dataVersion = cfg.dataVersion || '1';
    return ['prototype_annotations', projectId, dataVersion, getPageKey()].join('_');
  }

  function loadCached() {
    try {
      var raw = window.localStorage.getItem(storageKey());
      return raw ? JSON.parse(raw) : [];
    } catch (err) {
      return [];
    }
  }

  function saveCached(items) {
    try {
      window.localStorage.setItem(storageKey(), JSON.stringify(items));
    } catch (err) {
      showToast('保存到浏览器缓存失败');
    }
  }

  function getAnnotations() {
    var source = getRawAnnotations();
    if (!source.length) return [];
    var cached = loadCached();
    var cachedMap = {};
    cached.forEach(function (item) {
      if (item && item.id != null) cachedMap[item.id] = item;
    });
    return source.map(function (item) {
      return clone(cachedMap[item.id] || item);
    }).sort(function (a, b) {
      return Number(a.id) - Number(b.id);
    });
  }

  function clone(value) {
    return JSON.parse(JSON.stringify(value || {}));
  }

  function ensureToggle() {
    var buttons = document.querySelectorAll('#anno-toggle-btn');
    buttons.forEach(function (btn, index) {
      if (index > 0) btn.remove();
    });
    var btn = document.getElementById('anno-toggle-btn');
    if (!btn) {
      btn = document.createElement('button');
      btn.id = 'anno-toggle-btn';
      btn.type = 'button';
      btn.title = '显示/隐藏标注';
      btn.textContent = '●';
      btn.addEventListener('click', function () {
        visible = !visible;
        btn.classList.toggle('anno-hidden', !visible);
        closePopup();
        render();
      });
      document.body.appendChild(btn);
    }
    placeToggle(btn);
  }

  function placeToggle(btn) {
    var appSidebar = document.querySelector('.app-sidebar');
    if (appSidebar) {
      btn.style.top = '22px';
      btn.style.left = Math.max(16, appSidebar.getBoundingClientRect().right - 36) + 'px';
      return;
    }
    var topBar = document.querySelector('.top-bar');
    var sideMenu = document.querySelector('.side-menu, .sidebar, .nav-panel');
    var top = topBar ? topBar.getBoundingClientRect().bottom + 12 : 16;
    var left = sideMenu ? sideMenu.getBoundingClientRect().right + 16 : 16;
    btn.style.top = Math.max(16, top) + 'px';
    btn.style.left = Math.max(16, left) + 'px';
  }

  function ensureOverlay() {
    var overlay = document.getElementById('anno-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'anno-overlay';
      document.body.appendChild(overlay);
    }
    return overlay;
  }

  function render() {
    ensureToggle();
    var overlay = ensureOverlay();
    overlay.innerHTML = '';
    if (!visible) return;
    getAnnotations().forEach(function (anno, index) {
      var target = resolveTarget(anno.target);
      if (!target) return;
      var marker = document.createElement('button');
      marker.type = 'button';
      marker.className = 'anno-marker';
      marker.textContent = anno.id || String(index + 1);
      marker.title = anno.title || '';
      marker.addEventListener('click', function (event) {
        event.stopPropagation();
        openPopup(anno, marker);
      });
      overlay.appendChild(marker);
      positionMarker(marker, target, anno.position);
    });
  }

  function resolveTarget(selector) {
    if (!selector) return null;
    try {
      var nodes = document.querySelectorAll(selector);
      return nodes.length === 1 ? nodes[0] : null;
    } catch (err) {
      return null;
    }
  }

  function positionMarker(marker, target, position) {
    var rect = target.getBoundingClientRect();
    var pos = position || {};
    var placement = pos.placement || 'top-right';
    var x = rect.right;
    var y = rect.top;
    if (placement.indexOf('left') >= 0) x = rect.left;
    if (placement.indexOf('bottom') >= 0) y = rect.bottom;
    if (placement.indexOf('center') >= 0) y = rect.top + rect.height / 2;
    marker.style.left = Math.round(x + Number(pos.offsetX || 0) - 10) + 'px';
    marker.style.top = Math.round(y + Number(pos.offsetY || 0) - 10) + 'px';
  }

  function openPopup(anno, marker) {
    closePopup();
    currentAnno = clone(anno);
    currentAnno.desc = currentAnno.desc || generateDesc(currentAnno.sections);
    activePopup = document.createElement('div');
    activePopup.className = 'anno-popup';
    activePopup.innerHTML = buildViewHTML(currentAnno);
    document.body.appendChild(activePopup);
    positionPopup(activePopup, marker);
    bindViewEvents();
    bindDrag();
  }

  function positionPopup(popup, marker) {
    var rect = marker.getBoundingClientRect();
    var popupWidth = popup.offsetWidth;
    var popupHeight = popup.offsetHeight;
    var left = rect.right + 12;
    var top = rect.top;
    if (left + popupWidth > window.innerWidth - 16) {
      left = rect.left - popupWidth - 12;
    }
    left = Math.max(16, Math.min(left, window.innerWidth - popupWidth - 16));
    top = Math.max(16, Math.min(top, window.innerHeight - popupHeight - 16));
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  }

  function fitPopupToViewport(popup) {
    if (!popup) return;
    var rect = popup.getBoundingClientRect();
    var left = Math.max(16, Math.min(rect.left, window.innerWidth - rect.width - 16));
    var top = Math.max(16, Math.min(rect.top, window.innerHeight - rect.height - 16));
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  }

  function buildViewHTML(anno) {
    return ''
      + '<div class="anno-popup-header">'
      + '  <div class="anno-popup-title">' + escapeHTML(anno.title || '未命名标注') + '</div>'
      + '  <button class="anno-popup-close" type="button" title="关闭">&times;</button>'
      + '</div>'
      + '<div class="anno-popup-body"><div class="anno-popup-desc">' + (anno.desc || generateDesc(anno.sections)) + '</div></div>'
      + '<div class="anno-popup-footer">'
      + '  <button class="anno-btn anno-copy" type="button">复制数据</button>'
      + '  <button class="anno-btn anno-btn-primary anno-edit" type="button">编辑</button>'
      + '</div>';
  }

  function buildEditHTML(anno) {
    var sections = anno.sections || {};
    var fields = sectionFields.map(function (field) {
      return ''
        + '<div class="anno-edit-field">'
        + '  <label class="anno-edit-label">' + field[1] + '</label>'
        + '  <textarea class="anno-edit-textarea" data-section="' + field[0] + '">' + escapeHTML(sections[field[0]] || '') + '</textarea>'
        + '</div>';
    }).join('');
    return ''
      + '<div class="anno-popup-header">'
      + '  <div class="anno-popup-title">编辑标注</div>'
      + '  <button class="anno-popup-close" type="button" title="关闭">&times;</button>'
      + '</div>'
      + '<div class="anno-popup-body">'
      + '  <div class="anno-edit-field">'
      + '    <label class="anno-edit-label">标注标题</label>'
      + '    <input class="anno-edit-input" id="anno-edit-title" value="' + escapeHTML(anno.title || '') + '">'
      + '  </div>'
      + fields
      + '</div>'
      + '<div class="anno-popup-footer">'
      + '  <button class="anno-btn anno-cancel" type="button">取消</button>'
      + '  <button class="anno-btn anno-copy" type="button">复制数据</button>'
      + '  <button class="anno-btn anno-btn-primary anno-save" type="button">保存</button>'
      + '</div>';
  }

  function bindViewEvents() {
    activePopup.querySelector('.anno-popup-close').addEventListener('click', closePopup);
    activePopup.querySelector('.anno-copy').addEventListener('click', copyCurrent);
    activePopup.querySelector('.anno-edit').addEventListener('click', function () {
      activePopup.innerHTML = buildEditHTML(currentAnno);
      bindEditEvents();
      bindDrag();
      fitPopupToViewport(activePopup);
    });
  }

  function bindEditEvents() {
    activePopup.querySelector('.anno-popup-close').addEventListener('click', closePopup);
    activePopup.querySelector('.anno-cancel').addEventListener('click', function () {
      activePopup.innerHTML = buildViewHTML(currentAnno);
      bindViewEvents();
      bindDrag();
      fitPopupToViewport(activePopup);
    });
    activePopup.querySelector('.anno-copy').addEventListener('click', copyCurrent);
    activePopup.querySelector('.anno-save').addEventListener('click', saveEdit);
  }

  function saveEdit() {
    currentAnno.title = activePopup.querySelector('#anno-edit-title').value.trim();
    currentAnno.sections = {};
    activePopup.querySelectorAll('[data-section]').forEach(function (field) {
      currentAnno.sections[field.getAttribute('data-section')] = field.value.trim();
    });
    sectionFields.forEach(function (field) {
      if (!(field[0] in currentAnno.sections)) currentAnno.sections[field[0]] = '';
    });
    currentAnno.desc = generateDesc(currentAnno.sections);
    var items = getAnnotations();
    var found = false;
    items = items.map(function (item) {
      if (item.id === currentAnno.id) {
        found = true;
        return clone(currentAnno);
      }
      return item;
    });
    if (!found) items.push(clone(currentAnno));
    saveCached(items);
    activePopup.innerHTML = buildViewHTML(currentAnno);
    bindViewEvents();
    bindDrag();
    fitPopupToViewport(activePopup);
    showToast('已保存到浏览器缓存');
  }

  function copyCurrent() {
    if (!currentAnno) return;
    copyText(JSON.stringify(currentAnno, null, 2));
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { showToast('数据已复制'); });
      return;
    }
    var input = document.createElement('textarea');
    input.value = text;
    input.style.position = 'fixed';
    input.style.left = '-9999px';
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    input.remove();
    showToast('数据已复制');
  }

  function bindDrag() {
    var header = activePopup.querySelector('.anno-popup-header');
    header.addEventListener('mousedown', function (event) {
      if (event.target.closest('button')) return;
      var rect = activePopup.getBoundingClientRect();
      dragState = { x: event.clientX - rect.left, y: event.clientY - rect.top };
      event.preventDefault();
    });
  }

  function closePopup() {
    if (activePopup) activePopup.remove();
    activePopup = null;
    currentAnno = null;
    dragState = null;
  }

  function generateDesc(sections) {
    var data = sections || {};
    return sectionFields.map(function (field, index) {
      return (index + 1) + '. ' + field[1] + '：' + escapeHTML(data[field[0]] || '待确认');
    }).join('<br>');
  }

  function escapeHTML(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function showToast(text) {
    var old = document.querySelector('.anno-toast');
    if (old) old.remove();
    var toast = document.createElement('div');
    toast.className = 'anno-toast';
    toast.textContent = text;
    document.body.appendChild(toast);
    setTimeout(function () { toast.remove(); }, 1800);
  }

  document.addEventListener('mousemove', function (event) {
    if (!dragState || !activePopup) return;
    var x = Math.max(8, Math.min(event.clientX - dragState.x, window.innerWidth - activePopup.offsetWidth - 8));
    var y = Math.max(8, Math.min(event.clientY - dragState.y, window.innerHeight - activePopup.offsetHeight - 8));
    activePopup.style.left = x + 'px';
    activePopup.style.top = y + 'px';
  });

  document.addEventListener('mouseup', function () {
    dragState = null;
    fitPopupToViewport(activePopup);
  });

  window.addEventListener('resize', function () {
    render();
    fitPopupToViewport(activePopup);
  });
  window.addEventListener('scroll', render, true);

  function observeChanges() {
    var root = document.getElementById('page-content') || document.body;
    var _lastRender = 0;
    var _rafPending = false;

    function scheduleRender() {
      var now = Date.now();
      // Burst protection: skip if we rendered within the last 200 ms.
      if (now - _lastRender < 200) return;
      if (_rafPending) return;
      _rafPending = true;
      window.requestAnimationFrame(function () {
        _rafPending = false;
        _lastRender = Date.now();
        render();
      });
    }

    observer = new MutationObserver(function (mutations) {
      // Skip entirely when annotations are hidden.
      if (!visible) return;

      var shouldRender = false;
      for (var i = 0; i < mutations.length; i++) {
        var target = mutations[i].target;
        if (target && target.closest && target.closest('#anno-overlay, #anno-toggle-btn, .anno-popup, .anno-toast')) {
          continue;
        }
        shouldRender = true;
        break;
      }
      if (!shouldRender) return;

      window.clearTimeout(observer._debounceTimer);
      observer._debounceTimer = window.setTimeout(scheduleRender, 300);
    });
    observer.observe(root, { childList: true, subtree: true });
  }

  function init() {
    try {
      ensureToggle();
      ensureOverlay();
      render();
      observeChanges();
    } catch (err) {
      console.warn('[AnnotationRuntime] init failed:', err);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  window.AnnotationRuntime = {
    refresh: render,
    getPageKey: getPageKey,
    getAnnotations: getAnnotations,
    close: closePopup
  };
})();

</script>
